<!DOCTYPE html>

<script>
  // Set tema sedini mungkin biar tidak "kedip" warna salah saat halaman dibuka.
  (function () {
    try {
      var t = localStorage.getItem("rp_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
      if (localStorage.getItem("rp_sidebar") === "collapsed") {
        document.documentElement.setAttribute("data-sidebar", "collapsed");
      }
    } catch (e) {}
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    /* ===== Token yang SELALU sama di kedua tema (identitas brand) ===== */
    --rp-serif: 'Fraunces', Georgia, serif;
    --rp-brand-font: 'Playfair Display', 'Fraunces', Georgia, serif;
    --rp-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --rp-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --rp-btn-text: #F4F1E4;

    /* ===== Token yang beda per tema — default GELAP ("navy ledger") di sini,
       ditimpa oleh [data-theme="light"] di bawah ===== */
    --rp-page-bg: #0A0D16;
    --rp-grid-line: rgba(140,163,191,0.055);
    --rp-grid-dot: rgba(140,163,191,0.075);
    --rp-sidebar-bg: rgba(10,13,21,0.92);
    --rp-surface: rgba(18,22,35,0.86);
    --rp-surface-2: rgba(23,28,43,0.86);
    --rp-surface-solid: #131829;
    --rp-border: rgba(140,163,191,0.17);
    --rp-border-strong: rgba(140,163,191,0.34);
    --rp-ink: #EDE7D8;
    --rp-ink-dim: #8E9CB6;
    --rp-line: rgba(140,163,191,0.17);
    --rp-hover-tint: rgba(140,163,191,0.1);
    --rp-input-bg: rgba(150,175,210,0.045);
    --rp-th-bg: rgba(150,175,210,0.03);
    --rp-neutral-tint: rgba(140,163,191,0.13);
    --rp-overlay: rgba(3,5,11,0.68);
    --rp-elevation-shadow: rgba(1,3,10,0.6);
    --rp-panel-shadow: 0 14px 34px -18px rgba(1,4,16,0.7);
    --rp-panel-highlight: rgba(185,205,235,0.065);
    --rp-scrollbar: rgba(140,163,191,0.3);
    --rp-scrollbar-hover: rgba(140,163,191,0.48);
    --rp-focus-ring: rgba(157,187,221,0.3);
    --rp-accent-rgb: 157,187,221;

    --rp-chip-bg: #EDE7D8;
    --rp-chip-text: #14213B;

    --rp-red: #E2695A;
    --rp-red-tint: rgba(226,105,90,0.14);
    --rp-red-ring: rgba(226,105,90,0.45);
    --rp-red-glow: rgba(226,105,90,0.4);
    --rp-teal: #4FAE9C;
    --rp-teal-tint: rgba(79,174,156,0.14);
    --rp-amber: #DDA753;
    --rp-amber-tint: rgba(221,167,83,0.16);
    --rp-navy: #9DBBDD;
    --rp-navy-soft: #64809F;
  }
  [data-theme="light"] {
    --rp-page-bg: #EFE8D8;
    --rp-grid-line: rgba(35,43,61,0.045);
    --rp-grid-dot: rgba(35,43,61,0.05);
    --rp-sidebar-bg: rgba(231,222,200,0.92);
    --rp-surface: rgba(231,222,200,0.9);
    --rp-surface-2: rgba(231,222,200,0.96);
    --rp-surface-solid: #EFE8D8;
    --rp-border: #C9BFA4;
    --rp-border-strong: #B8AC8C;
    --rp-ink: #232B3D;
    --rp-ink-dim: #6B6656;
    --rp-line: #C9BFA4;
    --rp-hover-tint: rgba(35,43,61,0.06);
    --rp-input-bg: #FFFFFF;
    --rp-th-bg: #E7DEC8;
    --rp-neutral-tint: rgba(107,102,86,0.12);
    --rp-overlay: rgba(35,43,61,0.35);
    --rp-elevation-shadow: rgba(35,43,61,0.18);
    --rp-panel-shadow: 0 10px 24px -18px rgba(35,43,61,0.3);
    --rp-panel-highlight: rgba(255,255,255,0.5);
    --rp-scrollbar: rgba(35,43,61,0.18);
    --rp-scrollbar-hover: rgba(35,43,61,0.3);
    --rp-focus-ring: rgba(27,58,99,0.18);
    --rp-accent-rgb: 27,58,99;

    --rp-chip-bg: #232B3D;
    --rp-chip-text: #F4F1E4;

    --rp-red: #B23A2E;
    --rp-red-tint: rgba(178,58,46,0.12);
    --rp-red-ring: rgba(178,58,46,0.4);
    --rp-red-glow: rgba(178,58,46,0.22);
    --rp-teal: #2F6F62;
    --rp-teal-tint: rgba(47,111,98,0.12);
    --rp-amber: #C6852E;
    --rp-amber-tint: rgba(198,133,46,0.14);
    --rp-navy: #1B3A63;
    --rp-navy-soft: #8CA3BF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background-color: var(--rp-page-bg);
    background-image:
      linear-gradient(var(--rp-grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--rp-grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-attachment: fixed;
    color: var(--rp-ink);
    font-family: var(--rp-sans);
    transition: background-color .2s ease, color .2s ease;
  }
  #root { display: flex; min-height: 100vh; }
  .rp-mono { font-family: var(--rp-mono); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rp-scrollbar); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--rp-scrollbar-hover); }

  /* Sidebar
     PENTING: sengaja TANPA backdrop-filter blur. Elemen ini position:fixed
     di HP (jadi bottom-nav) dan selalu nempel di layar selama scroll — kalau
     pakai blur, browser harus ngitung ulang blur-nya di SETIAP frame scroll
     karena konten di belakangnya terus berubah. Ini biang utama scroll jadi
     berat di HP. Background rgba(...,0.92) di atas udah cukup opaque jadi
     nggak butuh blur buat tetap kebaca. */
  .rp-sidebar {
    width: 236px; flex-shrink: 0; background: var(--rp-sidebar-bg);
    border-right: 1px solid var(--rp-border);
    display: flex; flex-direction: column; padding: 18px 14px;
  }
  .rp-brand { display: flex; gap: 10px; align-items: center; padding-bottom: 16px; margin-bottom: 14px; border-bottom: 1px solid var(--rp-border); }
  .rp-brand-mark {
    width: 36px; height: 36px; border-radius: 9px; background: var(--rp-chip-bg);
    color: var(--rp-chip-text); font-family: var(--rp-serif); font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--rp-panel-highlight) inset, 0 6px 16px -8px var(--rp-elevation-shadow);
  }
  .rp-brand-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .rp-brand-input { font-family: var(--rp-serif); font-weight: 600; font-size: 14.5px; color: var(--rp-ink); background: transparent; border: none; padding: 0; width: 100%; }
  .rp-brand-input:focus { outline: none; border-bottom: 1px dashed var(--rp-ink-dim); }
  .rp-brand-sub { font-size: 11px; color: var(--rp-ink-dim); }
  .rp-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .rp-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: none; background: transparent; color: var(--rp-ink-dim); font-size: 13.5px; text-align: left; cursor: pointer; font-family: var(--rp-sans); width: 100%; transition: background .15s ease, color .15s ease; }
  .rp-nav-item:hover { background: var(--rp-hover-tint); color: var(--rp-ink); }
  .rp-nav-item.is-active { background: var(--rp-chip-bg); color: var(--rp-chip-text); box-shadow: 0 6px 14px -8px var(--rp-elevation-shadow); }
  .rp-sidebar-foot { border-top: 1px solid var(--rp-border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }

  /* Rel aksi cepat sisi kiri — cuma tampil di laptop/desktop (>=1025px),
     lihat definisi lengkapnya di media query min-width:1025px. Default-nya
     disembunyikan biar nggak numpuk sama bottom-bar di HP/tablet. */
  .rp-quickrail { display: none; }
  .rp-sync-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--rp-ink-dim); margin-top: 4px; }
  .rp-sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rp-teal); flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .rp-sync-dot.is-busy { background: var(--rp-amber); }
  .rp-sync-dot.is-error { background: var(--rp-red); }
  .rp-refresh-btn { background: transparent; border: 1px solid var(--rp-border); border-radius: 6px; color: var(--rp-ink-dim); font-size: 11px; padding: 5px 8px; cursor: pointer; margin-top: 4px; }
  .rp-refresh-btn:hover { color: var(--rp-ink); border-color: var(--rp-border-strong); }

  /* Main */
  .rp-main { flex: 1; overflow-y: auto; padding: 28px 32px; min-width: 0; height: 100vh; }
  .rp-page { max-width: 940px; }
  .rp-page-head { margin-bottom: 20px; }
  .rp-page-head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .rp-page-head h1 { font-family: var(--rp-serif); font-weight: 600; font-size: 23px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .rp-sub { color: var(--rp-ink-dim); font-size: 13px; margin: 0; }
  .rp-ruled-head { font-family: var(--rp-serif); font-size: 13.5px; font-weight: 600; padding-bottom: 6px; margin: 22px 0 12px; border-bottom: 1px solid var(--rp-border); color: var(--rp-ink); }

  .rp-stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .rp-stat-card { flex: 1; min-width: 160px; background: var(--rp-surface); border: 1px solid var(--rp-border); border-radius: 10px; padding: 14px 16px; min-width: 0; box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight); }
  .rp-stat-label { display: block; font-size: 11.5px; color: var(--rp-ink-dim); margin-bottom: 6px; overflow-wrap: break-word; }
  .rp-stat-value { font-size: 17px; color: var(--rp-ink); overflow-wrap: break-word; font-family: var(--rp-mono); }

  .rp-unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .rp-card {
    position: relative; overflow: hidden; background-color: var(--rp-surface);
    background-image: radial-gradient(var(--rp-grid-dot) 1px, transparent 1px);
    background-size: 14px 14px;
    border: 1px solid var(--rp-border); border-top: none; border-radius: 10px; padding: 18px 16px 16px;
    box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight);
  }
  .rp-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--rp-teal); border-radius: 10px 10px 0 0;
  }
  .rp-clickable { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .rp-clickable:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -16px var(--rp-elevation-shadow), inset 0 1px 0 var(--rp-panel-highlight); }
  .rp-unit-card.is-active { border-color: var(--rp-red-ring); box-shadow: 0 0 0 1px var(--rp-red-tint), 0 10px 30px -12px var(--rp-red-glow), var(--rp-panel-shadow); }
  .rp-unit-card.is-active.rp-clickable:hover { box-shadow: 0 0 0 1px var(--rp-red-tint), 0 16px 34px -16px var(--rp-red-glow), var(--rp-panel-shadow); }
  .rp-unit-card.is-active::before { background: var(--rp-red); box-shadow: 0 0 10px var(--rp-red-glow); }
  .rp-unit-card.is-maint { opacity: 0.6; }
  .rp-unit-card.is-maint::before { background: var(--rp-ink-dim); }
  .rp-unit-name { font-family: var(--rp-serif); font-weight: 600; font-size: 15px; margin-bottom: 2px; padding-right: 64px; color: var(--rp-ink); }
  .rp-unit-rate { font-size: 12px; color: var(--rp-ink-dim); margin-bottom: 12px; font-family: var(--rp-mono); }
  .rp-timer { font-size: 22px; font-weight: 600; color: var(--rp-red); margin-bottom: 2px; font-family: var(--rp-mono); }
  .rp-timer.is-warning { color: var(--rp-amber); animation: rp-blink 1s step-start infinite; }
  .rp-timer.is-over { color: var(--rp-red); animation: rp-blink 0.6s step-start infinite; }
  @keyframes rp-blink { 50% { opacity: 0.35; } }
  .rp-unit-customer { font-size: 12px; color: var(--rp-ink-dim); margin-bottom: 6px; }
  .rp-running-cost { font-size: 13px; color: var(--rp-amber); margin-bottom: 12px; font-family: var(--rp-mono); }
  .rp-unit-note { font-size: 12px; color: var(--rp-ink-dim); font-style: italic; }
  .rp-card-actions { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .rp-card-actions .rp-btn { width: auto; flex: 1; min-width: 0; white-space: nowrap; }

  .rp-stamp {
    position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--rp-mono); font-size: 10px; letter-spacing: 0.02em; padding: 3px 9px 3px 7px;
    border-radius: 20px; border: 1px solid currentColor; background: var(--rp-neutral-tint);
  }
  .rp-stamp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .rp-stamp-inline { position: static; display: inline-flex; }
  .rp-stamp-available { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-stamp-active { color: var(--rp-red); background: var(--rp-red-tint); box-shadow: 0 0 12px -2px var(--rp-red-glow); }
  .rp-stamp-active::before { box-shadow: 0 0 6px currentColor; }
  .rp-stamp-maintenance { color: var(--rp-ink-dim); background: var(--rp-neutral-tint); }

  .rp-btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; font-family: var(--rp-sans); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; width: 100%; transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
  .rp-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .rp-btn-start { background: var(--rp-teal); color: var(--rp-btn-text); box-shadow: 0 6px 16px -9px var(--rp-elevation-shadow); }
  .rp-btn-start:hover:not(:disabled) { filter: brightness(1.08); }
  .rp-btn-stop { background: var(--rp-red); color: var(--rp-btn-text); box-shadow: 0 6px 16px -9px var(--rp-elevation-shadow); }
  .rp-btn-stop:hover:not(:disabled) { filter: brightness(1.08); }
  .rp-btn-ghost { background: transparent; border-color: var(--rp-border-strong); color: var(--rp-ink); width: auto; }
  .rp-btn-ghost:hover:not(:disabled) { background: var(--rp-hover-tint); }
  .rp-head-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rp-page-head-row .rp-btn { width: auto; }

  .rp-table-wrap { overflow-x: auto; border: 1px solid var(--rp-border); border-radius: 10px; background: var(--rp-surface); box-shadow: var(--rp-panel-shadow); }
  .rp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rp-table th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--rp-ink-dim); padding: 10px 14px; border-bottom: 1px solid var(--rp-border); background: var(--rp-th-bg); white-space: nowrap; }
  .rp-table td { padding: 10px 14px; border-bottom: 1px solid var(--rp-border); color: var(--rp-ink); vertical-align: middle; }
  .rp-table tr:last-child td { border-bottom: none; }
  /* Kolom nomor urut dibikin sesempit isinya (bukan ikut lebar kolom lain) */
  .rp-table th.rp-th-no, .rp-table td.rp-td-no { width: 1%; white-space: nowrap; text-align: center; padding-left: 10px; padding-right: 10px; }
  /* Kolom aksi: ikon selalu serata tengah vertikal & sejajar dalam satu baris,
     nggak peduli kolom lain di baris itu tinggi (misal tanggal 2 baris) */
  /* PENTING: flex JANGAN langsung di <td> — <td class="rp-row-actions"> lama
     bikin cell itu jadi flex-container, sehingga browser menghitung tinggi
     baris itu beda dari sel lain di baris yang sama (masih table-cell biasa),
     akibatnya garis bawah/border baris kolom Aksi jadi tidak lurus/sejajar
     dengan kolom lain. Sekarang <td> dibiarkan table-cell normal (rp-td-actions),
     dan flex dipindah ke <div class="rp-row-actions"> di DALAM td tsb. */
  .rp-td-actions { width: 1%; white-space: nowrap; }
  .rp-row-actions { display: flex; align-items: center; flex-wrap: nowrap; white-space: nowrap; gap: 4px; }
  .rp-dim { color: var(--rp-ink-dim); font-size: 11px; }

  .rp-icon-btn { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px; cursor: pointer; color: var(--rp-ink-dim); display: inline-flex; }
  .rp-icon-btn:hover { background: var(--rp-hover-tint); color: var(--rp-ink); }
  .rp-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .rp-icon-danger:hover { color: var(--rp-red); }
  .rp-icon-wa { color: #25D366; }
  .rp-icon-wa:hover { background: rgba(37,211,102,0.14); color: #1DA851; }

  .rp-cond { font-size: 12px; padding: 2px 8px; border-radius: 20px; }
  .rp-cond-Baik { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-cond-Rusak { color: var(--rp-red); background: var(--rp-red-tint); }
  .rp-cond-Perlu-cek { color: var(--rp-amber); background: var(--rp-amber-tint); }

  .rp-search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rp-border); border-radius: 8px; padding: 6px 10px; background: var(--rp-surface); color: var(--rp-ink-dim); }
  .rp-search input { border: none; background: transparent; font-size: 13px; color: var(--rp-ink); outline: none; width: 180px; font-family: var(--rp-sans); }
  .rp-search-wide { margin-bottom: 14px; width: fit-content; }

  .rp-empty { display: flex; align-items: center; gap: 8px; color: var(--rp-ink-dim); font-size: 13px; padding: 18px; justify-content: center; }

  .rp-modal-backdrop { position: fixed; inset: 0; background: var(--rp-overlay); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .rp-modal { background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong); border-radius: 14px; width: 360px; max-width: 92vw; max-height: 86vh; overflow-y: auto; box-shadow: 0 24px 60px -20px var(--rp-elevation-shadow); }
  .rp-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rp-border); }
  .rp-modal-head h3 { font-family: var(--rp-serif); font-size: 15px; font-weight: 600; margin: 0; color: var(--rp-ink); }
  .rp-modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .rp-modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .rp-modal-foot .rp-btn { width: auto; white-space: nowrap; }

  .rp-field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--rp-ink-dim); }
  .rp-field input, .rp-field select { font-family: var(--rp-sans); font-size: 13.5px; color: var(--rp-ink); border: 1px solid var(--rp-border); border-radius: 8px; padding: 8px 10px; background: var(--rp-input-bg); }
  .rp-field input:focus, .rp-field select:focus { outline: none; border-color: var(--rp-navy); box-shadow: 0 0 0 3px var(--rp-focus-ring); }
  /* Daftar pilihan (popup) punya <select> dirender native oleh OS/browser,
     jadi warnanya tidak ikut var(--rp-input-bg) yang transparan — harus
     dikasih warna solid sendiri, kalau tidak teksnya jadi putih-di-atas-
     putih (tidak kebaca) waktu mode gelap. */
  select option { background: var(--rp-surface-solid); color: var(--rp-ink); }
  .rp-field-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rp-pill { flex: 1; min-width: 62px; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--rp-border); background: transparent; color: var(--rp-ink-dim); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .rp-pill.is-on { background: var(--rp-chip-bg); color: var(--rp-chip-text); border-color: transparent; }

  .rp-receipt { border: 1px dashed var(--rp-border-strong); border-radius: 10px; padding: 12px 14px; }
  .rp-receipt-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; padding: 4px 0; }
  .rp-receipt-row > span:first-child { min-width: 0; overflow-wrap: break-word; }
  .rp-receipt-row > strong, .rp-receipt-row > span:last-child { flex-shrink: 0; text-align: right; white-space: nowrap; }
  .rp-receipt-line { border-top: 1px dashed var(--rp-border-strong); margin: 4px 0; }
  .rp-receipt-total { font-size: 15px; font-family: var(--rp-mono); }

  /* Kotak "Kembalian" dibikin besar & mencolok, terpisah dari input uang
     tunai — supaya kasir tidak salah baca/ketuker sama nominal uang bayar
     atau total tagihan waktu buru-buru. */
  .rp-kembalian-box { margin-top: -2px; padding: 14px 12px; border-radius: 12px; background: var(--rp-teal-tint); border: 1px solid var(--rp-teal); text-align: center; }
  .rp-kembalian-box .rp-kembalian-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--rp-ink-dim); margin-bottom: 4px; }
  .rp-kembalian-box .rp-kembalian-value { font-size: 32px; font-weight: 700; font-family: var(--rp-mono); color: var(--rp-teal); line-height: 1.15; }
  .rp-kembalian-box.is-short { background: var(--rp-red-tint); border-color: var(--rp-red); }
  .rp-kembalian-box.is-short .rp-kembalian-value { color: var(--rp-red); font-size: 26px; }

  .rp-chart-box { border: 1px solid var(--rp-border); border-radius: 10px; padding: 14px; background: var(--rp-surface); box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight); }

  /* Insight & Rekomendasi — dipakai di halaman Laporan & Laba-Rugi.
     Kartu bergaris aksen di kiri (warna beda tergantung sentimen), biar
     bisa cepat dipindai tanpa baca semua teks: hijau = bagus, kuning =
     perlu perhatian, merah = masalah/rugi, netral = info biasa. */
  .rp-insight-grid { display: flex; flex-direction: column; gap: 10px; }
  .rp-insight-card {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--rp-surface); border: 1px solid var(--rp-border);
    border-left: 3px solid var(--rp-navy); border-radius: 10px; padding: 13px 15px;
    box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight);
  }
  .rp-insight-card.is-good { border-left-color: var(--rp-teal); }
  .rp-insight-card.is-warn { border-left-color: var(--rp-amber); }
  .rp-insight-card.is-bad { border-left-color: var(--rp-red); }
  .rp-insight-icon {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--rp-neutral-tint); color: var(--rp-navy);
  }
  .rp-insight-card.is-good .rp-insight-icon { background: var(--rp-teal-tint); color: var(--rp-teal); }
  .rp-insight-card.is-warn .rp-insight-icon { background: var(--rp-amber-tint); color: var(--rp-amber); }
  .rp-insight-card.is-bad .rp-insight-icon { background: var(--rp-red-tint); color: var(--rp-red); }
  .rp-insight-body { flex: 1; min-width: 0; }
  .rp-insight-title { font-family: var(--rp-serif); font-weight: 600; font-size: 13.5px; margin-bottom: 4px; color: var(--rp-ink); }
  .rp-insight-text { font-size: 12.5px; color: var(--rp-ink-dim); line-height: 1.55; }
  .rp-insight-text strong { color: var(--rp-ink); font-weight: 700; }
  .rp-priority-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 20px; flex-shrink: 0; white-space: nowrap;
  }
  .rp-priority-badge.p-tinggi { background: var(--rp-red-tint); color: var(--rp-red); }
  .rp-priority-badge.p-sedang { background: var(--rp-amber-tint); color: var(--rp-amber); }
  .rp-priority-badge.p-rendah { background: var(--rp-teal-tint); color: var(--rp-teal); }
  @media (max-width: 720px) {
    .rp-insight-card { padding: 11px 12px; gap: 10px; }
    .rp-insight-icon { width: 26px; height: 26px; }
    .rp-insight-title { font-size: 12.5px; }
    .rp-insight-text { font-size: 12px; }
  }

  .rp-chart-legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--rp-ink-dim); flex-wrap: wrap; }
  .rp-legend-item { display: flex; align-items: center; gap: 6px; }
  .rp-legend-swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .rp-donut-legend { display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--rp-ink-dim); min-width: 180px; }
  @media (max-width: 720px) {
    .rp-chart-legend { gap: 10px; font-size: 10px; }
    .rp-legend-item { gap: 4px; }
    .rp-legend-swatch { width: 11px; height: 2.5px; }
    .rp-donut-legend { font-size: 10px; min-width: 0; gap: 5px; }
  }
  @media (max-width: 360px) {
    .rp-chart-legend { font-size: 9px; }
    .rp-donut-legend { font-size: 9px; }
  }
  .rp-delta-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 4px; }
  .rp-delta-up { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-delta-down { color: var(--rp-red); background: var(--rp-red-tint); }
  .rp-delta-flat { color: var(--rp-ink-dim); background: var(--rp-neutral-tint); }

  .rp-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong); color: var(--rp-ink); padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: 0 12px 30px -10px var(--rp-elevation-shadow); }

  .rp-user-menu {
    position: fixed; top: 16px; right: 16px; z-index: 60;
    font-family: var(--rp-sans);
  }
  .rp-user-trigger {
    display: flex; align-items: center; gap: 9px;
    background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong);
    border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer;
    box-shadow: 0 8px 20px -8px var(--rp-elevation-shadow);
    color: var(--rp-ink); transition: background .15s ease, transform .15s ease;
    font-family: var(--rp-sans);
  }
  @media (hover: hover) and (pointer: fine) {
    .rp-user-trigger:hover { background: var(--rp-surface-2); }
  }
  .rp-user-avatar {
    width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: var(--rp-chip-bg); color: var(--rp-chip-text);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--rp-serif); font-weight: 700; font-size: 12.5px;
    box-shadow: inset 0 0 0 1px var(--rp-panel-highlight);
  }
  .rp-user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rp-user-id { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .rp-user-name { font-size: 12.5px; font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-user-role { font-size: 9px; color: var(--rp-ink-dim); }

  .rp-user-popover {
    position: absolute; top: calc(100% + 10px); right: 0; min-width: 224px;
    background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong);
    border-radius: 14px; padding: 10px; box-shadow: 0 24px 60px -24px var(--rp-elevation-shadow);
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .rp-user-menu.is-open .rp-user-popover {
    opacity: 1; visibility: visible; transform: translateY(0);
  }
  /* Buka lewat hover CUMA buat perangkat yang beneran punya kursor. Di HP,
     :hover nyangkut abis di-tap, itu yang bikin menu/nama nggak mau nutup
     pas avatar diklik lagi. */
  @media (hover: hover) and (pointer: fine) {
    .rp-user-menu:hover .rp-user-popover {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
  }
  .rp-theme-switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-radius: 9px; background: var(--rp-hover-tint);
    margin-bottom: 2px;
  }
  .rp-theme-switch-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--rp-ink); }
  .rp-theme-switch {
    position: relative; width: 40px; height: 22px; border-radius: 999px; border: 1px solid var(--rp-border-strong);
    background: var(--rp-input-bg); cursor: pointer; flex-shrink: 0; padding: 0;
    transition: background .18s ease;
  }
  .rp-theme-switch-thumb {
    position: absolute; top: 50%; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--rp-chip-bg); color: var(--rp-chip-text);
    display: flex; align-items: center; justify-content: center;
    transform: translateY(-50%); transition: left .18s ease;
  }
  .rp-theme-switch.is-on { background: var(--rp-navy-soft); }
  .rp-theme-switch.is-on .rp-theme-switch-thumb { left: calc(100% - 18px); }

  .rp-user-menu-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 9px; padding: 9px 10px;
    font-size: 12.5px; color: var(--rp-ink); cursor: pointer; font-family: var(--rp-sans);
    transition: background .15s ease;
  }
  .rp-user-menu-btn:hover { background: var(--rp-hover-tint); }
  .rp-user-menu-danger { color: var(--rp-red); }
  .rp-user-menu-danger:hover { background: var(--rp-red-tint); }

  .rp-loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; font-family: var(--rp-serif); font-size: 16px; color: var(--rp-ink-dim); }

  /* Menu bawah (bottom-bar) — sekarang dipakai di SEMUA ukuran layar
     (HP, tablet, DAN laptop/desktop), bukan cuma di layar sempit lagi. */
  @media (max-width: 99999px) {
    #root { flex-direction: column; }
    .rp-sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      width: 100%; flex-direction: row; align-items: stretch;
      overflow-x: auto; border-right: none; border-top: 1px solid var(--rp-border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .rp-brand { display: none; }
    .rp-nav { flex-direction: row; flex: 1; gap: 0; justify-content: space-around; }
    .rp-nav-item {
      flex-direction: column; gap: 3px; align-items: center; justify-content: center;
      width: auto; flex: 1; padding: 6px 2px; border-radius: 8px;
    }
    .rp-nav-label { font-size: 10px; line-height: 1.1; white-space: nowrap; }
    .rp-sidebar-foot { display: none; }
    .rp-main { height: auto; padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: calc(76px + env(safe-area-inset-bottom)); padding-left: 16px; padding-right: 16px; }
    .rp-user-menu { top: 10px; right: 10px; }
    .rp-user-trigger { padding: 4px 10px 4px 4px; gap: 7px; }
    .rp-user-avatar { width: 27px; height: 27px; font-size: 11px; }
    .rp-user-id { display: flex; }
    .rp-user-name { font-size: 11px; max-width: 96px; }
    .rp-user-role { font-size: 8.5px; }
  }

  @media (max-width: 720px) {
    /* 4 card jadi 2 kolom sebaris di mobile (dashboard & laporan) */
    .rp-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rp-stat-card { padding: 10px 12px; }
    .rp-stat-label { font-size: 10.5px; margin-bottom: 4px; }
    .rp-stat-value { font-size: 14.5px; }
    .rp-delta-badge { font-size: 10px; }

    /* Kecilkan tombol & pastikan tidak meluber keluar card/modal */
    .rp-btn { font-size: 12px; padding: 7px 10px; }
    .rp-pill { font-size: 11.5px; padding: 6px 4px; }
    .rp-unit-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .rp-card { padding: 14px 12px 12px; }
    .rp-unit-name { font-size: 13.5px; padding-right: 44px; }
    .rp-stamp { top: 8px; right: 8px; font-size: 8.5px; padding: 2px 7px 2px 6px; letter-spacing: 0; white-space: nowrap; }
    .rp-timer { font-size: 18px; }
    .rp-modal { width: 320px; }
  }


/* =========================================================
   PREMIUM UI OVERRIDE — Rental PS
   Fokus: premium / modern / clean / operator-friendly
   Tidak mengubah business logic atau API.
========================================================= */
/* Page atmosphere — warm paper/ink tint instead of the old blue-violet glow */
html,body{
  background-color:var(--rp-page-bg);
  background-image:
    radial-gradient(circle at 78% 8%,rgba(var(--rp-accent-rgb),.07),transparent 28%),
    radial-gradient(circle at 15% 80%,rgba(198,133,46,.05),transparent 26%);
  background-size:auto;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 0%,var(--rp-panel-highlight) 48%,transparent 100%);
  z-index:-1;
}

/* Sidebar */
.rp-sidebar{
  width:248px;
  padding:20px 14px;
  border-right:1px solid var(--rp-border);
  box-shadow:18px 0 60px -50px rgba(0,0,0,.8);
}
.rp-brand{
  padding:4px 8px 18px;
  margin-bottom:16px;
  border-bottom:1px solid var(--rp-border);
}
.rp-brand-mark{
  width:40px;height:40px;border-radius:12px;
  font-size:12px;
  box-shadow:0 10px 22px -10px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-brand-input{
  font-size:15px;
  letter-spacing:-.02em;
}
.rp-brand-sub{
  margin-top:2px;
  letter-spacing:.02em;
}
.rp-nav{gap:5px}
.rp-nav-item{
  position:relative;
  padding:11px 12px;
  border-radius:11px;
  font-size:13px;
}
.rp-nav-item:hover{
  transform:translateX(2px);
}
.rp-nav-item.is-active{
  box-shadow:0 8px 18px -10px var(--rp-elevation-shadow);
}
.rp-nav-item.is-active:after{
  content:"";
  position:absolute;
  right:7px;
  width:4px;height:18px;
  border-radius:99px;
  background:var(--rp-chip-text);
  opacity:.55;
}
.rp-sidebar-foot{
  padding:15px 8px 0;
}
.rp-refresh-btn{
  width:100%;
  padding:8px 10px;
  border-radius:9px;
  transition:.15s ease;
}
.rp-refresh-btn:hover{background:var(--rp-hover-tint);transform:translateY(-1px)}

@media (min-width: 1025px) {
  /* Di laptop/desktop, #root balik jadi row (quickrail | main) — sidebar
     lama udah jadi bottom-bar permanen (position:fixed, di luar alur flex
     ini), jadi nggak kepengaruh sama flex-direction di sini. */
  #root { flex-direction: row; }

  /* Lebar dipersempit lagi. */
  .rp-quickrail {
    display: flex; flex-direction: column; width: 58px; flex-shrink: 0;
    background: var(--rp-sidebar-bg); border-right: 1px solid var(--rp-border);
    align-items: center; padding: 14px 6px; gap: 9px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .rp-quickrail-brand {
    width: 32px; height: 32px; border-radius: 8px; background: var(--rp-chip-bg);
    color: var(--rp-chip-text); display: flex; align-items: center; justify-content: center;
    font-family: var(--rp-serif); font-weight: 700; font-size: 11px; flex-shrink: 0;
    cursor: default;
  }
  .rp-quickrail-name {
    font-family: var(--rp-brand-font); font-style: italic;
    font-size: 8.5px; font-weight: 800; color: var(--rp-ink); text-align: center;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    white-space: normal; line-height: 1.15; word-break: break-word;
    margin-bottom: 10px; cursor: pointer;
  }
  .rp-quickrail-title {
    font-size: 8px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--rp-ink-dim); text-align: center; margin-top: 6px;
  }
  .rp-quickrail-btn {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 0; border: none; border-radius: 8px;
    background: transparent; cursor: pointer; font-family: var(--rp-sans);
    color: var(--rp-ink);
  }
  /* Bulatan ikon — bentuknya sama kayak "akses cepat" versi HP
     (.rp-btn-circle di media query mobile), cuma dipakai di sini scoped
     ke .rp-quickrail-btn karena breakpoint-nya beda (desktop vs mobile
     nggak akan pernah aktif bebarengan, jadi aman pakai nama class sama). */
  .rp-quickrail-btn .rp-btn-circle {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 10px;
    background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong);
    box-shadow: 0 8px 18px -10px var(--rp-elevation-shadow);
    transition: background .12s ease;
  }
  .rp-quickrail-btn:hover .rp-btn-circle { background: var(--rp-hover-tint); }
  .rp-quickrail-btn .rp-btn-circle svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* Teks ditumpuk di dalam bulatan (bagian bawah), persis posisi label di
     tombol bulat HP — bukan buka/tutup apa pun, selalu tampil begini. */
  .rp-quickrail-btn .rp-btn-label {
    position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%);
    display: block; font-size: 0; font-weight: 600; line-height: 1;
    color: var(--rp-ink); text-align: center; max-width: 38px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  .rp-quickrail-btn .rp-btn-label:after {
    content: attr(data-short); font-size: 7px; line-height: 1; letter-spacing: .01em;
  }

  /* Jarak judul ke atas dipepetin. */
  .rp-main { padding-top: 20px; padding-bottom: 64px; padding-left: 28px; padding-right: 28px; height: 100vh; overflow-y: auto; }
}

/* Main */
.rp-page{
  max-width:1180px;
  margin:0 auto;
}
.rp-page-head{
  margin-bottom:24px;
}
.rp-page-head h1{
  font-size:27px;
  font-weight:700;
  letter-spacing:-.035em;
}
.rp-sub{
  font-size:12.5px;
  line-height:1.55;
}

/* Banner foto header dashboard (opsional, diisi per cabang) */
.rp-dash-banner{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.rp-dash-banner.has-photo{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  min-height:84px;
  padding:12px 16px;
  background-size:cover;
  background-position:center;
  border:1px solid var(--rp-border);
}
.rp-dash-banner-text{ position:relative; z-index:1; }
/* Begitu banner ada fotonya, judul & subjudul dipaksa putih + dikasih
   text-shadow, TERLEPAS dari tema light/dark yang lagi aktif — soalnya
   warna teks tema (--rp-ink) belum tentu kebaca di atas foto sembarang.
   Scrim gelap di background-image (lihat bannerStyle di JS) + shadow ini
   sama-sama jaga kontras biar subjudul tetap kebaca. */
.rp-dash-banner.has-photo .rp-dash-banner-text h1,
.rp-dash-banner.has-photo .rp-dash-banner-text .rp-sub{
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.4);
}
.rp-dash-banner-edit{
  position:relative;
  z-index:1;
  width:auto;
  white-space:nowrap;
  backdrop-filter:blur(2px);
}
.rp-dash-banner:not(.has-photo) .rp-dash-banner-edit{
  background:transparent;
  border-style:dashed;
}
/* Kalau bannernya udah ada fotonya, tombol "Ganti foto" dibikin nyaris
   nggak kelihatan (superduper transparan) biar nggak nutupin foto —
   baru muncul lagi pas kursor di-hover di atas banner, atau (buat HP,
   yang nggak ada hover) pas bannernya di-tap sekali. */
.rp-dash-banner.has-photo{ cursor:pointer; }
.rp-dash-banner.has-photo .rp-dash-banner-edit{
  opacity:.04;
  transition:opacity .2s ease;
}
.rp-dash-banner.has-photo:hover .rp-dash-banner-edit,
.rp-dash-banner.has-photo:focus-within .rp-dash-banner-edit,
.rp-dash-banner.has-photo.rp-banner-edit-visible .rp-dash-banner-edit{
  opacity:1;
}
@media (max-width:640px){
  .rp-dash-banner.has-photo{ min-height:68px; padding:10px 12px; }
  /* Di HP, tombol foto header JANGAN sampai bikin baris baru (makan
     tempat) — dilepas dari alur flex (absolute, pojok kanan atas) biar
     nyewa/numpuk di atas judul/subjudul kalau perlu. Nggak masalah kalau
     ketiban teks: begitu ada foto, tombolnya dibikin nyaris transparan
     (lihat .has-photo .rp-dash-banner-edit di atas) jadi gak ganggu. */
  .rp-dash-banner-tools{
    position:absolute;
    top:0;
    right:0;
    flex-wrap:nowrap;
  }
  .rp-dash-banner-edit{
    font-size:11px;
    padding:5px 8px;
  }
}

/* Tombol fitur halaman (Tambah unit, Ekspor, dsb) — diletakkan di baris
   sendiri persis di bawah header, TERPISAH dari banner foto header, dan
   dibikin lebih kecil/ringkas biar nggak keliatan segede judul halaman. */
.rp-page-tools-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin:10px 0 20px;
}
.rp-page-tools-row .rp-btn{
  width:auto;
  font-size:12px;
  font-weight:600;
  padding:6px 10px;
  border-radius:7px;
  gap:5px;
}
.rp-page-tools-row .rp-btn svg{
  width:12px;
  height:12px;
}
.rp-page-tools-row .rp-search{
  width:auto;
  min-width:0;
}
.rp-page-tools-row .rp-search input{
  font-size:12px;
  padding:6px 8px;
}

/* KPI cards */
.rp-stat-row{
  gap:14px;
}
.rp-stat-card{
  position:relative;
  overflow:hidden;
  border-radius:15px;
  padding:17px 18px;
  min-height:86px;
  box-shadow:var(--rp-panel-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-stat-card:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,rgba(var(--rp-accent-rgb),.75),rgba(198,133,46,.4));
  opacity:.85;
}
.rp-stat-card:after{
  content:"";
  position:absolute;
  width:90px;height:90px;
  right:-35px;bottom:-55px;
  border-radius:50%;
  background:rgba(var(--rp-accent-rgb),.08);
  filter:blur(12px);
}
.rp-stat-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.075em;
  font-weight:600;
}
.rp-stat-value{
  font-size:17px;
  font-weight:600;
  letter-spacing:-.025em;
}

/* Section heading */
.rp-ruled-head{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--rp-ink-dim);
  border-bottom:0;
  margin:28px 0 13px;
}
.rp-ruled-head:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--rp-border);
}

/* Unit cards */
.rp-unit-grid{
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
}
.rp-card{
  border-radius:15px;
  padding:19px 17px 16px;
  border:1px solid var(--rp-border);
  border-top:1px solid var(--rp-border);
  background-image:
    radial-gradient(circle at 90% 0%,rgba(var(--rp-accent-rgb),.06),transparent 34%),
    linear-gradient(180deg,var(--rp-panel-highlight),transparent 65%);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.rp-card:before{height:2px}
.rp-card:hover{
  transform:translateY(-3px);
  border-color:var(--rp-border-strong);
  box-shadow:0 20px 40px -30px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-unit-name{
  font-size:15.5px;
  font-weight:650;
  letter-spacing:-.015em;
}
.rp-unit-rate{
  font-size:11px;
  opacity:.9;
}
.rp-timer{
  font-size:24px;
  letter-spacing:-.035em;
}
.rp-running-cost{
  font-size:12px;
}
.rp-stamp{
  font-size:9px;
  font-weight:600;
  letter-spacing:.045em;
  text-transform:uppercase;
  padding:4px 9px 4px 7px;
}
.rp-card-actions{gap:7px}
.rp-btn{
  border-radius:10px;
  min-height:36px;
  padding:8px 13px;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,background .15s ease;
}
.rp-btn:hover:not(:disabled){
  transform:translateY(-1px);
}
.rp-btn-start{
  box-shadow:0 10px 22px -14px var(--rp-elevation-shadow);
}
.rp-btn-stop{
  box-shadow:0 10px 22px -14px var(--rp-elevation-shadow);
}
.rp-btn-ghost{
  background:rgba(255,255,255,.025);
}
[data-theme="light"] .rp-btn-ghost{background:rgba(31,43,77,.025)}

/* Tables */
.rp-table-wrap{
  border-radius:14px;
  box-shadow:var(--rp-panel-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-table{
  font-size:12.5px;
}
.rp-table th{
  padding:12px 15px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.065em;
}
.rp-table td{
  padding:12px 15px;
}
.rp-table tbody tr{
  transition:background .12s ease;
}
.rp-table tbody tr:hover{
  background:var(--rp-hover-tint);
}

/* Search */
.rp-search{
  border-radius:10px;
  padding:7px 11px;
  background:var(--rp-surface);
  box-shadow:inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-search:focus-within{
  border-color:rgba(var(--rp-accent-rgb),.5);
  box-shadow:0 0 0 3px var(--rp-focus-ring);
}
.rp-search input{font-size:12.5px}

/* Forms / modals */
.rp-modal-backdrop{
  background:var(--rp-overlay);
  backdrop-filter:blur(8px);
}
.rp-modal{
  width:410px;
  border-radius:18px;
  box-shadow:0 30px 70px -35px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-modal-head{
  padding:16px 18px;
}
.rp-modal-head h3{
  font-size:15.5px;
  letter-spacing:-.015em;
}
.rp-modal-body{
  padding:18px;
  gap:13px;
}
.rp-field{gap:6px;font-size:11.5px;font-weight:500}
.rp-field input,.rp-field select{
  min-height:40px;
  border-radius:10px;
  padding:9px 11px;
  transition:.15s ease;
}
.rp-field input:focus,.rp-field select:focus{
  border-color:rgba(var(--rp-accent-rgb),.6);
  box-shadow:0 0 0 3px var(--rp-focus-ring);
}
.rp-pill{
  border-radius:10px;
  min-height:36px;
  transition:.15s ease;
}
.rp-pill:hover{background:var(--rp-hover-tint);color:var(--rp-ink)}
.rp-pill.is-on{
  box-shadow:0 8px 16px -12px var(--rp-elevation-shadow);
}

/* Receipt */
.rp-receipt{
  border:1px solid var(--rp-border);
  border-radius:13px;
  padding:13px 15px;
  background:linear-gradient(145deg,rgba(var(--rp-accent-rgb),.05),rgba(198,133,46,.03));
}
.rp-receipt-total{
  font-size:17px;
  padding-top:7px;
}
.rp-receipt-line{
  border-color:var(--rp-border);
  margin:7px 0;
}

/* Report chart */
.rp-chart-box{
  border-radius:15px;
  padding:16px;
}
.rp-delta-badge{
  padding:3px 8px;
  font-size:10.5px;
}

/* Toast */
.rp-toast{
  bottom:24px;
  border-radius:12px;
  padding:11px 17px;
  box-shadow:0 18px 45px -18px rgba(0,0,0,.9);
  backdrop-filter:blur(14px);
}

/* User menu (avatar + identitas di pojok kanan atas) — dibikin lebih
   ringkas/kecil, termasuk di layar laptop/desktop. */
.rp-user-trigger{
  padding:4px 12px 4px 4px;
  gap:8px;
  box-shadow:0 12px 28px -16px rgba(0,0,0,.8);
  transition:.16s ease;
}
@media (hover: hover) and (pointer: fine){
  .rp-user-trigger:hover{
    transform:translateY(-1px);
  }
}
.rp-user-avatar{
  width:26px;height:26px;
  font-size:10.5px;
}
.rp-user-name{
  font-size:11.5px;
  max-width:120px;
}
.rp-user-role{
  font-size:8px;
}
.rp-user-popover{
  border-radius:16px;
}

/* "Akses cepat" versi HP — sekarang jadi tombol-tombol BULAT mengambang
   (kayak AssistiveTouch di iPhone), turun satu jalur ke bawah avatar,
   gabung sama menu akun (mode gelap/ganti foto/keluar) biar nggak
   tabrakan kayak dulu. Wrapper .rp-user-dropdown sengaja "transparan"
   (display:contents) di desktop, jadi popover akun tetap jalan seperti
   semula (hover, kotak list biasa); baru di HP/tablet dia dijadikan
   rentetan bubble bulat lewat media query di bawah. */
.rp-user-dropdown{ display:contents; }
@media (min-width:1025px){
  /* Desktop udah ada quickrail sendiri di kiri, jadi akses cepat nggak
     perlu numpang di avatar lagi. */
  .rp-quick-fan{ display:none; }
}
@media (max-width:1024px){
  .rp-user-dropdown{
    display:flex; flex-direction:column; align-items:center; gap:11px;
    position:absolute; top:calc(100% + 14px); right:2px; min-width:0;
    background:none; border:none; box-shadow:none; padding:0;
    opacity:0; visibility:hidden; transform:translateY(-10px) scale(.92);
    transform-origin:top right;
    transition:opacity .16s ease, transform .22s cubic-bezier(.34,1.56,.64,1), visibility .16s;
    pointer-events:none;
  }
  .rp-user-menu.is-open .rp-user-dropdown{
    opacity:1; visibility:visible; transform:translateY(0) scale(1); pointer-events:auto;
  }
  .rp-quick-fan{
    display:flex; flex-direction:column; align-items:center; gap:11px;
  }
  .rp-quick-fan-btn,
  .rp-user-dropdown .rp-user-menu-btn{
    position:relative; width:auto; height:auto; flex-direction:row; align-items:center; gap:0;
    padding:0; margin:0; background:none; border:none; box-shadow:none;
  }
  .rp-quick-fan-btn{ color:var(--rp-ink); cursor:pointer; }
  .rp-btn-circle{
    width:58px; height:58px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    /* padding bawah dipakai buat "ngangkat" icon dikit, jadi pasangan
       icon+teks-nya yang ke-center di tengah bulatan, bukan icon doang */
    padding-bottom:14px;
    background:var(--rp-surface-solid); border:1px solid var(--rp-border-strong);
    box-shadow:0 12px 26px -10px var(--rp-elevation-shadow);
  }
  .rp-quick-fan-btn svg,
  .rp-user-dropdown .rp-user-menu-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .rp-user-dropdown .rp-btn-label{
    position:absolute; left:50%; bottom:13px; transform:translateX(-50%);
    display:block; font-size:0; font-weight:600; line-height:1;
    color:var(--rp-ink); text-align:center; max-width:50px;
    background:none; border:none; padding:0; box-shadow:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
  }
  /* Di HP teksnya pakai versi pendek (data-short) biar muat rapih di dalam
     bulatan tanpa kepotong; di laptop tetep pakai label panjangnya. */
  .rp-user-dropdown .rp-btn-label:after{
    content:attr(data-short); font-size:8.5px; line-height:1; letter-spacing:.01em;
  }
  .rp-user-dropdown .rp-user-menu-danger .rp-btn-label{ color:var(--rp-red); }
  .rp-user-dropdown .rp-user-popover{
    display:flex; flex-direction:column; align-items:center; gap:11px;
    position:static; opacity:1; visibility:visible; transform:none;
    border:none; box-shadow:none; padding:0; border-radius:0; min-width:0;
    background:transparent; transition:none;
  }
  .rp-user-dropdown .rp-theme-switch-row{
    width:auto; position:relative; display:flex; align-items:center; justify-content:center;
    background:none; border:none; box-shadow:none; padding:0; margin:0;
  }
  .rp-user-dropdown .rp-theme-switch{
    width:58px; height:58px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    padding-bottom:14px;
    background:var(--rp-surface-solid); border:1px solid var(--rp-border-strong);
    box-shadow:0 12px 26px -10px var(--rp-elevation-shadow);
  }
  .rp-user-dropdown .rp-theme-switch.is-on{ background:var(--rp-surface-solid); }
  .rp-user-dropdown .rp-theme-switch-thumb{
    position:static; width:18px; height:18px; transform:none; background:none; color:var(--rp-ink);
  }
  .rp-user-dropdown .rp-theme-switch.is-on .rp-theme-switch-thumb{ left:auto; }
  .rp-user-dropdown .rp-theme-switch-thumb svg{ width:18px; height:18px; }
  .rp-user-dropdown .rp-theme-switch-label{
    position:absolute; left:50%; top:auto; bottom:13px; transform:translateX(-50%);
    z-index:2;
    display:block; font-size:0; font-weight:600; line-height:1;
    color:var(--rp-ink); text-align:center; max-width:50px;
    background:none; border:none; padding:0; box-shadow:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;
  }
  .rp-user-dropdown .rp-theme-switch-label:after{
    content:attr(data-short); font-size:8.5px; line-height:1; letter-spacing:.01em;
  }
  .rp-user-dropdown .rp-theme-switch-label svg{ display:none; }
  .rp-user-dropdown .rp-user-menu-danger{ color:var(--rp-red); }
}

/* Menu bawah — sekarang berlaku di semua ukuran layar termasuk laptop */
@media (max-width:99999px){
  .rp-nav{ gap:0; }
  .rp-sidebar{
    width:100%;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:var(--rp-surface-solid);
    backdrop-filter:none;
    border-right:none;
    box-shadow:none;
  }
  .rp-nav-item{
    min-height:52px;
    padding:6px 2px;
    border-radius:6px;
    font-size:13.5px;
  }
  .rp-nav-item.is-active:after{
    display:none;
  }
}
/* Mobile */
@media (max-width:720px){
  .rp-page-head h1{font-size:22px}
  .rp-page-head{margin-bottom:18px}
  .rp-stat-row{gap:9px}
  .rp-stat-card{
    min-height:78px;
    border-radius:13px;
    padding:12px 13px;
  }
  .rp-stat-value{font-size:14.5px}
  .rp-unit-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }
  .rp-card{
    border-radius:13px;
    padding:14px 11px 11px;
  }
  .rp-unit-name{font-size:13px}
  .rp-unit-rate{font-size:10px}
  .rp-timer{font-size:17px}
  .rp-btn{min-height:34px;padding:7px 9px;border-radius:9px}
  .rp-table-wrap{border-radius:12px}
  .rp-modal{
    width:min(410px,calc(100vw - 24px));
    border-radius:16px;
  }
  .rp-ruled-head{
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
  }
  .rp-ruled-head:after{
    display:none;
  }
  .rp-ruled-head .rp-dim{
    display:block;
  }
}
@media (max-width:390px){
  .rp-unit-grid{grid-template-columns:1fr}
  .rp-user-name{max-width:48px}
  .rp-user-id{max-width:80px}
  .rp-user-role{font-size:8px}
  .rp-user-trigger{padding:4px 8px 4px 4px;gap:6px}
}


/* Premium loading */
.rp-loading-screen { flex-direction: column; gap: 18px; }
.rp-loading-mark { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; }
.rp-loading-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2.5px solid var(--rp-border);
  border-top-color: var(--rp-navy);
  border-right-color: var(--rp-navy);
  animation: rpSpin 0.9s linear infinite;
}
.rp-loading-chip {
  width: 40px; height: 40px; border-radius: 9px; background: var(--rp-chip-bg); color: var(--rp-chip-text);
  font-family: var(--rp-serif); font-weight: 700; font-size: 14px; letter-spacing: 0.01em;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1px var(--rp-panel-highlight) inset, 0 6px 16px -8px var(--rp-elevation-shadow);
  animation: rpChipPulse 1.6s ease-in-out infinite;
}
@keyframes rpSpin { to { transform: rotate(360deg); } }
@keyframes rpChipPulse {
  0%, 100% { box-shadow: 0 0 0 1px var(--rp-panel-highlight) inset, 0 6px 16px -8px var(--rp-elevation-shadow), 0 0 0 0 rgba(var(--rp-accent-rgb),0.35); }
  50% { box-shadow: 0 0 0 1px var(--rp-panel-highlight) inset, 0 6px 16px -8px var(--rp-elevation-shadow), 0 0 0 9px rgba(var(--rp-accent-rgb),0); }
}
.rp-loading-text { display: flex; align-items: baseline; font-size: 15px; color: var(--rp-ink); letter-spacing: .01em; }
.rp-loading-dots { display: inline-flex; gap: 3px; margin-left: 4px; }
.rp-loading-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; display: inline-block; animation: rpDotBounce 1.2s ease-in-out infinite; }
.rp-loading-dots i:nth-child(2) { animation-delay: .15s; }
.rp-loading-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes rpDotBounce { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.rp-loading-bar { width: 180px; height: 3px; border-radius: 3px; background: var(--rp-border); overflow: hidden; }
.rp-loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rp-navy-soft), var(--rp-navy)); border-radius: 3px; transition: width .35s ease; }
.rp-loading-count { font-family: var(--rp-mono); font-size: 11px; color: var(--rp-ink-dim); letter-spacing: .02em; }

/* Transisi halus saat app pertama kali muncul setelah loading */
@keyframes rpFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.rp-fade-in { animation: rpFadeIn .45s cubic-bezier(.16,1,.3,1); }

/* ===== Sudut poligon (chamfered corners) — kesan lempeng logam/ledger premium ===== */
:root { --rp-cut: 16px; --rp-cut-sm: 10px; }
.rp-card,
.rp-stat-card,
.rp-chart-box,
.rp-table-wrap {
  clip-path: polygon(
    var(--rp-cut) 0%, calc(100% - var(--rp-cut)) 0%,
    100% var(--rp-cut), 100% calc(100% - var(--rp-cut)),
    calc(100% - var(--rp-cut)) 100%, var(--rp-cut) 100%,
    0% calc(100% - var(--rp-cut)), 0% var(--rp-cut)
  );
  border-radius: 0 !important;
}
.rp-card::before { border-radius: 0; }
.rp-modal {
  clip-path: polygon(
    var(--rp-cut-sm) 0%, calc(100% - var(--rp-cut-sm)) 0%,
    100% var(--rp-cut-sm), 100% calc(100% - var(--rp-cut-sm)),
    calc(100% - var(--rp-cut-sm)) 100%, var(--rp-cut-sm) 100%,
    0% calc(100% - var(--rp-cut-sm)), 0% var(--rp-cut-sm)
  );
  border-radius: 0 !important;
}
@media (max-width: 720px) {
  :root { --rp-cut: var(--rp-cut-sm); }
}


  /* ===================== LOGIN & ROLE ===================== */
  .rp-login-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    padding:24px; background:var(--rp-page-bg); position:relative; overflow:hidden;

    background:
      radial-gradient(560px 420px at 22% 20%, rgba(var(--rp-accent-rgb),0.16), transparent 60%),
      radial-gradient(520px 460px at 82% 82%, rgba(var(--rp-accent-rgb),0.12), transparent 60%);
    pointer-events:none;
  }
  .rp-login-screen:after{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(var(--rp-grid-line) 1px, transparent 1px),

    background-size: 42px 42px;

    position:relative; z-index:1;

    clip-path:polygon(18px 0%,calc(100% - 18px) 0%,100% 18px,100% calc(100% - 18px),

    animation: rpLoginRise .45s cubic-bezier(.2,.8,.2,1);
  }
  .rp-login-card:before{
    content:""; position:absolute; top:0; left:18px; right:18px; height:2px;
    background:linear-gradient(90deg, transparent, var(--rp-navy), transparent);
    opacity:.7;
  }
  @keyframes rpLoginRise{
    from{ opacity:0; transform:translateY(14px) scale(.985); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .rp-login-brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
  .rp-login-mark{
    width:50px;height:50px;display:flex;align-items:center;justify-content:center;

   PENTING: upload dilakukan langsung dari browser (tanpa server),
   jadi HARUS pakai "unsigned upload preset" — bukan API secret.

========================================================= */
const CLOUDINARY_CLOUD_NAME = "ghebtxdc";
const CLOUDINARY_UPLOAD_PRESET = "rental_ps_unsigned";
async function uploadToCloudinary(file) {
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: form });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const errJson = await res.json(); msg = (errJson.error && errJson.error.message) || msg; } catch (e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  return data.secure_url;
}

// "Rp1.200.000" — supaya sumbu/label chart batang tidak makan tempat.
function rupiahCompact(n) {
  const v = Math.round(n || 0);
  const abs = Math.abs(v);
  const sign = v < 0 ? "-" : "";
  const fmt = (num, suf) => {
    const rounded = Math.round(num * 10) / 10;
    const str = Number.isInteger(rounded) ? rounded.toString() : rounded.toFixed(1).replace(".", ",");
    return sign + "Rp" + str + suf;
  };
  if (abs >= 1000000000) return fmt(abs / 1000000000, "M");
  if (abs >= 1000000) return fmt(abs / 1000000, "jt");
  if (abs >= 1000) return fmt(abs / 1000, "rb");
  return rupiah(v);
}
const pad2 = (n) => String(n).padStart(2, "0");
function fmtHMS(ms) {

}
// Semua jam/tanggal di app ini WAJIB mengacu ke waktu Cirebon/WIB
// (Asia/Jakarta), berapapun timezone yang diset di perangkat/browser.
const RP_TZ = "Asia/Jakarta";
// Ambil "jam dinding" WIB dari sebuah waktu (atau sekarang), lalu bungkus
// jadi objek Date dengan field lokal = nilai WIB tsb. Trik ini bikin semua
// perhitungan kalender (hari ini, awal minggu/bulan, dst) konsisten ke WIB
// walau perangkat disetel ke zona waktu lain.
function toJakarta(v) {
  const d = v === undefined ? new Date() : (v instanceof Date ? v : new Date(v));
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: RP_TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(d);
  const get = (t) => Number(parts.find(p => p.type === t).value);
  let hour = get("hour"); if (hour === 24) hour = 0; // quirk hour12:false kadang "24"
  return new Date(get("year"), get("month") - 1, get("day"), hour, get("minute"), get("second"));
}
const nowJakarta = () => toJakarta();

function downloadXLSX(filename, rows, sheetName) {
  if (!rows.length) { flash("Tidak ada data untuk diekspor."); return; }
  if (typeof XLSX === "undefined") { flash("Gagal memuat modul Excel — cek koneksi internet."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const colWidths = Object.keys(rows[0]).map(key => ({
    wch: Math.max(key.length, ...rows.map(r => String(r[key] ?? "").length)) + 2
  }));
  ws["!cols"] = colWidths;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Data");
  XLSX.writeFile(wb, filename);
}

// Bikin nomor HP jadi format internasional (62...) buat link wa.me, dan
// buka tab WhatsApp baru berisi pesan siap kirim.
function normalizePhoneID(phone) {
  let p = String(phone || "").replace(/[^0-9+]/g, "");
  p = p.replace(/^\+/, "");
  if (p.startsWith("0")) p = "62" + p.slice(1);
  else if (p.startsWith("620")) p = "62" + p.slice(3);
  else if (!p.startsWith("62")) p = "62" + p;
  return p;
}
function openWhatsApp(phone, message) {
  const clean = normalizePhoneID(phone);
  if (!clean || clean.length < 8) { flash("No. HP pelanggan belum diisi/valid untuk chat WhatsApp."); return; }
  const url = `https://wa.me/${clean}${message ? `?text=${encodeURIComponent(message)}` : ""}`;
  window.open(url, "_blank");
}
function getTheme() {
  // Default di sini HARUS sama dengan default di script bootstrap paling

function getAvatarKey() { return `rp_avatar_${(currentUser && currentUser.username) || "guest"}`; }
function getAvatarDataUrl() { try { return localStorage.getItem(getAvatarKey()) || ""; } catch (e) { return ""; } }

function getInitials(label) {
  const s = String(label || "").replace(/[—-].*$/, "").trim();
  if (!s) return "?";
  const parts = s.split(/\s+/);
  const first = parts[0]?.[0] || "";

}

function quickFanHtml() {

    { icon: "users", label: "Antrian", short: "Antrian", fn: "openQueueModal()" },

function handleAvatarFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (!file.type.startsWith("image/")) { flash("File harus berupa gambar."); return; }
  if (file.size > 1.5 * 1024 * 1024) { flash("Ukuran foto maksimal 1.5MB."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    setAvatarDataUrl(String(reader.result || ""));
    renderUserMenu();
    flash("Foto profil diperbarui.");
  };
  reader.onerror = () => flash("Gagal membaca file foto.");
  reader.readAsDataURL(file);
}

// Sama persis kayak foto cabang di Dashboard: diupload ke Cloudinary lalu
// URL-nya disimpen di state.settings.headerPhotos (ikut tersinkron via
// Firestore), jadi tiap halaman (Cabang&Unit, Riwayat, Pelanggan, Stok,
// Laporan) punya foto header sendiri-sendiri yang kebagi ke semua device/user.
let _pendingHeaderPhotoKey = "";
function getHeaderPhotoUrl(pageKey) {
  const map = state.settings.headerPhotos || {};
  return map[pageKey] || "";
}
function triggerHeaderPhotoPicker(pageKey) {
  _pendingHeaderPhotoKey = pageKey;
  const inp = document.getElementById("header-photo-file-input");
  if (inp) inp.click();
}
async function handleHeaderPhotoFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file || !_pendingHeaderPhotoKey) return;
  if (!file.type.startsWith("image/")) { flash("File harus berupa gambar."); return; }
  if (file.size > 5 * 1024 * 1024) { flash("Ukuran foto maksimal 5MB."); return; }
  const key = _pendingHeaderPhotoKey;
  flash("Mengunggah foto header…");
  try {
    const url = await uploadToCloudinary(file);
    state.settings.headerPhotos = { ...(state.settings.headerPhotos || {}), [key]: url };
    persistSettings();
    renderTab();
    flash("Foto header diperbarui.");
  } catch (err) {
    console.error(err);
    flash("Gagal upload foto header: " + (err && err.message ? err.message : "cek koneksi internet."));
  }
}
function removeHeaderPhoto(pageKey) {
  const map = { ...(state.settings.headerPhotos || {}) };
  delete map[pageKey];
  state.settings.headerPhotos = map;
  persistSettings();
  renderTab();
  flash("Foto header dihapus.");
}
(function initHeaderPhotoInput(){
  const inp = document.getElementById("header-photo-file-input");
  if (inp) inp.addEventListener("change", handleHeaderPhotoFile);
})();
// Header banner generik — desainnya sama persis kayak banner Dashboard
// (h1+subjudul di kiri, tombol/tools di kanan, opsional foto latar).
// `tools` diisi tombol-tombol yang sebelumnya sudah ada di header
// masing-masing halaman (Tambah unit, Ekspor, dsb) supaya tetap ada.
function pageHeaderBanner(opts) {
  const key = opts.key;
  const photoUrl = getHeaderPhotoUrl(key);
  const hasPhoto = !!photoUrl;
  const bannerStyle = hasPhoto
    ? ` style="background-image:linear-gradient(100deg, rgba(8,10,18,.74) 0%, rgba(8,10,18,.52) 45%, rgba(8,10,18,0) 88%), url('${esc(photoUrl)}')"`
    : "";
  const titleAttr = opts.titleOnClick ? ` onclick="${opts.titleOnClick}"` : "";
  return `
    <header class="rp-page-head rp-dash-banner${hasPhoto ? " has-photo" : ""}"${bannerStyle}${hasPhoto ? ` onclick="this.classList.toggle('rp-banner-edit-visible')"` : ""}>
      <div class="rp-dash-banner-text">
        <h1${titleAttr}>${opts.title}</h1>
        ${opts.subtitle ? `<p class="rp-sub"${opts.subtitleId ? ` id="${opts.subtitleId}"` : ""}>${opts.subtitle}</p>` : ""}
      </div>
      <div class="rp-head-tools rp-dash-banner-tools">
        <button class="rp-btn rp-btn-ghost rp-dash-banner-edit" onclick="event.stopPropagation();triggerHeaderPhotoPicker('${key}')">${icon("image", 13)} ${hasPhoto ? "Ganti foto" : "Tambah foto header"}</button>
        ${hasPhoto ? `<button class="rp-btn rp-btn-ghost rp-dash-banner-edit" onclick="event.stopPropagation();removeHeaderPhoto('${key}')">${icon("x", 13)} Hapus foto</button>` : ""}
      </div>

/* =========================================================
   API — jembatan ke Firestore
   Real-time via onSnapshot; offline queue & cache sudah
   ditangani otomatis oleh Firestore SDK (enablePersistence).
========================================================= */
let syncState = "idle"; // idle | error (busy ditandai lewat pendingWrites)
let isLoading = false;
let pendingWrites = 0;

function setSync(s) { syncState = s; renderSyncDot(); }
function docRef(sheet) { return dataCol.doc(sheet); }

async function apiSave(sheet, rows) {
  pendingWrites++;
  renderSyncDot();
  try {
    await docRef(sheet).set({ rows });
    setSync("idle");
  } catch (e) {
    console.error(e);
    setSync("error");
    flash("Gagal menyimpan — cek koneksi internet.");
  } finally {
    pendingWrites--;
    renderSyncDot();
  }
}

window.addEventListener("online", () => setSync("idle"));
window.addEventListener("offline", () => {
  setSync("error");
  flash("Sinyal terputus — perubahan akan otomatis tersinkron saat online kembali.");
});

function normalize(raw) {
  const settingsRow = (raw.Settings && raw.Settings[0]) || {};
  let businessName = settingsRow.businessName;
  let defaultRate = Number(settingsRow.defaultRate);
  if (!businessName || businessName === "businessName") businessName = "Rental PS Saya";
  if (!defaultRate || isNaN(defaultRate)) defaultRate = 5000;

  let branches = Array.isArray(settingsRow.branches) ? settingsRow.branches : [];
  branches = branches.filter(b => b && b.id && b.name).map(b => ({ id: String(b.id), name: String(b.name), photoUrl: b.photoUrl ? String(b.photoUrl) : "" }));
  if (!branches.length) branches = [{ id: "branch-main", name: "Cabang Utama" }];

  let cashiers = Array.isArray(settingsRow.cashiers) ? settingsRow.cashiers : [];
  cashiers = cashiers.filter(c => c && c.id && c.username && c.branchId).map(c => ({
    id: String(c.id), username: String(c.username).trim().toLowerCase(),
    password: String(c.password || ""), branchId: String(c.branchId)
  }));

  // Promo/diskon per cabang — dipilih lewat dropdown saat kasir menutup
  // transaksi (openFinishModal), lalu nilainya ikut tercatat di struk.
  let promos = Array.isArray(settingsRow.promos) ? settingsRow.promos : [];
  promos = promos.filter(p => p && p.id && p.name && p.branchId).map(p => ({
    id: String(p.id), name: String(p.name), branchId: String(p.branchId),
    type: p.type === "percent" ? "percent" : "nominal",
    value: Number(p.value) || 0
  }));

  // Kredensial admin sekarang disimpan di dokumen Settings (Firestore),
  // bukan ditulis langsung di source HTML. Fallback admin/admin123 dipakai
  // HANYA kalau Settings belum pernah di-set (instalasi baru), supaya tetap
  // bisa login pertama kali — setelah itu ganti passwordnya dari Firestore.
  const admin = {
    username: String(settingsRow.adminUsername || "admin").trim().toLowerCase(),
    password: String(settingsRow.adminPassword || "admin123")
  };

  const units = (raw.Units || []).map(u => ({
    ...u, rate: Number(u.rate) || 0,
    branchId: u.branchId || branches[0].id,
    branchName: u.branchName || (branches.find(b => b.id === u.branchId) || branches[0]).name
  }));

  const activeRentals = {};
  (raw.ActiveRentals || []).forEach(r => {
    if (r.unitId) activeRentals[r.unitId] = {
      startTime: Number(r.startTime), customerName: r.customerName || "Tamu",
      memberId: r.memberId || null, note: r.note || "",
      endTime: r.endTime ? Number(r.endTime) : null
    };
  });

  const transactions = (raw.Transactions || []).map(t => ({
    ...t, start: Number(t.start), end: Number(t.end),
    // Transaksi lama (sebelum field ini ada) belum punya endTimeDisplay —
    // fallback ke `end` (jam nyata ditutup) biar strukturnya tetap tampil.
    endTimeDisplay: t.endTimeDisplay != null ? Number(t.endTimeDisplay) : Number(t.end),
    minutes: Number(t.minutes), amount: Number(t.amount)
  })).sort((a,b) => b.end - a.end);

  const members = (raw.Members || []).map(m => ({
    ...m, joined: Number(m.joined) || Date.now(),
    visits: Number(m.visits) || 0, totalSpent: Number(m.totalSpent) || 0
  }));

  const inventory = (raw.Inventory || []).map(i => ({ ...i, lastCheck: Number(i.lastCheck) || Date.now() }));

  const queue = (raw.Queue || []).map(q => ({
    id: q.id, customerName: q.customerName || "Tamu", phone: q.phone || "",
    unitId: q.unitId || null, note: q.note || "", requestedAt: Number(q.requestedAt) || Date.now(),
    branchId: q.branchId || null,
  }));

  const expenses = (raw.Expenses || []).map(e => ({
    id: e.id, date: Number(e.date) || Date.now(), category: e.category || "Lainnya",
    description: e.description || "", amount: Number(e.amount) || 0,
    branchId: e.branchId || branches[0].id, branchName: e.branchName || (branches.find(b=>b.id===(e.branchId||branches[0].id))||branches[0]).name
  }));

  let headerPhotos = (settingsRow.headerPhotos && typeof settingsRow.headerPhotos === "object") ? settingsRow.headerPhotos : {};
  headerPhotos = Object.fromEntries(Object.entries(headerPhotos).filter(([k, v]) => k && v).map(([k, v]) => [String(k), String(v)]));

  // QRIS (gambar) & no. rekening transfer usaha — ditampilkan ke kasir saat
  // pelanggan bayar QRIS/Transfer, dan ikut dicatat ke struk transaksi.
  const qrisImage = settingsRow.qrisImage ? String(settingsRow.qrisImage) : "";
  const bankAccount = settingsRow.bankAccount ? String(settingsRow.bankAccount) : "";

  const settings = { businessName, defaultRate, branches, cashiers, promos, admin, headerPhotos, qrisImage, bankAccount };
  return { settings, units, activeRentals, transactions, members, inventory, queue, expenses };
}

let state = {
  settings: { businessName: "Rental PS Saya", defaultRate: 5000, branches: [{id:"branch-main",name:"Cabang Utama"}], cashiers: [], promos: [], admin: { username: "admin", password: "admin123" }, headerPhotos: {}, qrisImage: "", bankAccount: "" },
  units: [], activeRentals: {}, transactions: [], members: [], inventory: [], queue: [], expenses: []
};
let currentTab = "dashboard";
let ready = false;
let firstRenderDone = false;
let firestoreStarted = false;
let currentUser = null;
let selectedBranchId = null;

const DEFAULT_ADMIN = { username: "admin", password: "admin123" };
function getAdminAccount(){ return (state.settings && state.settings.admin) || DEFAULT_ADMIN; }
// Akun kasir sekarang dikelola per cabang lewat menu admin "Cabang & Unit"
// dan disimpan di state.settings.cashiers (ikut tersinkron ke Firestore).
// Selama admin belum menambahkan akun apapun, akun lama (kasir/kasir123)
// tetap berlaku sebagai fallback, terikat ke cabang pertama, biar yang
// sedang pakai sistem tidak tiba-tiba terkunci.
function getCashiers(){ return Array.isArray(state.settings.cashiers) ? state.settings.cashiers : []; }
// PENTING: selalu kirim `cashiersList` secara eksplisit dari sumber yang
// sedang dipakai (state yang sudah ready, ATAU direktori login yang di-
// preload sebelum login). Sebelumnya fungsi ini diam-diam selalu membaca
// state.settings.cashiers global, padahal saat di layar login state itu
// masih kosong (belum tersambung Firestore) — akibatnya akun kasir baru
// yang dibuat admin tidak pernah kebaca, dan sistem selalu jatuh balik ke
// akun lama (kasir / kasir123).
function cashiersWithFallback(branchList, cashiersList){
  const list = Array.isArray(cashiersList) ? cashiersList : getCashiers();
  if (list.length) return list;
  const bs = (branchList && branchList.length) ? branchList : [{ id: "branch-main", name: "Cabang Utama" }];
  return [{ id: "legacy-kasir", username: "kasir", password: "kasir123", branchId: bs[0].id }];
}
// Sebelum login, kita belum tersambung ke Firestore (listener baru mulai
// setelah login berhasil). Supaya validasi akun kasir per cabang tetap bisa
// jalan di layar login, ambil dokumen Settings sekali secara langsung.
function preloadLoginDirectory(){
  return docRef("Settings").get().then(snap=>{
    const row=(snap.exists && snap.data().rows && snap.data().rows[0]) || {};
    const branches=(Array.isArray(row.branches)&&row.branches.length)?row.branches.filter(b=>b&&b.id&&b.name):[];
    window._loginDirectory={
      branches: branches.length?branches:[{id:"branch-main",name:"Cabang Utama"}],
      cashiers: Array.isArray(row.cashiers)?row.cashiers:[],
      admin: {
        username: String(row.adminUsername || DEFAULT_ADMIN.username).trim().toLowerCase(),
        password: String(row.adminPassword || DEFAULT_ADMIN.password)
      }
    };
  }).catch(()=>{
    window._loginDirectory={branches:[{id:"branch-main",name:"Cabang Utama"}],cashiers:[],admin:DEFAULT_ADMIN};
  });
}
function getLoginDirectory(){
  if (ready) return { branches:getBranches(), cashiers:cashiersWithFallback(getBranches(), getCashiers()), admin:getAdminAccount() };
  const dir = window._loginDirectory || {branches:[{id:"branch-main",name:"Cabang Utama"}],cashiers:[],admin:DEFAULT_ADMIN};
  return { branches:dir.branches, cashiers:cashiersWithFallback(dir.branches, dir.cashiers), admin: dir.admin||DEFAULT_ADMIN };
}
// Sesi login sekarang disimpen di localStorage (bukan sessionStorage) biar
// tetap login walau tab/browser ditutup. Sebagai gantinya, sesi otomatis
// dianggap habis kalau tidak ada aktivitas apa pun selama IDLE_LIMIT_MS
// (lihat trackActivity() & startIdleWatcher() di bawah).
const IDLE_LIMIT_MS = 8 * 60 * 60 * 1000; // 8 jam
function getLastActive(){ const v = parseInt(localStorage.getItem("rp_user_last_active")||"0", 10); return isNaN(v) ? 0 : v; }
function touchLastActive(){ try{ localStorage.setItem("rp_user_last_active", String(Date.now())); }catch(e){} }
function isSessionExpired(){ const last = getLastActive(); return last>0 && (Date.now()-last) > IDLE_LIMIT_MS; }
function getCurrentUser(){
  try {
    const r=localStorage.getItem("rp_user");
    if(!r) return null;
    if(isSessionExpired()){ localStorage.removeItem("rp_user"); localStorage.removeItem("rp_user_last_active"); return null; }
    return JSON.parse(r);
  } catch(e){return null;}
}
function isAdmin(){ return currentUser?.role==="admin"; }
function showLogin(errorMsg=""){
  currentUser=null; ready=false;
  document.getElementById("root").innerHTML=`<div class="rp-login-screen"><div class="rp-login-card">
    <div class="rp-login-brand"><div class="rp-login-mark">${esc(getInitials(state.settings.businessName))}</div><div><div class="rp-login-title">${esc(state.settings.businessName)}</div><div class="rp-login-sub">Sistem Kasir Digital</div></div></div>
    <label class="rp-field"><span>Username</span><input id="login-username" autocomplete="username" autofocus placeholder="Masukkan username"></label>
    <label class="rp-field"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" placeholder="Masukkan password" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <div class="rp-login-error">${esc(errorMsg)}</div>
    <button class="rp-btn rp-btn-start" onclick="doLogin()">Masuk</button>

function doLogin(){
  const username=(document.getElementById("login-username")?.value||"").trim().toLowerCase();
  const password=document.getElementById("login-password")?.value||"";
  const dir=getLoginDirectory();
  if(username===dir.admin.username){
    if(dir.admin.password!==password){showLogin("Username atau password salah.");return;}
    currentUser={username:dir.admin.username,role:"admin",label:"Administrator",branchId:null};
  } else {
    const match=dir.cashiers.find(c=>String(c.username||"").trim().toLowerCase()===username && String(c.password||"")===password);
    if(!match){showLogin("Username atau password salah.");return;}
    const branchName=(dir.branches.find(b=>b.id===match.branchId)||{}).name||"Cabang";
    currentUser={username,role:"kasir",label:branchName,branchId:match.branchId};
  }
  try{localStorage.setItem("rp_user",JSON.stringify(currentUser));}catch(e){}
  touchLastActive();
  startApp();
}
function logoutApp(){try{localStorage.removeItem("rp_user");localStorage.removeItem("rp_user_last_active");}catch(e){} currentUser=null;ready=false;currentTab="dashboard";hideTrendHover();renderUserMenu();showLogin();}

// Update jam "terakhir aktif" tiap ada interaksi user (klik, ketik, scroll,
// sentuh), di-throttle 60 detik biar gak nulis localStorage tiap gerakan
// mouse. Dipakai idle watcher di bawah buat auto-logout 8 jam tanpa aktivitas.
let _lastActivityWrite = 0;
function trackActivity(){
  if(!currentUser) return;
  const now = Date.now();
  if(now - _lastActivityWrite < 60000) return;
  _lastActivityWrite = now;
  touchLastActive();
}
["click","keydown","mousemove","scroll","touchstart"].forEach(evt=>{
  document.addEventListener(evt, trackActivity, { passive:true });
});
// Cek tiap menit: kalau lagi login dan sudah idle lebih dari 8 jam, logout
// otomatis. Ini nutup kasus tab dibiarkan terbuka tanpa disentuh (bukan cuma
// dicek pas buka/refresh halaman lewat getCurrentUser()).
setInterval(()=>{
  if(currentUser && isSessionExpired()){
    logoutApp();
    flash("Sesi berakhir karena tidak ada aktivitas selama 8 jam, silakan login lagi.");
  }
}, 60000);
function startApp(){
  if(!currentUser){showLogin();return;}
  renderUserMenu();
  document.getElementById("root").innerHTML=`<div class="rp-loading-screen">
    <div class="rp-loading-mark"><span class="rp-loading-ring"></span><span class="rp-loading-chip">PS</span></div>
    <div class="rp-loading-text">Menyiapkan sistem<span class="rp-loading-dots"><i></i><i></i><i></i></span></div>
    <div class="rp-loading-bar"><div class="rp-loading-bar-fill" id="loading-bar-fill"></div></div>
    <div class="rp-loading-count" id="loading-count">Menghubungkan ke database…</div></div>`;
  if(!firestoreStarted){
    firestoreStarted=true;initFirestoreListeners();
  } else {
    // Login ulang di sesi yang sama (tanpa refresh): listener Firestore
    // sudah jalan dari sesi sebelumnya dan datanya masih tersimpan di
    // loadedSheets/state, tapi `ready` sempat di-reset ke false saat
    // logout (lihat showLogin/logoutApp). Kalau kita cuma cek `ready`
    // di sini, nilainya masih stale (false) sehingga tidak ada cabang
    // manapun yang jalan dan layar loading nyangkut sampai di-refresh.
    // Makanya recompute langsung dari loadedSheets yang datanya valid.
    if (loadedSheets.size >= SHEETS.length) ready = true;
    if (ready) renderAll();
  }
}
function getBranches(){return Array.isArray(state.settings.branches)&&state.settings.branches.length?state.settings.branches:[{id:"branch-main",name:"Cabang Utama"}];}
function getBranchName(id){return (getBranches().find(b=>b.id===id)||{}).name||"Cabang Utama";}
// Promo/diskon per cabang — dikelola admin di menu "Cabang & Unit", lalu
