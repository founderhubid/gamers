function submitCashier(id){
  const username=(document.getElementById("cashier-username").value||"").trim().toLowerCase();
  const password=(document.getElementById("cashier-password").value||"").trim();
  const branchId=document.getElementById("cashier-branch").value;
  if(!username){flash("Username wajib diisi.");return;}
  if(username===getAdminAccount().username){flash("Username ini sudah dipakai akun admin.");return;}
  if(!password||password.length<4){flash("Password minimal 4 karakter.");return;}
  if(!branchId){flash("Cabang wajib dipilih.");return;}
  const dup=getCashiers().find(c=>c.id!==id && c.username===username);
  if(dup){flash("Username sudah dipakai akun kasir lain.");return;}
  upsertCashier({id,username,password,branchId});
}

function submitPromo(id){
  const branchId = document.getElementById("promo-branch").value;
  const name = document.getElementById("promo-name").value.trim();
  const type = document.getElementById("promo-type").value === "percent" ? "percent" : "nominal";

  if (!name) { flash("Nama promo wajib diisi."); return; }
  if (!branchId) { flash("Cabang wajib dipilih."); return; }
  if (value <= 0) { flash("Nilai diskon harus lebih dari 0."); return; }
  if (type === "percent") value = Math.min(100, value);
  upsertPromo({ id, branchId, name, type, value });

function getLaporanBranchId() {
  if (!window._laporanBranchId) window._laporanBranchId = "ALL";
  if (window._laporanBranchId !== "ALL" && !getBranches().some(b => b.id === window._laporanBranchId)) {

    getBranches().map(b => `<option value="${esc(b.id)}"${b.id === cur ? " selected" : ""}>${esc(b.name)}</option>`).join("");
  return `<label class="rp-field" style="min-width:220px;"><span>Cabang</span><select onchange="setLaporanBranch(this.value)">${opts}</select></label>`;
}
function laporanBranchLabel() {
  const bid = getLaporanBranchId();
  return bid === "ALL" ? "Semua Cabang" : getBranchName(bid);
}
function getTransactionsForLaporanBranch() {
  const bid = getLaporanBranchId();
  if (bid === "ALL") return state.transactions.slice();
  return state.transactions.filter(t => {
    if (t.branchId) return t.branchId === bid;
    const u = state.units.find(x => x.id === t.unitId);
    return u ? (u.branchId || getBranches()[0].id) === bid : false;
  });
}

function getLaporanMonthValue() {
  const now = nowJakarta();
  return window._laporanMonth || `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
}

function getLaporanMonthOptions() {
  const now = nowJakarta();
  const months = new Set();
  const addMonth = (v) => {
    if (!v) return;
    const d = toJakarta(v);
    if (!isNaN(d.getTime())) months.add(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`);
  };
  const laporanBid = getLaporanBranchId();
  getTransactionsForLaporanBranch().forEach(t => addMonth(t.end));
  state.expenses.filter(e => laporanBid === "ALL" || (e.branchId || getBranches()[0].id) === laporanBid).forEach(e => addMonth(e.date));

  const currentValue = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  months.add(currentValue);

  const sorted = Array.from(months).sort();
  if (!sorted.length) sorted.push(currentValue);

  return sorted.reverse().map(value => {
    const [year, month] = value.split('-').map(Number);
    const label = new Date(year, month - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    const selected = value === getLaporanMonthValue() ? ' selected' : '';
    return `<option value="${value}"${selected}>${label}</option>`;
  }).join('');
}

function getSelectedLaporanRange() {
  const value = getLaporanMonthValue();
  const [year, month] = value.split('-').map(Number);
  const start = new Date(year, month - 1, 1);
  const end = new Date(year, month, 0, 23, 59, 59, 999);
  const label = start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  return { start, end, label, value };
}

function getPeriodRange(period, selectedMonthValue) {
  if (period === 'bulan' && selectedMonthValue) {
    const [year, month] = selectedMonthValue.split('-').map(Number);
    const start = new Date(year, month - 1, 1);
    const end = new Date(year, month, 0, 23, 59, 59, 999);
    const label = `Bulan terpilih (${start.toLocaleDateString('id-ID',{month:'long',year:'numeric'})})`;
    return { start, end, label };
  }
  const now = nowJakarta();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  return { start, end, label: `Bulan terpilih (${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})})` };
}

function sumByDay(d) {
  const key = d.toDateString();
  return state.transactions.filter(t => toJakarta(t.end).toDateString() === key).reduce((a,t) => a+t.amount, 0);
}
function sumByMonth(year, month) {
  return state.transactions.filter(t => { const d = toJakarta(t.end); return d.getFullYear() === year && d.getMonth() === month; }).reduce((a,t) => a+t.amount, 0);
}
function sumByDate(year, month, day) {
  return getVisibleTransactions().filter(t => { const d = toJakarta(t.end); return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day; }).reduce((a,t) => a+t.amount, 0);
}

// Sama seperti sumByDate, tapi mengikuti filter cabang milik halaman Laporan
// (getLaporanBranchId), bukan cabang aktif global (selectedBranchId) yang
// dipakai di menu Kasir/Unit. Dipakai khusus untuk grafik tren di Laporan.
function sumByDateForLaporan(year, month, day, branchId) {
  const bid = branchId || getLaporanBranchId();
  return state.transactions.filter(t => {
    const d = toJakarta(t.end);
    if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return false;
    if (bid === "ALL") return true;
    if (t.branchId) return t.branchId === bid;
    const u = state.units.find(x => x.id === t.unitId);
    return u ? (u.branchId || getBranches()[0].id) === bid : false;
  }).reduce((a,t) => a + t.amount, 0);
}

function buildLaporanTrend(period, currentStart, branchId) {
  const bid = branchId || getLaporanBranchId();
  const year = currentStart.getFullYear(), month = currentStart.getMonth();
  const today = nowJakarta();
  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const days = isCurrentMonth ? today.getDate() : lastDay;
  let prevMonth = month - 1, prevYear = year;
  if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
  const prevLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();
  const labels = [], current = [], previous = [];
  for (let i = 1; i <= days; i++) {
    labels.push(String(i));
    current.push(sumByDateForLaporan(year, month, i, bid));
    previous.push(i <= prevLastDay ? sumByDateForLaporan(prevYear, prevMonth, i, bid) : 0);
  }
  return { labels, current, previous, prevYear, prevMonth };
}

function insightCard(type, title, text) {
  const cls = type === 'good' ? 'is-good' : type === 'warn' ? 'is-warn' : type === 'bad' ? 'is-bad' : '';
  const ic = type === 'good' ? 'trending-up' : type === 'warn' ? 'alert-triangle' : type === 'bad' ? 'trending-down' : 'info';
  return `<div class="rp-insight-card ${cls}">
    <span class="rp-insight-icon">${icon(ic, 15)}</span>
    <div class="rp-insight-body">
      <div class="rp-insight-title">${esc(title)}</div>
      <div class="rp-insight-text">${text}</div>
    </div>
  </div>`;
}
function rekomendasiCard(priority, title, text) {
  const map = {
    tinggi: ['is-bad', 'p-tinggi', 'Prioritas tinggi'],
    sedang: ['is-warn', 'p-sedang', 'Prioritas sedang'],
    rendah: ['is-good', 'p-rendah', 'Prioritas rendah'],
  };
  const [cls, badgeCls, badgeLabel] = map[priority] || map.sedang;
  return `<div class="rp-insight-card ${cls}">
    <span class="rp-insight-icon">${icon('target', 15)}</span>
    <div class="rp-insight-body">
      <div class="rp-insight-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <span>${esc(title)}</span>
        <span class="rp-priority-badge ${badgeCls}">${badgeLabel}</span>
      </div>
      <div class="rp-insight-text">${text}</div>
    </div>
  </div>`;
}
function renderInsightSection(insights, recs) {
  return `
  <div class="rp-ruled-head">${icon('bulb', 14)} Insight <span class="rp-dim" style="text-transform:none;letter-spacing:normal;">— pembacaan otomatis dari data periode ini</span></div>
  <div class="rp-insight-grid">${insights.length ? insights.join('') : emptyState('Belum cukup data untuk insight pada periode ini.')}</div>
  <div class="rp-ruled-head" style="margin-top:22px;">${icon('target', 14)} Rekomendasi</div>
  <div class="rp-insight-grid">${recs.length ? recs.join('') : emptyState('Belum ada rekomendasi khusus untuk periode ini.')}</div>`;
}

// Insight & rekomendasi untuk halaman "Laporan" (fokus pendapatan/operasional).
function buildLaporanInsights(ctx) {
  const {
    totalRevenue, totalTx, avgPerTx, byUnit, byPayment,
    totalDiscount, discountPct, nonPromoTx, subtotalDiffPct,
    revenueDiff, revenueDiffPct, prevMonthTotal, prevMonthLabel,
  } = ctx;
  const insights = [], recs = [];

  // 1) Tren pendapatan vs bulan lalu
  if (prevMonthTotal > 0 || totalRevenue > 0) {
    if (revenueDiff > 0) {
      insights.push(insightCard('good', 'Pendapatan tumbuh dibanding bulan lalu',
        `Pendapatan naik <strong>${Math.abs(revenueDiffPct).toFixed(1)}%</strong> (${rupiah(revenueDiff)}) dibanding ${esc(prevMonthLabel)}.`));
    } else if (revenueDiff < 0) {
      insights.push(insightCard('bad', 'Pendapatan turun dibanding bulan lalu',
        `Pendapatan turun <strong>${Math.abs(revenueDiffPct).toFixed(1)}%</strong> (${rupiah(Math.abs(revenueDiff))}) dibanding ${esc(prevMonthLabel)}.`));
      recs.push(rekomendasiCard('tinggi', 'Cari tahu penyebab penurunan pendapatan',
        `Bandingkan jumlah sewa &amp; jam sewa bulan ini dengan bulan lalu di rincian per unit — cek apakah ada unit yang sering kosong/rusak, jam ramai bergeser, atau ada pesaing baru. Pertimbangkan promo terbatas waktu untuk mendongkrak transaksi di sisa periode.`));
    }
  }

  // 2) Konsentrasi & kesenjangan performa unit
  if (byUnit.length) {
    const top = byUnit[0][1];
    const topShare = totalRevenue > 0 ? (top.total / totalRevenue * 100) : 0;
    if (topShare >= 40) {
      insights.push(insightCard('warn', 'Pendapatan bertumpu pada satu unit',
        `Unit <strong>${esc(top.unitName)}</strong> menyumbang <strong>${topShare.toFixed(1)}%</strong> dari total pendapatan bulan ini — cukup berisiko kalau unit ini rusak atau harus di-maintenance mendadak.`));
      recs.push(rekomendasiCard('sedang', `Kurangi ketergantungan pada ${esc(top.unitName)}`,
        `Prioritaskan perawatan rutin unit ini supaya minim downtime, dan buat promo silang (bundling/diskon) ke unit lain agar beban pendapatan tidak menumpuk di satu unit saja.`));
    }
    if (byUnit.length >= 3) {
      const bottom = byUnit[byUnit.length - 1][1];
      const bottomShare = totalRevenue > 0 ? (bottom.total / totalRevenue * 100) : 0;
      if (bottomShare > 0 && bottomShare < 5) {
        insights.push(insightCard('info', 'Ada unit dengan kontribusi sangat kecil',
          `Unit <strong>${esc(bottom.unitName)}</strong> hanya menyumbang <strong>${bottomShare.toFixed(1)}%</strong> dari total pendapatan (${bottom.count}x disewa) bulan ini.`));
        recs.push(rekomendasiCard('rendah', `Evaluasi unit ${esc(bottom.unitName)}`,
          `Cek kondisi fisik, harga sewa, dan posisi/penempatan unit ini. Kalau memang kurang diminati, coba promo khusus, reposisi tempat, atau jadikan unit cadangan untuk jam ramai.`));
      }
    }
  }

  // 3) Konsentrasi metode pembayaran (risiko rekonsiliasi kas)
  if (byPayment.length) {
    const [topName, topData] = byPayment[0];
    const topPayShare = totalRevenue > 0 ? (topData.total / totalRevenue * 100) : 0;
    if (/tunai|cash/i.test(topName) && topPayShare >= 70) {
      insights.push(insightCard('warn', 'Transaksi masih didominasi tunai',
        `<strong>${topPayShare.toFixed(1)}%</strong> pendapatan bulan ini dibayar via ${esc(topName)} — lebih rawan selisih kas dan lebih sulit ditelusuri dibanding pembayaran digital.`));
      recs.push(rekomendasiCard('sedang', 'Dorong pembayaran non-tunai',
        `Tawarkan QRIS/transfer sebagai opsi utama saat closing transaksi di kasir, dan lakukan rekap fisik kas lebih rutin (harian) untuk menekan risiko selisih.`));
    }
  }

  // 4) Efektivitas promo/diskon
  if (totalDiscount > 0) {
    if (discountPct >= 15) {
      insights.push(insightCard('warn', 'Diskon menggerus porsi cukup besar dari pendapatan kotor',
        `Total diskon <strong>${rupiah(totalDiscount)}</strong> setara <strong>${discountPct.toFixed(1)}%</strong> dari pendapatan kotor bulan ini — cukup besar untuk skala bulanan.`));
    }
    if (nonPromoTx.length > 0) {
      if (subtotalDiffPct >= 10) {
        insights.push(insightCard('good', 'Promo terbukti mendorong nilai transaksi lebih besar',
          `Transaksi yang pakai promo rata-rata <strong>${Math.abs(subtotalDiffPct).toFixed(1)}% lebih besar</strong> dibanding yang tidak pakai promo — indikasi promo efektif mendorong belanja pelanggan.`));
        recs.push(rekomendasiCard('rendah', 'Lanjutkan & perluas promo yang berjalan',
          `Promo saat ini terbukti mendorong nilai transaksi lebih besar. Pertimbangkan menaikkan anggaran promo atau memperluasnya ke unit/jam yang masih sepi.`));
      } else if (subtotalDiffPct < 0) {
        insights.push(insightCard('bad', 'Promo justru dipakai di transaksi bernilai kecil',
          `Transaksi pakai promo rata-rata <strong>${Math.abs(subtotalDiffPct).toFixed(1)}% lebih kecil</strong> dibanding tanpa promo — diskon di bulan ini lebih ke arah memotong margin daripada mendorong belanja tambahan.`));
        recs.push(rekomendasiCard('tinggi', 'Evaluasi ulang syarat & sasaran promo',
          `Pertimbangkan menaikkan minimum transaksi untuk memakai promo, atau targetkan promo khusus ke jam/hari sepi saja supaya tidak memotong margin transaksi yang sebenarnya sudah ramai.`));
      }
    }
  } else if (totalRevenue > 0) {
    insights.push(insightCard('info', 'Belum ada promo dipakai bulan ini',
      `Tidak ada transaksi dengan diskon pada periode ini, jadi efektivitas promo belum bisa diukur untuk bulan ini.`));
  }

  // 5) Ringkasan volume transaksi (info umum, selalu tampil kalau ada data)
  if (totalTx > 0) {
    insights.push(insightCard('info', 'Ringkasan volume transaksi',
      `Tercatat <strong>${totalTx} transaksi</strong> sewa dengan rata-rata <strong>${rupiah(avgPerTx)}</strong> per transaksi pada periode ini.`));
  }

  if (!recs.length) {
    recs.push(rekomendasiCard('rendah', 'Pertahankan performa saat ini',
      `Tidak ada sinyal masalah signifikan dari data bulan ini. Fokus jaga kualitas layanan &amp; kondisi unit, serta pantau tren di bulan berikutnya.`));
  }
  return { insights, recs };
}

// Insight & rekomendasi untuk halaman "Laba-Rugi" (fokus kesehatan keuangan).
function buildLabaRugiInsights(ctx) {
  const {
    totalRevenue, totalExpense, netProfit, profitMarginPct,
    expenseCategories, prevTotals, prevRangeLabel, trendData, branchData,
  } = ctx;
  const insights = [], recs = [];

  // 1) Kesehatan margin laba
  if (totalRevenue > 0) {
    if (netProfit < 0) {
      insights.push(insightCard('bad', 'Bulan ini merugi',
        `Pengeluaran (${rupiah(totalExpense)}) melebihi pendapatan (${rupiah(totalRevenue)}), sehingga rugi bersih <strong>${rupiah(Math.abs(netProfit))}</strong>.`));
      recs.push(rekomendasiCard('tinggi', 'Lakukan pemangkasan biaya segera',
        `Tinjau ulang komponen pengeluaran terbesar bulan ini (lihat "Komposisi pengeluaran per kategori" di atas) dan tunda biaya yang bisa ditunda. Cek juga apakah harga sewa saat ini masih sesuai dengan biaya operasional.`));
    } else if (profitMarginPct < 10) {
      insights.push(insightCard('warn', 'Margin laba masih tipis',
        `Laba bersih hanya <strong>${profitMarginPct.toFixed(1)}%</strong> dari pendapatan (${rupiah(netProfit)}) — ruang aman terhadap kenaikan biaya mendadak masih kecil.`));
      recs.push(rekomendasiCard('sedang', 'Perbesar margin sebelum ekspansi',
        `Pertimbangkan efisiensi biaya operasional rutin atau penyesuaian harga sewa sebelum menambah unit/cabang baru, supaya buffer laba lebih aman.`));
    } else if (profitMarginPct < 25) {
      insights.push(insightCard('good', 'Margin laba sehat',
        `Laba bersih <strong>${profitMarginPct.toFixed(1)}%</strong> dari pendapatan (${rupiah(netProfit)}) — berada di kisaran sehat untuk bisnis rental.`));
    } else {
      insights.push(insightCard('good', 'Margin laba sangat baik',
        `Laba bersih mencapai <strong>${profitMarginPct.toFixed(1)}%</strong> dari pendapatan (${rupiah(netProfit)}) — kondisi keuangan bulan ini kuat.`));
      recs.push(rekomendasiCard('rendah', 'Manfaatkan momentum untuk berkembang',
        `Margin sedang tinggi — waktu yang baik untuk menyisihkan sebagian laba sebagai dana darurat/ekspansi, misalnya menambah unit baru atau membuka cabang.`));
    }
  } else {
    insights.push(insightCard('info', 'Belum ada pendapatan pada periode ini',
      `Data pendapatan masih kosong sehingga margin laba belum bisa dihitung untuk periode ini.`));
  }

  // 2) Perbandingan bulan-ke-bulan (MoM)
  if (prevTotals && (prevTotals.totalRevenue > 0 || prevTotals.totalExpense > 0)) {
    const profitDiff = netProfit - prevTotals.netProfit;
    if (profitDiff > 0) {
      insights.push(insightCard('good', 'Laba membaik dibanding bulan lalu',
        `Laba bersih naik <strong>${rupiah(Math.abs(profitDiff))}</strong> dibanding ${esc(prevRangeLabel)}.`));
    } else if (profitDiff < 0) {
      insights.push(insightCard('bad', 'Laba menurun dibanding bulan lalu',
        `Laba bersih turun <strong>${rupiah(Math.abs(profitDiff))}</strong> dibanding ${esc(prevRangeLabel)}.`));
      const revDiff = totalRevenue - prevTotals.totalRevenue;
      const expDiff = totalExpense - prevTotals.totalExpense;
      if (expDiff > 0 && revDiff >= 0) {
        recs.push(rekomendasiCard('tinggi', 'Kendalikan kenaikan pengeluaran',
          `Pendapatan stabil/naik, tapi pengeluaran naik <strong>${rupiah(expDiff)}</strong> dibanding bulan lalu — telusuri kategori pengeluaran mana yang paling naik dan cari cara menekannya.`));
      } else if (revDiff < 0) {
        recs.push(rekomendasiCard('tinggi', 'Genjot kembali pendapatan',
          `Penurunan laba terutama didorong turunnya pendapatan (<strong>${rupiah(Math.abs(revDiff))}</strong>) dibanding bulan lalu. Cek halaman Laporan untuk detail unit &amp; metode pembayaran yang menurun.`));
      }
    }
  }

  // 3) Struktur pengeluaran per kategori
  if (expenseCategories.length && totalExpense > 0) {
    const nonMisc = expenseCategories.filter(c => c.category !== 'Lainnya');
    const top = (nonMisc[0] || expenseCategories[0]);
    const topShare = totalExpense > 0 ? (top.amount / totalExpense * 100) : 0;
    if (topShare >= 40) {
      insights.push(insightCard('warn', `Pengeluaran didominasi kategori "${esc(top.category)}"`,
        `Kategori ini menyumbang <strong>${topShare.toFixed(1)}%</strong> dari total pengeluaran (${rupiah(top.amount)}) bulan ini.`));
      recs.push(rekomendasiCard('sedang', `Audit biaya kategori "${esc(top.category)}"`,
        `Karena porsinya besar terhadap total pengeluaran, cek ulang rinciannya — apakah ada pemborosan, peluang nego harga ke supplier, atau perlu dijadwalkan ulang supaya lebih efisien.`));
    }
  }

  // 4) Pola hari rugi dalam sebulan (dari tren harian)
  if (trendData && Array.isArray(trendData.profitPerDay) && trendData.profitPerDay.length) {
    const negativeDays = trendData.profitPerDay.filter(v => v < 0).length;
    const totalDays = trendData.profitPerDay.length;
    if (negativeDays >= Math.ceil(totalDays * 0.3)) {
      insights.push(insightCard('warn', 'Banyak hari dengan laba harian negatif',
        `Tercatat <strong>${negativeDays} dari ${totalDays} hari</strong> pada bulan ini pengeluaran harian melebihi pendapatan harian.`));
      recs.push(rekomendasiCard('sedang', 'Cek pola pengeluaran harian',
        `Bandingkan tanggal-tanggal rugi dengan jenis pengeluaran yang dicatat pada hari itu di grafik tren di atas — kemungkinan ada biaya besar (mis. maintenance/stok) yang bisa dijadwalkan di hari ramai supaya tidak menumpuk di hari sepi.`));
    }
  }

  // 5) Kesenjangan/masalah kontribusi laba antar cabang (khusus tampilan Semua Cabang)
  if (branchData && branchData.length > 1) {
    const best = branchData[0];
    const worst = branchData[branchData.length - 1];
    if (worst.profit < 0) {
      insights.push(insightCard('bad', `Cabang "${esc(worst.name)}" merugi bulan ini`,
        `Cabang ini mencatat rugi <strong>${rupiah(Math.abs(worst.profit))}</strong>, sementara cabang terbaik "${esc(best.name)}" mencetak laba <strong>${rupiah(best.profit)}</strong>.`));
      recs.push(rekomendasiCard('tinggi', `Investigasi cabang "${esc(worst.name)}"`,
        `Cek utilisasi unit, biaya sewa tempat, dan pengeluaran operasional cabang ini secara khusus. Kalau kerugian berulang tiap bulan, pertimbangkan restrukturisasi biaya atau evaluasi kelayakan cabang.`));
    } else if (best.profit > 0) {
      const gapPct = (best.profit - worst.profit) / best.profit * 100;
      if (gapPct >= 50) {
        insights.push(insightCard('info', 'Kesenjangan performa antar cabang cukup lebar',
          `Cabang "${esc(best.name)}" (${rupiah(best.profit)}) jauh lebih untung dibanding cabang "${esc(worst.name)}" (${rupiah(worst.profit)}) bulan ini.`));
        recs.push(rekomendasiCard('rendah', `Tularkan strategi dari cabang "${esc(best.name)}"`,
          `Pelajari apa yang membuat cabang ini lebih unggul (harga, promo, jam ramai, penataan unit) dan coba terapkan pola serupa di cabang yang masih tertinggal.`));
      }
    }
  }

  if (!recs.length) {
    recs.push(rekomendasiCard('rendah', 'Kondisi keuangan relatif stabil',
      `Tidak ada sinyal masalah signifikan pada laporan laba-rugi bulan ini. Terus pantau tren bulanan untuk deteksi dini kalau ada perubahan.`));
  }
  return { insights, recs };
}

function renderLabaRugiBody(period, unused, start, end, periodTx, branchId) {
  const bid = branchId || getLaporanBranchId();
  const showBranchCol = bid === "ALL";
  const periodExpenses = state.expenses.filter(e => {
    const d = toJakarta(e.date).getTime();
    const eb = e.branchId || getBranches()[0].id;
    return d >= start.getTime() && d <= end.getTime() && (bid === "ALL" || eb === bid);
  });
  const totalRevenue = periodTx.reduce((a,t)=>a+Number(t.amount||0),0);
  const totalExpense = periodExpenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const netProfit = totalRevenue-totalExpense;
  const profitMarginPct = totalRevenue > 0 ? (netProfit/totalRevenue*100) : 0;
  window._labaRugiExport = {periodTx,periodExpenses,totalRevenue,totalExpense,netProfit,profitMarginPct};
  const sortedRevenueTx = periodTx.slice().sort((a,b)=>toJakarta(b.end).getTime()-toJakarta(a.end).getTime());
  const revenueColCount = showBranchCol ? 8 : 7;
  const expenseColCount = showBranchCol ? 7 : 6;

  // ---- Data untuk chart investor-grade ----
  const trendData = buildLabaRugiDailyTrend(start, periodTx, periodExpenses);
  const expenseCategories = buildExpenseCategoryBreakdown(periodExpenses);
  const prevRange = getPrevMonthRange(start);
  const prevTotals = computeLabaRugiTotalsForRange(prevRange.start, prevRange.end, bid);
  const currentMonthLabel = start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  const branchData = showBranchCol ? buildBranchProfitBreakdown(periodTx, periodExpenses) : [];

  const chartsHtml = `
  <div class="rp-ruled-head">Tren harian: pendapatan vs pengeluaran vs laba bersih</div>
  <div class="rp-chart-box">
    ${svgLabaRugiTrendChart(trendData.labels, trendData.revenuePerDay, trendData.expensePerDay, trendData.profitPerDay)}
    <div class="rp-chart-legend">
      <span class="rp-legend-item"><span class="rp-legend-swatch" style="background:var(--rp-navy)"></span>Pendapatan</span>
      <span class="rp-legend-item"><span class="rp-legend-swatch" style="background:var(--rp-red)"></span>Pengeluaran</span>
      <span class="rp-legend-item"><span class="rp-legend-swatch" style="background:var(--rp-teal);border-radius:0;height:2px;align-self:center;"></span>Laba bersih</span>
    </div>
  </div>

  <div class="rp-ruled-head">Struktur profitabilitas — dari pendapatan ke laba bersih</div>
  <div class="rp-chart-box">
    ${totalRevenue > 0 ? svgWaterfallChart(totalRevenue, expenseCategories, netProfit) : emptyState('Belum ada pendapatan pada periode ini.')}
  </div>

  <div class="rp-ruled-head">Komposisi pengeluaran per kategori</div>
  <div class="rp-chart-box">
    ${expenseCategories.length ? svgExpenseDonutChart(expenseCategories, totalExpense) : emptyState('Belum ada pengeluaran pada periode ini.')}
  </div>

  <div class="rp-ruled-head">Pendapatan, pengeluaran &amp; laba — ${esc(currentMonthLabel)} vs ${esc(prevRange.label)}</div>
  <div class="rp-chart-box">
    ${svgMoMBarChart({totalRevenue,totalExpense,netProfit}, prevTotals, currentMonthLabel, prevRange.label)}
    <div class="rp-chart-legend">
      <span class="rp-legend-item"><span class="rp-legend-swatch" style="background:var(--rp-navy)"></span>${esc(currentMonthLabel)} (bulan ini)</span>
      <span class="rp-legend-item"><span class="rp-legend-swatch" style="background:var(--rp-ink-dim);opacity:.55"></span>${esc(prevRange.label)} (bulan lalu)</span>
    </div>
  </div>
  ${branchData.length > 1 ? `
  <div class="rp-ruled-head">Kontribusi laba per cabang</div>
  <div class="rp-chart-box">${svgBranchProfitBarChart(branchData)}</div>` : ''}
  `;

  const { insights: lrInsights, recs: lrRecs } = buildLabaRugiInsights({
    totalRevenue, totalExpense, netProfit, profitMarginPct,
    expenseCategories, prevTotals, prevRangeLabel: prevRange.label,
    trendData, branchData,
  });

  return `<div class="rp-stat-row">
    <div class="rp-stat-card"><span class="rp-stat-label">Total pendapatan</span><strong class="rp-mono rp-stat-value">${rupiah(totalRevenue)}</strong></div>
    <div class="rp-stat-card"><span class="rp-stat-label">Total pengeluaran</span><strong class="rp-mono rp-stat-value">${rupiah(totalExpense)}</strong></div>
    <div class="rp-stat-card"><span class="rp-stat-label">Laba / rugi bersih</span><strong class="rp-mono rp-stat-value" style="color:${netProfit>=0?'var(--rp-ink)':'var(--rp-red)'}">${rupiah(netProfit)}</strong></div>
    <div class="rp-stat-card"><span class="rp-stat-label">% Laba / rugi</span><strong class="rp-mono rp-stat-value" style="color:${netProfit>=0?'var(--rp-teal)':'var(--rp-red)'}">${netProfit>=0?'+':'-'}${Math.abs(profitMarginPct).toFixed(1)}%</strong></div>
  </div>
  ${chartsHtml}
  ${renderInsightSection(lrInsights, lrRecs)}
  <div class="rp-ruled-head">Detail pendapatan</div>
  <div class="rp-table-wrap"><table class="rp-table"><thead><tr><th class="rp-th-no">No</th><th>Tanggal</th>${showBranchCol?'<th>Cabang</th>':''}<th>Unit</th><th>Penyewa</th><th>Durasi</th><th>Pembayaran</th><th>Jumlah</th></tr></thead>
  <tbody>${sortedRevenueTx.map((t,i)=>`<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${fmtDateID(t.end)}</td>${showBranchCol?`<td>${esc(t.branchName||getBranchName(t.branchId))}</td>`:''}<td>${esc(t.unitName)}</td><td>${esc(t.customerName)}</td><td class="rp-mono">${(t.minutes/60).toFixed(1)} jam</td><td>${esc(t.payment||"-")}</td><td class="rp-mono">${rupiah(t.amount)}</td></tr>`).join("")||`<tr><td colspan="${revenueColCount}">${emptyState("Belum ada pendapatan pada periode ini.")}</td></tr>`}</tbody></table></div>
  <div class="rp-ruled-head">Pengeluaran</div>
  <div class="rp-head-tools" style="margin-bottom:12px"><button class="rp-btn rp-btn-start" onclick="openExpenseModal('')">${icon("plus",14)} Catat pengeluaran</button></div>
  <div class="rp-table-wrap"><table class="rp-table"><thead><tr><th class="rp-th-no">No</th><th>Tanggal</th>${showBranchCol?'<th>Cabang</th>':''}<th>Kategori</th><th>Deskripsi</th><th>Jumlah</th><th></th></tr></thead>
  <tbody>${periodExpenses.map((e,i)=>`<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${fmtDateID(e.date)}</td>${showBranchCol?`<td>${esc(e.branchName||getBranchName(e.branchId))}</td>`:''}<td>${esc(e.category)}</td><td>${esc(e.description||"-")}</td><td class="rp-mono">${rupiah(e.amount)}</td><td class="rp-td-actions"><div class="rp-row-actions">
    <button class="rp-icon-btn" onclick="openExpenseModal('${e.id}')" title="Ubah">${icon("pencil",15)}</button>
    <button class="rp-icon-btn rp-icon-danger" onclick="removeExpense('${e.id}')" title="Hapus">${icon("trash",15)}</button></div></td></tr>`).join("")||`<tr><td colspan="${expenseColCount}">${emptyState("Belum ada pengeluaran pada periode ini.")}</td></tr>`}</tbody></table></div>`;
}

            <button class="rp-btn rp-btn-ghost" onclick="exportLabaRugiCSV()">${icon('download',14)} Ekspor Excel</button>`
        })}
        <div class="rp-field-row" style="margin-bottom:18px;align-items:flex-end;">
          ${laporanBranchOptionsHtml()}
          <label class="rp-field" style="min-width:240px;">
            <span>Pilih bulan</span>
            <select onchange="setLaporanMonth(this.value)">${getLaporanMonthOptions()}</select>
          </label>
        </div>
        ${renderLabaRugiBody(period, false, start, end, periodTx, laporanBid)}
      </div>`;
  }

  const totalRevenue = periodTx.reduce((a,t) => a+t.amount, 0);
  const totalTx = periodTx.length;
  const avgPerTx = totalTx ? totalRevenue / totalTx : 0;
  const totalHours = periodTx.reduce((a,t) => a+t.minutes, 0) / 60;
  const showBranchCol = laporanBid === "ALL";
  const byUnitMap = {};
  periodTx.forEach(t => {
    const branchLbl = t.branchName || getBranchName(t.branchId);
    const key = showBranchCol ? `${branchLbl}||${t.unitName}` : t.unitName;
    if (!byUnitMap[key]) byUnitMap[key] = { unitName: t.unitName, branchName: branchLbl, count: 0, minutes: 0, total: 0 };
    byUnitMap[key].count += 1;
    byUnitMap[key].minutes += t.minutes;
    byUnitMap[key].total += t.amount;
  });
  const byUnit = Object.entries(byUnitMap).sort((a,b) => b[1].total - a[1].total);
  const byPaymentMap = {};
  periodTx.forEach(t => {
    const key = t.payment || '-';
    if (!byPaymentMap[key]) byPaymentMap[key] = { count: 0, total: 0 };
    byPaymentMap[key].count += 1;
    byPaymentMap[key].total += t.amount;
  });
  const byPayment = Object.entries(byPaymentMap).sort((a,b) => b[1].total - a[1].total);

  // --- Efektivitas Promo/Diskon ---
  const totalDiscount = periodTx.reduce((a,t) => a+(t.discount||0), 0);
  const grossRevenue = totalRevenue + totalDiscount;
  const discountPct = grossRevenue > 0 ? (totalDiscount / grossRevenue * 100) : 0;
  const promoTx = periodTx.filter(t => t.discount);
  const nonPromoTx = periodTx.filter(t => !t.discount);
  const promoTxCount = promoTx.length;
  const promoTxPct = totalTx ? (promoTxCount / totalTx * 100) : 0;
  const avgDiscountPerPromoTx = promoTxCount ? totalDiscount / promoTxCount : 0;
  const byPromoMap = {};
  promoTx.forEach(t => {
    const key = t.promoName || '(Tanpa nama promo)';
    if (!byPromoMap[key]) byPromoMap[key] = { count: 0, total: 0 };
    byPromoMap[key].count += 1;
    byPromoMap[key].total += (t.discount || 0);
  });
  const byPromo = Object.entries(byPromoMap).sort((a,b) => b[1].total - a[1].total);
  const avgSubtotalPromo = promoTxCount ? promoTx.reduce((a,t) => a+receiptSubtotal(t), 0) / promoTxCount : 0;
  const avgSubtotalNonPromo = nonPromoTx.length ? nonPromoTx.reduce((a,t) => a+receiptSubtotal(t), 0) / nonPromoTx.length : 0;
  const subtotalDiffPct = avgSubtotalNonPromo > 0 ? ((avgSubtotalPromo - avgSubtotalNonPromo) / avgSubtotalNonPromo * 100) : 0;

  const trend = buildLaporanTrend(period, start, laporanBid);
  const prevMonthLabel = new Date(trend.prevYear, trend.prevMonth, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  const chartTitle = `Tren pendapatan harian — ${selected.label.replace('Bulan terpilih (','').replace(')','')}`;
  const series = [
    { label: selected.label.replace('Bulan terpilih (','').replace(')',''), values: trend.current, color: 'var(--rp-navy)', filled: true },
    { label: `${prevMonthLabel} (bulan lalu)`, values: trend.previous, color: 'var(--rp-ink-dim)', dashed: true }
  ];
  const prevMonthTotal = trend.previous.reduce((a,b) => a+b, 0);
  const revenueDiff = totalRevenue - prevMonthTotal;
  const revenueDiffPct = prevMonthTotal > 0 ? (revenueDiff / prevMonthTotal * 100) : (totalRevenue > 0 ? 100 : 0);
  const revenueDeltaHtml = (prevMonthTotal > 0 || totalRevenue > 0)
    ? `<span class="rp-mono" style="display:block;margin-top:5px;font-size:10.5px;font-weight:600;color:${revenueDiff>=0?'var(--rp-navy)':'var(--rp-red)'};">${revenueDiff>=0?'▲':'▼'} ${Math.abs(revenueDiffPct).toFixed(1)}% vs ${esc(prevMonthLabel)}</span>`
    : '';

  window._laporanExportTx = periodTx;
  window._laporanExportPeriod = selected.value;
  window._laporanExportLabel = selected.label;

  const { insights: laporanInsights, recs: laporanRecs } = buildLaporanInsights({
    totalRevenue, totalTx, avgPerTx, byUnit, byPayment,
    totalDiscount, discountPct, nonPromoTx, subtotalDiffPct,
    revenueDiff, revenueDiffPct, prevMonthTotal, prevMonthLabel,
  });

  return `
    <div class="rp-page">
      ${pageHeaderBanner({
        key: "laporan",
        title: "Laporan",
        subtitle: `Ringkasan pendapatan bulan terpilih · ${esc(laporanBranchLabel())}`,
        tools: `<button class="rp-btn rp-btn-start" onclick="openLabaRugiProtected()">Klik Untuk Update Laba-Rugi</button>`
      })}

      <div class="rp-field-row" style="margin-bottom:18px;align-items:flex-end;">
        ${laporanBranchOptionsHtml()}
        <label class="rp-field" style="min-width:260px;">
          <span>Pilih bulan</span>
          <select onchange="setLaporanMonth(this.value)">${getLaporanMonthOptions()}</select>
        </label>
        <button class="rp-btn rp-btn-ghost" onclick="exportLaporanCSV()" ${!periodTx.length?'disabled':''}>${icon('download',14)} Ekspor Excel</button>
      </div>

      <div class="rp-stat-row">
        <div class="rp-stat-card rp-clickable" onclick="openLaporanDetailModal('revenue')">
          <span class="rp-stat-label">Total pendapatan</span>
          <strong class="rp-mono rp-stat-value">${rupiah(totalRevenue)}</strong>
          ${revenueDeltaHtml}
        </div>
        <div class="rp-stat-card rp-clickable" onclick="openLaporanDetailModal('count')"><span class="rp-stat-label">Jumlah sewa</span><strong class="rp-mono rp-stat-value">${totalTx}</strong></div>
        <div class="rp-stat-card rp-clickable" onclick="openLaporanDetailModal('avg')"><span class="rp-stat-label">Rata-rata per sewa</span><strong class="rp-mono rp-stat-value">${rupiah(avgPerTx)}</strong></div>
        <div class="rp-stat-card rp-clickable" onclick="openLaporanDetailModal('duration')"><span class="rp-stat-label">Total durasi disewa</span><strong class="rp-mono rp-stat-value">${totalHours.toFixed(1)} jam</strong></div>
      </div>

      <div class="rp-ruled-head">${chartTitle} <span class="rp-dim" style="text-transform:none;letter-spacing:normal;">— arahkan kursor / ketuk tanggal untuk ringkasan, dibandingkan otomatis dengan bulan lalu</span></div>
      <div class="rp-chart-box">
        ${svgTrendChart(trend.labels, series, period, start.getTime())}
        <div class="rp-chart-legend">
          ${series.map(s => `<span class="rp-legend-item"><span class="rp-legend-swatch" style="background:${s.color};${s.dashed?'border-radius:0;height:2px;align-self:center;':''}"></span>${esc(s.label)}</span>`).join('')}
        </div>
      </div>

      <div class="rp-ruled-head">Rincian per unit</div>
      ${byUnit.length===0 ? emptyState('Belum ada data pendapatan pada bulan terpilih.') : `
        <div class="rp-table-wrap"><table class="rp-table">
          <thead><tr><th class="rp-th-no">No</th>${showBranchCol?'<th>Cabang</th>':''}<th>Unit</th><th>Jumlah sewa</th><th>Total durasi</th><th>Total pendapatan</th><th>Rata-rata/sewa</th></tr></thead>
          <tbody>${byUnit.map(([,d], i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td>${showBranchCol?`<td>${esc(d.branchName)}</td>`:''}<td>${esc(d.unitName)}</td><td class="rp-mono">${d.count}</td><td class="rp-mono">${(d.minutes/60).toFixed(1)} jam</td><td class="rp-mono">${rupiah(d.total)}</td><td class="rp-mono">${rupiah(d.total/d.count)}</td></tr>`).join('')}</tbody>
        </table></div>`}

      <div class="rp-ruled-head">Metode pembayaran</div>
      ${byPayment.length===0 ? emptyState('Belum ada data pembayaran pada bulan terpilih.') : `
        <div class="rp-table-wrap"><table class="rp-table">
          <thead><tr><th class="rp-th-no">No</th><th>Metode</th><th>Jumlah transaksi</th><th>Total nominal</th></tr></thead>
          <tbody>${byPayment.map(([name,d], i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${esc(name)}</td><td class="rp-mono">${d.count}</td><td class="rp-mono">${rupiah(d.total)}</td></tr>`).join('')}</tbody>
        </table></div>`}

      <div class="rp-ruled-head">Efektivitas promo/diskon <span class="rp-dim" style="text-transform:none;letter-spacing:normal;">— seberapa sering & seberapa besar diskon dikasih ke pelanggan</span></div>
      ${totalDiscount === 0 ? emptyState('Belum ada diskon/promo dipakai pada bulan terpilih.') : `
        <div class="rp-stat-row">
          <div class="rp-stat-card"><span class="rp-stat-label">Total diskon diberikan</span><strong class="rp-mono rp-stat-value" style="color:var(--rp-red);">${rupiah(totalDiscount)}</strong></div>
          <div class="rp-stat-card"><span class="rp-stat-label">% dari pendapatan kotor</span><strong class="rp-mono rp-stat-value">${discountPct.toFixed(1)}%</strong></div>
          <div class="rp-stat-card"><span class="rp-stat-label">Transaksi pakai promo</span><strong class="rp-mono rp-stat-value">${promoTxCount} dari ${totalTx}</strong><span class="rp-dim" style="display:block;margin-top:5px;font-size:10.5px;">${promoTxPct.toFixed(1)}% dari total transaksi</span></div>
          <div class="rp-stat-card"><span class="rp-stat-label">Rata-rata diskon/transaksi</span><strong class="rp-mono rp-stat-value">${rupiah(avgDiscountPerPromoTx)}</strong></div>
        </div>

        <div class="rp-ruled-head" style="margin-top:22px;">Rincian per promo</div>
        <div class="rp-table-wrap"><table class="rp-table">
          <thead><tr><th class="rp-th-no">No</th><th>Nama promo</th><th>Dipakai</th><th>Total diskon</th><th>Rata-rata diskon</th></tr></thead>
          <tbody>${byPromo.map(([name,d], i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${esc(name)}</td><td class="rp-mono">${d.count}x</td><td class="rp-mono">${rupiah(d.total)}</td><td class="rp-mono">${rupiah(d.total/d.count)}</td></tr>`).join('')}</tbody>
        </table></div>

        <div class="rp-ruled-head" style="margin-top:22px;">Perbandingan nilai transaksi <span class="rp-dim" style="text-transform:none;letter-spacing:normal;">— pakai promo vs tidak, sebelum dipotong diskon</span></div>
        <div class="rp-stat-row">
          <div class="rp-stat-card"><span class="rp-stat-label">Rata-rata transaksi pakai promo</span><strong class="rp-mono rp-stat-value">${rupiah(avgSubtotalPromo)}</strong></div>
          <div class="rp-stat-card"><span class="rp-stat-label">Rata-rata transaksi tanpa promo</span><strong class="rp-mono rp-stat-value">${rupiah(avgSubtotalNonPromo)}</strong></div>
          <div class="rp-stat-card">
            <span class="rp-stat-label">Selisih</span>
            <strong class="rp-mono rp-stat-value" style="color:${subtotalDiffPct>=0?'var(--rp-navy)':'var(--rp-red)'};">${subtotalDiffPct>=0?'▲':'▼'} ${Math.abs(subtotalDiffPct).toFixed(1)}%</strong>
            <span class="rp-dim" style="display:block;margin-top:5px;font-size:10.5px;">${nonPromoTx.length===0 ? 'belum ada transaksi tanpa promo untuk dibandingkan' : (subtotalDiffPct>=0 ? 'promo dipakai di transaksi bernilai lebih besar — indikasi promo mendorong belanja lebih' : 'transaksi pakai promo justru lebih kecil — diskon lebih ke motong margin')}</span>
          </div>
        </div>`}

      ${renderInsightSection(laporanInsights, laporanRecs)}
    </div>`;
}

function exportLabaRugiCSV() {
  const data = window._labaRugiExport;
  if (!data || (!data.periodTx.length && !data.periodExpenses.length)) { flash("Tidak ada data untuk diekspor."); return; }
  const rows = [
    ...data.periodTx.map(t => ({ Tanggal: fmtDateID(t.end), Jenis: "Pendapatan", Cabang: t.branchName || getBranchName(t.branchId), Kategori: "Sewa " + t.unitName, Deskripsi: t.customerName, "Subtotal (Rp)": receiptSubtotal(t), Promo: t.promoName || "", "Diskon (Rp)": t.discount || 0, "Jumlah (Rp)": t.amount })),
    ...data.periodExpenses.map(e => ({ Tanggal: fmtDateID(e.date), Jenis: "Pengeluaran", Cabang: e.branchName || getBranchName(e.branchId), Kategori: e.category, Deskripsi: e.description || "-", "Jumlah (Rp)": -e.amount })),
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "TOTAL PENDAPATAN", "Jumlah (Rp)": data.totalRevenue },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "TOTAL PENGELUARAN", "Jumlah (Rp)": -data.totalExpense },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "LABA/RUGI BERSIH", "Jumlah (Rp)": data.netProfit },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: `% LABA/RUGI: ${data.netProfit>=0?'+':'-'}${Math.abs(data.profitMarginPct||0).toFixed(1)}%`, "Jumlah (Rp)": "" },
  ];

}
function exportLaporanCSV() {
  const tx = window._laporanExportTx || [];
