function getPromos(){return Array.isArray(state.settings.promos)?state.settings.promos:[];}
function getPromosForBranch(branchId){return getPromos().filter(p=>p.branchId===branchId);}
function getPromo(id){return getPromos().find(p=>p.id===id);}
function formatPromoValue(p){return p.type==="percent"?`${p.value}%`:rupiah(p.value);}

function getVisibleTransactions(){const bid=ensureSelectedBranch();return state.transactions.filter(t=>{if(t.branchId)return t.branchId===bid;const u=state.units.find(x=>x.id===t.unitId);return u?(u.branchId||getBranches()[0].id)===bid:false;});}

function flash(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(flash._timer);
  flash._timer = setTimeout(() => { t.style.display = "none"; }, 2400);

// Simpan data mentah terakhir per "sheet" di sini. Tiap dokumen Firestore
// punya listener sendiri (onSnapshot) — begitu salah satu berubah (dari
// device manapun), kita rakit ulang jadi satu `raw` lengkap lalu normalize().
const rawCache = { Settings: [], Units: [], ActiveRentals: [], Transactions: [], Members: [], Inventory: [], Queue: [], Expenses: [] };
const loadedSheets = new Set();

function applyRawCache() {
  const incoming = normalize(rawCache);
  state.settings = incoming.settings;
  // PENTING: sheet-sheet lain (Units, Transactions, dst) bisa saja datang
  // dari Firestore SEBELUM sheet "Settings" (yang berisi daftar akun kasir)
  // selesai dimuat — urutan onSnapshot tidak dijamin sesuai array SHEETS.
  // Kalau validasi akun kasir dijalankan sebelum Settings benar-benar
  // termuat, daftar kasirnya masih kosong/default sehingga akun yang
  // sebenarnya valid bisa salah dianggap "sudah tidak berlaku" dan
  // ke-logout paksa di tengah proses loading (kelihatan seperti macet/
  // muter terus). Makanya cek ini ditunda sampai Settings sudah pasti masuk.
  if (currentUser && currentUser.role === "kasir" && loadedSheets.has("Settings")) {
    const stillValid = cashiersWithFallback(incoming.settings.branches, incoming.settings.cashiers)
      .some(c => String(c.username||"").trim().toLowerCase() === currentUser.username && c.branchId === currentUser.branchId);
    if (!stillValid) { logoutApp(); flash("Akun kasir ini sudah tidak berlaku, hubungi admin."); return; }
  }
  ensureSelectedBranch();
  state.units = incoming.units;
  state.activeRentals = incoming.activeRentals;
  state.transactions = incoming.transactions;
  state.members = incoming.members;
  state.inventory = incoming.inventory;
  state.queue = incoming.queue;
  state.expenses = incoming.expenses;
}

function updateLoadingProgress() {
  const fill = document.getElementById("loading-bar-fill");
  const count = document.getElementById("loading-count");
  if (!fill || !count) return; // loading screen sudah tergantikan oleh app
  const pct = Math.round((loadedSheets.size / SHEETS.length) * 100);
  fill.style.width = pct + "%";
  count.textContent = loadedSheets.size + "/" + SHEETS.length + " data dimuat";
}

function initFirestoreListeners() {
  SHEETS.forEach((sheet) => {
    docRef(sheet).onSnapshot(
      (snap) => {
        rawCache[sheet] = (snap.exists && snap.data().rows) || [];
        loadedSheets.add(sheet);
        applyRawCache();
        updateLoadingProgress();
        if (loadedSheets.size >= SHEETS.length) ready = true;
        if (ready) renderAll();
      },
      (e) => {
        console.error(e);
        loadedSheets.add(sheet);
        updateLoadingProgress();
        if (loadedSheets.size >= SHEETS.length) ready = true;
        setSync("error");
        flash("Gagal memuat data — cek koneksi internet.");
        if (ready) renderAll();
      }
    );
  });
}

// Dengan onSnapshot, data sudah selalu real-time. Tombol "Segarkan data"
// tetap ada untuk memaksa cek ulang ke server (berguna kalau kasir ragu).
async function refreshData() {
  if (isLoading) return; // hindari request numpuk kalau sinyal lambat
  isLoading = true;
  setSync("busy");
  try {
    await Promise.all(SHEETS.map((s) => docRef(s).get({ source: "server" })));
    setSync("idle");
    flash("Data sudah yang terbaru.");
  } catch (e) {
    setSync("error");
    flash("Sinyal lemah — gagal menyegarkan data, dicoba lagi otomatis.");
  } finally {
    isLoading = false;
  }
}

function startRental(unitId, customerName, memberId, note, plannedMinutes) {
  const startTime = Date.now();
  const endTime = plannedMinutes ? startTime + plannedMinutes * 60000 : null;
  state.activeRentals[unitId] = { startTime, customerName: customerName || "Tamu", memberId: memberId || null, note: note || "", endTime };
  window._alertedUnits.delete(unitId);
  const unit = state.units.find(u => u.id === unitId);
  if (unit) unit.status = "active";
  closeModal();
  // Selalu arahkan ke Dashboard begitu sewa dimulai — ini "rumah"-nya unit
  // yang lagi jalan (timer, tombol Selesai & Bayar, dll), baik dipicu dari
  // menu akses cepat (rel kiri/fan avatar) maupun langsung dari kartu unit.
  currentTab = "dashboard";
  renderAll();
  persistActive(); persistUnits();
  flash(`${unit ? unit.name : "Unit"} mulai disewa${endTime ? ` — durasi ${plannedMinutes} menit` : ""}`);
}

// deltaMinutes boleh positif (tambah) atau negatif (kurangi). Untuk nambah
// waktu pada sewa yang sudah lewat jadwal, basisnya dihitung dari waktu
// SEKARANG (bukan endTime lama yang sudah lewat) biar hasilnya tetap masuk
// akal ke depan. Untuk mengurangi, basisnya tetap endTime yang ada sekarang
// (baik masih di depan atau sudah lewat) supaya pengurangannya pas sesuai
// yang diketik kasir. Endtime baru tidak pernah dibiarkan mundur ke
// sebelum waktu mulai sewa (minimal durasi 1 menit).
function extendRental(unitId, deltaMinutes) {
  const session = state.activeRentals[unitId];
  if (!session || !deltaMinutes) return;
  const base = deltaMinutes > 0
    ? (session.endTime && session.endTime > Date.now() ? session.endTime : Date.now())
    : (session.endTime || Date.now());
  let newEnd = base + deltaMinutes * 60000;
  if (newEnd < session.startTime + 60000) newEnd = session.startTime + 60000;
  session.endTime = newEnd;
  window._alertedUnits.delete(unitId);
  window._expiredUnits.delete(unitId);
  closeModal();
  renderAll();
  persistActive();
  flash(deltaMinutes > 0 ? "Waktu sewa ditambah." : "Waktu sewa dikurangi.");
}

function finishRental(unitId, payment, discount, frozenMs, promoName, isFixed, cashReceived, change) {
  const session = state.activeRentals[unitId];
  const unit = state.units.find(u => u.id === unitId);
  if (!session || !unit) return;
  const ms = frozenMs != null ? frozenMs : Date.now() - session.startTime;
  const minutes = Math.max(1, Math.round(ms / 60000));
  const rawAmount = (minutes / 60) * unit.rate;
  const subtotal = Math.round(rawAmount);
  const appliedDiscount = Math.max(0, Math.min(subtotal, Math.round(discount || 0)));
  const amount = Math.max(0, Math.round(rawAmount - (discount || 0)));
  const now = Date.now();
  // Jam selesai yang DITAMPILKAN di struk: untuk sewa paket durasi tetap
  // (isFixed), pakai jam seharusnya selesai sesuai paket (start + durasi
  // paket) — BUKAN jam nyata ditutup — walaupun kasir menutupnya lebih awal
  // dari jadwal. Untuk sewa non-paket (argo jalan), pakai jam nyata sekarang.
  const endTimeDisplay = isFixed ? (session.startTime + ms) : now;

  const trx = {
    id: uid(), unitId: unit.id, unitName: unit.name,
    branchId: unit.branchId || ensureSelectedBranch(),
    branchName: unit.branchName || getBranchName(unit.branchId || ensureSelectedBranch()),
    customerName: session.customerName,
    // PENTING: `end` HARUS waktu beneran sekarang (Date.now()), bukan
    // session.startTime + ms. Untuk sewa paket durasi tetap (isFixed), `ms`
    // yang dikirim ke sini adalah DURASI PENUH PAKET (buat ngunci harganya,
    // itu sengaja) — bukan durasi aktual yang udah lewat. Kalau paket itu
    // diselesaikan lebih cepat dari jadwalnya, session.startTime + ms bakal
    // jatuh ke MASA DEPAN (tanggal paket seharusnya kelar), padahal
    // transaksinya beneran dicatat & dibayar hari ini. Ini yang bikin
    // transaksi "nyasar" ke tanggal yang salah di laporan/dashboard.
    // `endTimeDisplay` dipakai KHUSUS buat baris "Jam selesai" di struk
    // (lihat catatan di atas soal endTimeDisplay).
    memberId: session.memberId || "", start: session.startTime, end: now, endTimeDisplay,
    // subtotal/discount/promoName dicatat supaya rincian diskon ikut tampil
    // di struk (modal, WA, PDF, & cetak) — bukan cuma nilai akhir (amount).
    minutes, subtotal, discount: appliedDiscount, promoName: promoName || "",
    amount, payment, note: session.note,
    // Cuma keisi kalau metode bayarnya Tunai — dipakai buat nampilin baris
    // "Uang tunai" & "Kembalian" di struk (modal, WA, PDF, & cetak).
    cashReceived: payment === "Tunai" ? cashReceived : null,
    change: payment === "Tunai" ? change : null,
    // Snapshot no. rekening/QRIS usaha PADA SAAT transaksi dicatat — supaya
    // kalau data usaha diganti belakangan, struk transaksi lama tetap
    // menampilkan rekening/QRIS yang beneran dipakai waktu itu.
    bankAccount: payment === "Transfer" ? (state.settings.bankAccount || "") : "",
    qrisImage: payment === "QRIS" ? (state.settings.qrisImage || "") : "",
  };
  state.transactions.unshift(trx);
  delete state.activeRentals[unitId];
  window._alertedUnits.delete(unitId);
  unit.status = "available";

  if (session.memberId) {
    const m = state.members.find(x => x.id === session.memberId);
    if (m) { m.visits = (m.visits || 0) + 1; m.totalSpent = (m.totalSpent || 0) + amount; }
  }

  renderAll();
  persistTransactions(); persistActive(); persistUnits();
  if (session.memberId) persistMembers();
  flash(`Sewa ${unit.name} selesai — ${rupiah(amount)}`);
  maybeNotifyQueueForUnit(unitId, unit.name);
  openReceiptModal(trx);
}

// Susun pesan struk yang dikirim via WA: nadanya rendah hati/humble buat
// ucapan terima kasih, ditutup dengan up-selling halus (ajakan booking lagi/
// promo) — tujuannya relationship selling, bukan struk kaku doang.
function buildReceiptWaMessage(trx) {
  const bizName = state.settings.businessName || "Kami";
  const firstName = String(trx.customerName || "Kak").trim().split(/\s+/)[0] || "Kak";
  const upsellLines = [
    `Kalau mau main lagi lain waktu, kabari saja kami ya — kami bantu bookingkan unit favoritmu supaya nggak perlu antre 🎮`,
    `Ajak teman atau saudara sekalian main bareng, makin rame makin seru! 😊`,
  ];
  const upsell = upsellLines[Math.floor(Math.random() * upsellLines.length)];
  return [
    `Halo Kak ${firstName} 🙏`,
    ``,
    `Terima kasih banyak sudah main di *${bizName}*. Berikut struk pembayarannya ya:`,
    ``,
    `🏬 ${bizName}${trx.branchName ? ` — ${trx.branchName}` : ""}`,
    `📅 ${fmtDateID(trx.end)}, ${fmtTimeID(trx.end)}`,
    `🎮 Unit: ${trx.unitName}`,
    `🕐 Jam mulai: ${fmtTimeID(trx.start)}`,
    `🕑 Jam selesai: ${fmtTimeID(trx.endTimeDisplay != null ? trx.endTimeDisplay : trx.end)}`,
    `⏱️ Durasi: ${fmtHMS(trx.minutes * 60000)}`,
    `💳 Metode bayar: ${trx.payment}`,
    ...(trx.payment === "Transfer" && trx.bankAccount ? [`🏦 No. rekening: ${trx.bankAccount}`] : []),
    ...(trx.discount ? [
      `🧾 Subtotal: ${rupiah(receiptSubtotal(trx))}`,
      `🏷️ Diskon${trx.promoName ? ` (${trx.promoName})` : ""}: -${rupiah(trx.discount)}`,
    ] : []),
    `💰 Total: ${rupiah(trx.amount)}`,
    ...(trx.payment === "Tunai" && trx.cashReceived != null ? [
      `💵 Uang tunai: ${rupiah(trx.cashReceived)}`,
      `🔁 Kembalian: ${rupiah(trx.change)}`,
    ] : []),
    ``,
    `Mohon maaf kalau ada kekurangan pelayanan dari kami hari ini 🙏 Masukan dari Kakak selalu kami tunggu supaya bisa lebih baik lagi ke depannya.`,
    ``,
    upsell,
    ``,

// ---- PDF struk (buat dilampirkan manual pas kirim WA) ----
// wa.me cuma bisa buka chat dengan teks siap kirim — nggak ada cara resmi
// nempelin file lewat link itu (keterbatasan WhatsApp, bukan kode kita).
// Jadi alurnya: struk di-generate jadi PDF lalu diunduh otomatis, kasir
// tinggal attach manual filenya di jendela chat yang kebuka.
//
// Halaman PDF-nya sengaja DIUKUR DULU (render ke dokumen sementara) baru
// dokumen final dibuat dengan tinggi persis sepanjang isi struk + sedikit
// margin — supaya hasilnya di-crop pas ke struknya aja, nggak ada sisa
// area kosong panjang kayak kalau dipaksa ke ukuran kertas A4.
// Baris dipisah jadi dua: `rows` (tampil SEBELUM baris TOTAL — termasu
// subtotal & diskon, biar diskon nempel deket total) dan `afterTotalRows`
// (tampil SESUDAH TOTAL — uang tunai & kembalian, karena itu bagian
// pembayaran/kembalian, bukan rincian tagihan).
function receiptPdfRows(trx) {
  const rows = [
    ["Tanggal", `${fmtDateID(trx.end)}, ${fmtTimeID(trx.end)}`],
    ["Penyewa", trx.customerName],
    ["Unit", trx.unitName],
    ["Jam mulai", fmtTimeID(trx.start)],
    ["Jam selesai", fmtTimeID(trx.endTimeDisplay != null ? trx.endTimeDisplay : trx.end)],
    ["Durasi", fmtHMS(trx.minutes * 60000)],
    ["Metode bayar", trx.payment],
  ];
  if (trx.payment === "Transfer" && trx.bankAccount) rows.push(["No. rekening", trx.bankAccount]);
  if (trx.note) rows.push(["Catatan", trx.note]);
  if (trx.discount) {
    rows.push(["Subtotal", rupiah(receiptSubtotal(trx))]);
    rows.push([trx.promoName ? `Diskon (${trx.promoName})` : "Diskon", `- ${rupiah(trx.discount)}`]);
  }
  const afterTotalRows = [];
  if (trx.payment === "Tunai" && trx.cashReceived != null) {
    afterTotalRows.push(["Uang tunai", rupiah(trx.cashReceived)]);
    afterTotalRows.push(["Kembalian", rupiah(trx.change)]);
  }
  return { rows, afterTotalRows };
}
function drawReceiptPdfRows(doc, rows, contentW, marginX, y) {
  doc.setFontSize(9.5);
  rows.forEach(([label, value]) => {
    doc.setFont("courier", "normal");
    const labelLines = doc.splitTextToSize(String(label), contentW * 0.42);
    const valueLines = doc.splitTextToSize(String(value), contentW * 0.56);
    doc.text(labelLines, marginX, y);
    doc.text(valueLines, marginX + contentW, y, { align: "right" });
    y += 5 * Math.max(labelLines.length, valueLines.length);
  });
  return y;
}
function drawReceiptPdfContent(doc, trx, rowsData, contentW, marginX) {
  const centerX = marginX + contentW / 2;
  let y = 10;

  doc.setFont("courier", "bold");
  doc.setFontSize(13);
  doc.text(String(state.settings.businessName || ""), centerX, y, { align: "center" });
  y += 6;

  if (trx.branchName) {
    doc.setFont("courier", "normal");
    doc.setFontSize(9.5);
    doc.text(String(trx.branchName), centerX, y, { align: "center" });
    y += 5.5;
  }
  y += 1.5;
  doc.setLineDashPattern([1, 1], 0);
  doc.line(marginX, y, marginX + contentW, y);
  doc.setLineDashPattern([], 0);
  y += 6;

  y = drawReceiptPdfRows(doc, rowsData.rows, contentW, marginX, y);

  y += 1.5;
  doc.setLineDashPattern([1, 1], 0);
  doc.line(marginX, y, marginX + contentW, y);
  doc.setLineDashPattern([], 0);
  y += 7;

  doc.setFont("courier", "bold");
  doc.setFontSize(12.5);
  doc.text("TOTAL", marginX, y);
  doc.text(rupiah(trx.amount), marginX + contentW, y, { align: "right" });
  y += 9;

  // Uang tunai & kembalian ditaruh SETELAH baris TOTAL (bagian pembayaran),
  // bukan sebelum — biar urutannya: rincian tagihan -> total -> dibayar
  // pakai berapa -> kembaliannya berapa. Persis alur struk kasir beneran.
  if (rowsData.afterTotalRows.length) {
    y = drawReceiptPdfRows(doc, rowsData.afterTotalRows, contentW, marginX, y);
    y += 3;
  }

  doc.setFont("courier", "normal");
  doc.setFontSize(9);
  doc.text("Terima kasih!", centerX, y, { align: "center" });
  y += 6;

  return y;
}
function buildReceiptPdf(trx) {
  const jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFCtor) { flash("Pustaka PDF belum siap termuat, coba lagi sebentar."); return null; }
  const rows = receiptPdfRows(trx);
  const pageW = 80, marginX = 6, contentW = pageW - marginX * 2;

  // Render "kosong-kosongan" ke halaman sementara cuma buat tahu tinggi
  // kontennya bakal berapa mm.
  const measureDoc = new jsPDFCtor({ unit: "mm", format: [pageW, 400] });
  const measuredY = drawReceiptPdfContent(measureDoc, trx, rows, contentW, marginX);

  // Halaman final tingginya pas ngikutin konten (+ margin bawah kecil).
  const doc = new jsPDFCtor({ unit: "mm", format: [pageW, measuredY + 4] });
  drawReceiptPdfContent(doc, trx, rows, contentW, marginX);
  return doc;
}
function receiptPdfFilename(trx) {
  const datePart = new Date(trx.end).toISOString().slice(0, 10);
  const safeName = String(trx.customerName || "struk").trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "") || "struk";
  return `Struk-${safeName}-${datePart}.pdf`;
}
function downloadReceiptPdf(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;
  const doc = buildReceiptPdf(trx);
  if (!doc) return;
  doc.save(receiptPdfFilename(trx));
}
function sendReceiptWhatsApp(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;

  const phone = (phoneInput?.value || "").trim();
  if (!phone) { flash("Isi dulu No. HP WhatsApp pelanggan untuk kirim struk."); return; }
  const doc = buildReceiptPdf(trx);
  if (doc) {
    doc.save(receiptPdfFilename(trx));
    flash("Struk PDF diunduh — lampirkan manual di chat WhatsApp yang kebuka ya.");
  }
  openWhatsApp(phone, buildReceiptWaMessage(trx));
}
// Cetak dibikin lewat window terpisah (bukan window.print() langsung di
// halaman utama) supaya hasil print cuma struknya doang — gak ikut kebawa
// sidebar/menu, dan lebarnya dibikin mirip kertas thermal printer (58/80mm).
function printReceipt(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;
  const w = window.open("", "_blank", "width=380,height=600");
  if (!w) { flash("Popup diblokir browser — izinkan popup buat cetak struk."); return; }
  const rows = receiptPdfRows(trx);
  const qrisBlock = (trx.payment === "QRIS" && trx.qrisImage)
    ? `<div style="text-align:center;margin:10px 0;"><img src="${esc(trx.qrisImage)}" style="width:150px;max-width:70%;" /></div>`
    : "";
  w.document.write(`<!DOCTYPE html><html><head><title>Struk - ${esc(trx.unitName)}</title><style>
    @page{ margin: 8mm; }
    body{ font-family:'Courier New',monospace; font-size:12px; width:280px; margin:0 auto; padding:12px; color:#000; }
    h1{ font-size:14px; text-align:center; margin:0 0 2px; }
    .sub{ text-align:center; font-size:11px; margin-bottom:10px; }
    .row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:3px 0; }
    .row span:first-child{ min-width:0; overflow-wrap:break-word; }
    .row span:last-child{ flex-shrink:0; text-align:right; white-space:nowrap; }
    .line{ border-top:1px dashed #000; margin:8px 0; }
    .total{ font-size:14px; font-weight:bold; }
    .foot{ text-align:center; margin-top:14px; font-size:11px; }
  </style></head><body>
    <h1>${esc(state.settings.businessName)}</h1>
    <div class="sub">${esc(trx.branchName || "")}</div>
    <div class="line"></div>
    ${rows.rows.map(([l, v]) => `<div class="row"><span>${esc(l)}</span><span>${esc(v)}</span></div>`).join("")}
    ${qrisBlock}
    <div class="line"></div>
    <div class="row total"><span>TOTAL</span><span>${rupiah(trx.amount)}</span></div>
    ${rows.afterTotalRows.length ? rows.afterTotalRows.map(([l, v]) => `<div class="row"><span>${esc(l)}</span><span>${esc(v)}</span></div>`).join("") : ""}
    <div class="foot">Terima kasih!</div>
  </body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
}
function saveNewCustomerFromReceipt(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;
  const phoneInput = document.getElementById("receipt-guest-phone");
  const phone = (phoneInput?.value || "").trim();
  if (!phone) { flash("No. HP wajib diisi buat simpan pelanggan."); return; }
  const id = uid();
  state.members.push({ id, name: trx.customerName, phone, visits: 1, totalSpent: trx.amount, joined: Date.now() });
  trx.memberId = id;
  persistMembers(); persistTransactions();
  renderAll();
  const box = document.getElementById("receipt-save-customer");
  if (box) box.innerHTML = `<p class="rp-dim" style="margin-top:12px;">${icon("info",13)} Tersimpan sebagai pelanggan baru.</p>`;
  flash("Pelanggan baru disimpan.");
}

function upsertUnit(unit) {
  const idx = state.units.findIndex(u => u.id === unit.id);
  if (idx >= 0) state.units[idx] = unit; else state.units.push(unit);
  closeModal(); renderAll(); persistUnits();
}
function removeUnit(id) {
  if (state.activeRentals[id]) return;
  const u = state.units.find(x => x.id === id);
  openConfirmModal({
    title: "Hapus unit?",
    message: `Unit "${u ? u.name : "ini"}" akan dihapus permanen dari daftar. Tindakan ini tidak bisa dibatalkan.`,
    confirmLabel: "Ya, hapus unit",
    onConfirm: () => removeUnitDirect(id),
  });
}
function removeUnitDirect(id) {
  if (state.activeRentals[id]) return;
  state.units = state.units.filter(u => u.id !== id);
  window._alertedUnits.delete(id);
  renderAll(); persistUnits();
}
function toggleMaint(id) {
  const u = state.units.find(x => x.id === id);
  if (!u || u.status === "active") return;
  u.status = u.status === "maintenance" ? "available" : "maintenance";
  renderAll(); persistUnits();
}

function upsertMember(m) {
  const idx = state.members.findIndex(x => x.id === m.id);
  if (idx >= 0) state.members[idx] = { ...state.members[idx], ...m };
  else state.members.push({ ...m, visits: 0, totalSpent: 0, joined: Date.now() });
  closeModal();
  // Arahkan ke halaman Pelanggan — baik ini ditambahkan lewat menu akses
  // cepat dari tab manapun, atau diubah langsung dari tabel di halaman ini.
  currentTab = "member";
  renderAll(); persistMembers();
}
function removeMember(id) {
  const m = state.members.find(x => x.id === id);
  openConfirmModal({
    title: "Hapus pelanggan?",
    message: `Data pelanggan "${m ? m.name : "ini"}" (riwayat kunjungan & total belanjanya) akan dihapus permanen.`,
    confirmLabel: "Ya, hapus pelanggan",
    onConfirm: () => removeMemberDirect(id),
  });
}
function removeMemberDirect(id) { state.members = state.members.filter(m => m.id !== id); renderAll(); persistMembers(); }

function upsertInventory(item) {
  const idx = state.inventory.findIndex(x => x.id === item.id);
  if (idx >= 0) state.inventory[idx] = item; else state.inventory.push(item);
  closeModal(); renderAll(); persistInventory();
}
function removeInventory(id) {
  const it = state.inventory.find(x => x.id === id);
  openConfirmModal({
    title: "Hapus item stok?",
    message: `Item "${it ? it.name : "ini"}" akan dihapus permanen dari daftar stok & servis.`,
    confirmLabel: "Ya, hapus item",
    onConfirm: () => removeInventoryDirect(id),
  });
}
function removeInventoryDirect(id) { state.inventory = state.inventory.filter(i => i.id !== id); renderAll(); persistInventory(); }

/* --------------------- Pengeluaran (untuk Laba Rugi) --------------------- */
const EXPENSE_CATEGORIES = ["Operasional (listrik/internet)", "Sewa tempat", "Gaji/THR", "Perawatan & servis alat", "Pembelian stok", "Lainnya"];
function upsertExpense(exp) {
  const idx = state.expenses.findIndex(x => x.id === exp.id);
  if (idx >= 0) state.expenses[idx] = exp; else state.expenses.push(exp);
  closeModal();
  // Pengeluaran hidup di dalam tampilan Laba-Rugi (sub-halaman Laporan yang
  // di-gate lewat _laporanProtectedOpen) — arahkan ke situ langsung supaya
  // hasil inputnya kelihatan, baik dipicu dari menu akses cepat maupun dari
  // tombol "Catat pengeluaran" di halaman Laba-Rugi itu sendiri. Dijaga
  // isAdmin() karena tab Laporan memang khusus admin.
  if (isAdmin()) { currentTab = "laporan"; window._laporanProtectedOpen = true; }
  renderAll(); persistExpenses();
}
function removeExpense(id) {
  const e = state.expenses.find(x => x.id === id);
  openConfirmModal({
    title: "Hapus pengeluaran?",
    message: `Catatan pengeluaran "${e ? (e.description || e.category) : "ini"}"${e ? ` sebesar ${rupiah(e.amount)}` : ""} akan dihapus permanen dan bakal mempengaruhi laporan laba-rugi.`,
    confirmLabel: "Ya, hapus",
    onConfirm: () => removeExpenseDirect(id),
  });
}
function removeExpenseDirect(id) { state.expenses = state.expenses.filter(e => e.id !== id); renderAll(); persistExpenses(); }
function openExpenseModal(expenseId) {
  const existing = state.expenses.find(e => e.id === expenseId);
  const e = existing || { id: uid(), date: Date.now(), category: EXPENSE_CATEGORIES[0], description: "", amount: 0, branchId: ensureSelectedBranch() };
  const dateStr = new Date(e.date).toISOString().slice(0,10);
  const expenseBranchOptions = getBranches().map(b=>`<option value="${esc(b.id)}" ${e.branchId===b.id?"selected":""}>${esc(b.name)}</option>`).join("");
  openModal(modalShell(existing ? "Ubah pengeluaran" : "Catat pengeluaran", `
    <label class="rp-field"><span>Cabang</span><select id="exp-branch">${expenseBranchOptions}</select></label>
    <label class="rp-field"><span>Tanggal</span><input id="exp-date" type="date" value="${dateStr}" /></label>
    <label class="rp-field"><span>Kategori</span><select id="exp-category">${EXPENSE_CATEGORIES.map(c=>`<option ${c===e.category?"selected":""}>${c}</option>`).join("")}</select></label>
    <label class="rp-field"><span>Deskripsi (opsional)</span><input id="exp-desc" value="${esc(e.description||"")}" placeholder="Cth: Bayar token listrik" /></label>
    <label class="rp-field"><span>Jumlah (Rp)</span><input id="exp-amount" type="number" min="0" value="${e.amount||""}" /></label>
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
      <button class="rp-btn rp-btn-start" onclick="submitExpense('${e.id}')">Simpan</button>
    </div>
  `));
}
function submitExpense(id) {
  const dateVal = document.getElementById("exp-date").value;
  if (!dateVal) { flash("Tanggal wajib diisi."); return; }
  const amountInput = document.getElementById("exp-amount").value.trim();
  if (!amountInput || Number(amountInput) <= 0) { flash("Jumlah wajib diisi dan lebih dari 0."); return; }
  upsertExpense({
    id,
    branchId: document.getElementById("exp-branch").value,
    branchName: getBranchName(document.getElementById("exp-branch").value),
    date: new Date(dateVal + "T12:00:00+07:00").getTime(),
    category: document.getElementById("exp-category").value,
    description: document.getElementById("exp-desc").value.trim(),
    amount: Number(amountInput),
  });
}

function saveBusinessName(v) { state.settings.businessName = v; persistSettings(); }

/* =========================================================
   Antrian sewa
   PENTING: antrian sekarang per cabang (branchId), bukan global lagi —
   diisi otomatis dari cabang yang lagi aktif pas antrian dibuat.
========================================================= */
function getVisibleQueue(){ const bid=ensureSelectedBranch(); return state.queue.filter(q=>(q.branchId||getBranches()[0].id)===bid); }
function addToQueue(customerName, phone, unitId, note) {
  state.queue.push({ id: uid(), customerName: customerName || "Tamu", phone: phone || "", unitId: unitId || null, note: note || "", requestedAt: Date.now(), branchId: ensureSelectedBranch() });
  persistQueue();
  // Antrian nggak punya halaman sendiri — "rumah"-nya ada di Dashboard
  // (kartu statistik "Antrian menunggu" & tombol antrian per unit), jadi
  // arahkan ke situ di belakang modal antrian yang kebuka.
  currentTab = "dashboard";
  renderAll();
  openQueueModal();
  flash(`${customerName || "Tamu"} ditambahkan ke antrian.`);
}
function removeFromQueue(id) {
  const q = state.queue.find(x => x.id === id);
  openConfirmModal({
    title: "Batalkan antrian?",
    message: `Antrian atas nama "${q ? q.customerName : "ini"}" akan dibatalkan dan dihapus dari daftar.`,
    confirmLabel: "Ya, batalkan",
    onConfirm: () => removeFromQueueDirect(id),
  });
}
function removeFromQueueDirect(id) {
  const q = state.queue.find(x => x.id === id);
  state.queue = state.queue.filter(x => x.id !== id);
  persistQueue();
  renderAll();
  openQueueModal();
  flash(q ? `Antrian ${q.customerName} dibatalkan.` : "Antrian dibatalkan.");
}
function submitQueue() {
  const nameEl = document.getElementById("queue-name");
  if (!nameEl) return;
  const name = nameEl.value.trim();
  if (!name) { flash("Nama penyewa wajib diisi."); return; }
  const phone = document.getElementById("queue-phone").value;
  const unitId = document.getElementById("queue-unit").value || null;
  const note = document.getElementById("queue-note").value;
  addToQueue(name, phone, unitId, note);
}
function assignQueueEntry(queueId) {
  const q = state.queue.find(x => x.id === queueId);
  if (!q) return;
  const sel = document.getElementById("assign-sel-" + queueId);
  const unitId = sel ? sel.value : "";
  if (!unitId) { flash("Pilih unit yang tersedia dulu."); return; }
  state.queue = state.queue.filter(x => x.id !== queueId);
  persistQueue();
  renderAll();
  openStartModal(unitId);
  const nameInput = document.getElementById("start-name");
  if (nameInput) nameInput.value = q.customerName;
  if (q.note) { const noteInput = document.getElementById("start-note"); if (noteInput) noteInput.value = q.note; }
}
function maybeNotifyQueueForUnit(unitId, unitName) {
  const unit = state.units.find(u => u.id === unitId);
  const branchId = unit ? (unit.branchId || getBranches()[0].id) : null;
  const waiting = state.queue.filter(q => (q.branchId||getBranches()[0].id) === branchId && (q.unitId === unitId || !q.unitId));
  if (!waiting.length) return;
  setTimeout(() => {
    flash(`${waiting[0].customerName} sedang mengantre — ${unitName} baru saja kosong.`);
  }, 700);
}
function openQueueModal(prefUnitId) {
  const visibleUnits = getVisibleUnits();
  const unitOptions = `<option value="">Unit apapun (fleksibel)</option>` + visibleUnits.map(u => `<option value="${u.id}" ${prefUnitId===u.id?"selected":""}>${esc(u.name)}</option>`).join("");
  const availableUnits = visibleUnits.filter(u => u.status === "available");
  const branchQueue = getVisibleQueue();
  const rows = branchQueue.map((q, i) => {
    const unitName = q.unitId ? ((state.units.find(u => u.id === q.unitId) || {}).name || "-") : "Unit apapun";
    const assignOptions = availableUnits.map(u => `<option value="${u.id}" ${u.id===q.unitId?"selected":""}>${esc(u.name)}</option>`).join("");
    return `<tr>
      <td class="rp-mono rp-td-no">${i+1}</td>
      <td>${esc(q.customerName)}${q.note ? `<div class="rp-dim">${esc(q.note)}</div>` : ""}</td>
      <td>${esc(q.phone || "-")}</td>
      <td>${esc(unitName)}</td>
      <td class="rp-dim">${fmtTimeID(q.requestedAt)}</td>
      <td class="rp-td-actions"><div class="rp-row-actions">
        ${availableUnits.length ? `<select id="assign-sel-${q.id}" style="font-size:11px;max-width:110px;">${assignOptions}</select>
        <button class="rp-icon-btn" title="Mulai sewa" onclick="assignQueueEntry('${q.id}')">${icon("play",15)}</button>` : `<span class="rp-dim">Belum ada unit kosong</span>`}
        <button class="rp-icon-btn rp-icon-danger" title="Batalkan" onclick="removeFromQueue('${q.id}')">${icon("trash",15)}</button>
      </div></td>
    </tr>`;
  }).join("");
  openModal(modalShell("Antrian sewa", `
    <div class="rp-ruled-head" style="margin-top:0;">Tambah ke antrian</div>
    <label class="rp-field"><span>Nama penyewa</span><input id="queue-name" placeholder="Cth: Budi" /></label>
    <label class="rp-field"><span>No. HP (opsional)</span><input id="queue-phone" placeholder="08xx" /></label>
    <label class="rp-field"><span>Unit yang diinginkan</span><select id="queue-unit">${unitOptions}</select></label>
    <label class="rp-field"><span>Catatan (opsional)</span><input id="queue-note" placeholder="Cth: bawa 2 stik" /></label>
    <button class="rp-btn rp-btn-start" onclick="submitQueue()">${icon("plus",14)} Tambahkan ke antrian</button>
    <div class="rp-ruled-head">Daftar antrian (${branchQueue.length})</div>
    <div class="rp-table-wrap"><table class="rp-table">
      <thead><tr><th class="rp-th-no">No</th><th>Nama</th><th>HP</th><th>Unit diminta</th><th>Waktu</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6">${emptyState("Belum ada antrian.")}</td></tr>`}</tbody>
    </table></div>
  `));
}

function openDashTxModal() {
  const todayStr = nowJakarta().toDateString();
  const todayTx = getVisibleTransactions().filter(t => toJakarta(t.end).toDateString() === todayStr);
  const total = todayTx.reduce((a,t) => a+t.amount, 0);
  const rows = todayTx.map((t, i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${fmtTimeID(t.end)}</td><td>${esc(t.branchName || getBranchName(t.branchId))}</td><td>${esc(t.unitName)}</td><td>${esc(t.customerName)}</td><td class="rp-mono">${t.minutes} mnt</td><td class="rp-mono">${rupiah(t.amount)}</td></tr>`).join("");
  openModal(modalShell("Transaksi hari ini", `
    <p class="rp-sub">${todayTx.length} transaksi · total ${rupiah(total)}</p>
    <div class="rp-table-wrap"><table class="rp-table">
      <thead><tr><th class="rp-th-no">No</th><th>Jam</th><th>Cabang</th><th>Unit</th><th>Penyewa</th><th>Durasi</th><th>Total</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7">${emptyState("Belum ada transaksi hari ini.")}</td></tr>`}</tbody>
    </table></div>
  `));
}
function openDashActiveUnitsModal() {
  const rows = getVisibleUnits().filter(u => u.status === "active" && state.activeRentals[u.id]).map((u, i) => {
    const s = state.activeRentals[u.id];
    const elapsed = Date.now() - s.startTime;
    return `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${esc(u.name)}</td><td>${esc(s.customerName)}</td><td class="rp-mono">${fmtHMS(elapsed)}</td><td>${esc(s.note || "-")}</td></tr>`;
  }).join("");
  openModal(modalShell("Unit sedang disewa", `
    <div class="rp-table-wrap"><table class="rp-table">
      <thead><tr><th class="rp-th-no">No</th><th>Unit</th><th>Penyewa</th><th>Berjalan</th><th>Catatan</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5">${emptyState("Tidak ada unit yang sedang disewa.")}</td></tr>`}</tbody>
    </table></div>
  `));
}
function openUnitDetailModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  if (!unit) return;
  const session = state.activeRentals[unitId];
  if (!session) { openStartModal(unitId); return; }
  const hasDuration = !!session.endTime;
  const elapsed = Date.now() - session.startTime;
  const remaining = hasDuration ? session.endTime - Date.now() : 0;
  const cost = (hasDuration ? (session.endTime - session.startTime) : elapsed) / 3600000 * unit.rate;
  const queued = state.queue.filter(q => q.unitId === unitId);
  openModal(modalShell(`Detail sewa — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Mulai</span><strong>${fmtTimeID(session.startTime)}</strong></div>
      ${hasDuration
        ? `<div class="rp-receipt-row"><span>${remaining<=0?"Waktu lewat":"Sisa waktu"}</span><strong class="rp-mono">${fmtHMS(Math.abs(remaining))}</strong></div>`
        : `<div class="rp-receipt-row"><span>Berjalan</span><strong class="rp-mono">${fmtHMS(elapsed)}</strong></div>`}
      <div class="rp-receipt-row"><span>Estimasi biaya</span><strong class="rp-mono">${rupiah(cost)}</strong></div>
      ${session.note ? `<div class="rp-receipt-row"><span>Catatan</span><strong>${esc(session.note)}</strong></div>` : ""}
    </div>
    ${queued.length ? `<p class="rp-dim">${queued.length} orang mengantre untuk unit ini.</p>` : ""}
    <div class="rp-modal-foot" style="justify-content:space-between;">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal(); openQueueModal('${unitId}')">${icon("users",14)} Antrian</button>
      ${hasDuration ? `<button class="rp-btn rp-btn-ghost" onclick="openExtendModal('${unitId}')">${icon("history",14)} Atur waktu</button>` : ""}
      <button class="rp-btn rp-btn-stop" onclick="openFinishModal('${unitId}')">${icon("stop",14)} Selesai &amp; Bayar</button>
    </div>
  `));
}
function openMaintModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  if (!unit) return;
  const queued = state.queue.filter(q => q.unitId === unitId);
  openModal(modalShell(`Unit servis — ${esc(unit.name)}`, `
    <p class="rp-sub">Unit ini sedang ditandai servis dan tidak bisa disewa.</p>
    ${queued.length ? `<p class="rp-dim">${queued.length} orang mengantre untuk unit ini.</p>` : ""}
    <div class="rp-modal-foot" style="justify-content:space-between;">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal(); openQueueModal('${unitId}')">${icon("users",14)} Antrian</button>
      <button class="rp-btn rp-btn-start" onclick="toggleMaint('${unitId}'); closeModal();">${icon("wrench",14)} Tandai selesai servis</button>
    </div>
  `));
}
function openLaporanDetailModal(type) {
  const tx = window._laporanExportTx || [];
  const period = "bulan";
  let periodLbl = window._laporanExportLabel || getSelectedLaporanRange().label;
  const showBranchCol = getLaporanBranchId() === "ALL";
  let title = "Rincian", theadRow = "", bodyRows = "", colCount = 5;
  if (type === "duration") {
    title = "Rincian durasi per unit";
    const byUnitMap = {};
    tx.forEach(t => {
      const branchLbl = t.branchName || getBranchName(t.branchId);
      const key = showBranchCol ? `${branchLbl}||${t.unitName}` : t.unitName;
      if (!byUnitMap[key]) byUnitMap[key] = { unitName: t.unitName, branchName: branchLbl, minutes: 0, count: 0 };
      byUnitMap[key].minutes += t.minutes;
      byUnitMap[key].count += 1;
    });
    colCount = showBranchCol ? 5 : 4;
    theadRow = `<tr><th class="rp-th-no">No</th>${showBranchCol?"<th>Cabang</th>":""}<th>Unit</th><th>Jumlah sewa</th><th>Total durasi</th></tr>`;
    bodyRows = Object.entries(byUnitMap).sort((a,b) => b[1].minutes - a[1].minutes)
      .map(([,d], i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td>${showBranchCol?`<td>${esc(d.branchName)}</td>`:""}<td>${esc(d.unitName)}</td><td class="rp-mono">${d.count}</td><td class="rp-mono">${(d.minutes/60).toFixed(1)} jam</td></tr>`).join("");
  } else {
    title = type === "revenue" ? "Rincian pendapatan" : type === "count" ? "Rincian jumlah sewa" : "Rincian rata-rata per sewa";
    colCount = showBranchCol ? 7 : 6;
    theadRow = `<tr><th class="rp-th-no">No</th><th>Tanggal</th>${showBranchCol?"<th>Cabang</th>":""}<th>Unit</th><th>Penyewa</th><th>Durasi</th><th>Total</th></tr>`;
    bodyRows = tx.map((t, i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${fmtDateID(t.end)} <span class="rp-dim">${fmtTimeID(t.end)}</span></td>${showBranchCol?`<td>${esc(t.branchName||getBranchName(t.branchId))}</td>`:""}<td>${esc(t.unitName)}</td><td>${esc(t.customerName)}</td><td class="rp-mono">${t.minutes} mnt</td><td class="rp-mono">${rupiah(t.amount)}</td></tr>`).join("");
  }
  openModal(modalShell(title, `
    <p class="rp-sub">${esc(periodLbl)}</p>
    <div class="rp-table-wrap"><table class="rp-table">
      <thead>${theadRow}</thead>
      <tbody>${bodyRows || `<tr><td colspan="${colCount}">${emptyState("Belum ada data pada periode ini.")}</td></tr>`}</tbody>
    </table></div>
  `));
}
function openTrendPointModal(period, startMs, index) {
  window._trendMobileIndex = null;

  const start = new Date(startMs);
  let rangeStart, rangeEnd, label;
  if (period === "minggu") {
    const d = new Date(start); d.setDate(start.getDate() + index); d.setHours(0,0,0,0);
    rangeStart = d.getTime();
    const e = new Date(d); e.setHours(23,59,59,999);
    rangeEnd = e.getTime();
    label = d.toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  } else if (period === "tahun") {
    const year = start.getFullYear();
    rangeStart = new Date(year, index, 1).getTime();
    rangeEnd = new Date(year, index + 1, 0, 23, 59, 59, 999).getTime();
    label = new Date(year, index, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  } else {
    const year = start.getFullYear(), month = start.getMonth();
    rangeStart = new Date(year, month, index + 1).getTime();
    rangeEnd = new Date(year, month, index + 1, 23, 59, 59, 999).getTime();
    label = new Date(year, month, index + 1).toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" });
  }
  const tx = state.transactions.filter(t => { const jt = toJakarta(t.end).getTime(); return jt >= rangeStart && jt <= rangeEnd; });
  const total = tx.reduce((a,t) => a+t.amount, 0);
  const rows = tx.map((t, i) => `<tr><td class="rp-mono rp-td-no">${i+1}</td><td>${fmtTimeID(t.end)}</td><td>${esc(t.branchName || getBranchName(t.branchId))}</td><td>${esc(t.unitName)}</td><td>${esc(t.customerName)}</td><td class="rp-mono">${t.minutes} mnt</td><td class="rp-mono">${rupiah(t.amount)}</td></tr>`).join("");
  openModal(modalShell(`Rincian — ${label}`, `
    <p class="rp-sub">${tx.length} transaksi · total ${rupiah(total)}</p>
    <div class="rp-table-wrap"><table class="rp-table">
      <thead><tr><th class="rp-th-no">No</th><th>Jam</th><th>Cabang</th><th>Unit</th><th>Penyewa</th><th>Durasi</th><th>Total</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7">${emptyState("Tidak ada transaksi pada tanggal ini.")}</td></tr>`}</tbody>
    </table></div>
  `));
}

// Setiap kali modal berganti (ditutup atau dibuka modal lain), anggap popup
// wajib "waktu habis" (kalau ada) sudah tidak tampil lagi & unit yang lagi
// ditangani direset — biar enforceExpiredBlock() bisa mengevaluasi ulang
// dengan bersih di tick berikutnya (munculin lagi kalau belum beres,
// pindah ke modal lain kalau memang sedang legitimately ditangani).
function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
  window._expiredModalShownFor = null;
  window._expiredResolvingUnit = null;
  clearInterval(window._expiredBlockTick);
}
function openModal(html) {
  document.getElementById("modal-root").innerHTML = html;
  window._expiredModalShownFor = null;
  clearInterval(window._expiredBlockTick);
}

function modalShell(title, bodyHtml) {
  return `
  <div class="rp-modal-backdrop" onclick="closeModal()">
    <div class="rp-modal" onclick="event.stopPropagation()">
      <div class="rp-modal-head"><h3>${esc(title)}</h3>
        <button class="rp-icon-btn" onclick="closeModal()">${icon("x",16)}</button>
      </div>
      <div class="rp-modal-body">${bodyHtml}</div>
    </div>
  </div>`;
}
// Varian modal TANPA tombol X dan TANPA tutup-lewat-klik-backdrop — dipakai
// khusus buat popup wajib (mis. waktu sewa habis) yang sengaja tidak boleh
// diabaikan begitu saja oleh kasir.
function modalShellBlocking(title, bodyHtml) {
  return `
  <div class="rp-modal-backdrop">
    <div class="rp-modal" onclick="event.stopPropagation()">
      <div class="rp-modal-head"><h3>${esc(title)}</h3></div>
      <div class="rp-modal-body">${bodyHtml}</div>
    </div>
  </div>`;
}

// ---- Konfirmasi generik buat aksi krusial (hapus data, tutup transaksi,
// dll) — dipanggil sebelum aksi asli dijalankan, supaya salah pencet nggak
// langsung mengubah/menghapus data. `onConfirm` disimpan sementara di
// window._rpConfirmAction dan baru dieksekusi kalau tombol konfirmasi
// beneran ditekan; kalau modal ditutup/dibatalkan, aksinya nggak jalan.
// `opts.icon` opsional buat nimpa ikon default: aksi hapus data (danger,
// default) pakai ikon tempat sampah, aksi lain yang cuma "final & tidak
// bisa diubah lagi" (misal tutup transaksi) sebaiknya kirim icon lain
// (mis. "check") biar nggak kelihatan kayak lagi menghapus sesuatu.
function openConfirmModal(opts) {
  window._rpConfirmAction = typeof opts.onConfirm === "function" ? opts.onConfirm : null;
  const iconName = opts.icon || (opts.danger === false ? null : "trash");
  openModal(modalShell(opts.title || "Konfirmasi", `
    <p style="margin:0;line-height:1.55;color:var(--rp-ink);">${esc(opts.message || "Yakin ingin melanjutkan aksi ini?")}</p>
    ${opts.extraHtml || ""}
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">${esc(opts.cancelLabel || "Batal")}</button>
      <button class="rp-btn ${opts.danger === false ? "rp-btn-start" : "rp-btn-stop"}" onclick="runRpConfirmAction()">${iconName ? icon(iconName,14) : ""} ${esc(opts.confirmLabel || "Ya, lanjutkan")}</button>
    </div>
  `));
}
function runRpConfirmAction() {
  const fn = window._rpConfirmAction;
  window._rpConfirmAction = null;
  closeModal();
  if (typeof fn === "function") fn();
}

async function executeDataReset() {
  const selected = Array.from(document.querySelectorAll(".reset-cat-chk:checked")).map(c => c.value);
  if (!selected.length) { flash("Pilih minimal 1 jenis data dulu."); return; }
  const confirmText = (document.getElementById("reset-confirm-text")?.value || "").trim().toUpperCase();
  if (confirmText !== "HAPUS") { flash('Ketik "HAPUS" persis untuk konfirmasi.'); return; }
  closeModal();
  flash("Menghapus data…");
  try {
    for (const key of selected) {
      if (key === "Settings") {
        await docRef("Settings").set({ rows: [{
          businessName: "Rental PS Saya", defaultRate: 5000,
          branches: [{ id: "branch-main", name: "Cabang Utama" }], cashiers: []
        }] });
      } else {
        await docRef(key).set({ rows: [] });

    }
    flash("Data terpilih berhasil direset.");
  } catch (e) {
    console.error(e);
    flash("Gagal mereset data — cek koneksi internet.");
  }
}

// Dipakai tombol "Mulai sewa" di rel aksi cepat (sisi kiri, laptop/desktop):

function setStartMode(mode) {

function setDurationMode(mode) {

function setDurationPreset(mins) {

function confirmStart(unitId) {
  let plannedMinutes = null;
  if (window._durationMode === "fixed") {
    const h = Number(document.getElementById("dur-hours").value) || 0;
    const m = Number(document.getElementById("dur-minutes").value) || 0;
    plannedMinutes = h * 60 + m;
    if (plannedMinutes <= 0) { flash("Durasi harus lebih dari 0 menit."); return; }
  }
  if (window._startMode === "member") {
    const sel = document.getElementById("start-member");
    const memberId = sel ? sel.value : "";
    if (!memberId) { flash("Pilih pelanggan terlebih dahulu."); return; }
    const m = state.members.find(x => x.id === memberId);
    startRental(unitId, m ? m.name : "Tamu", memberId || null, document.getElementById("start-note").value, plannedMinutes);
  } else {
    const name = document.getElementById("start-name").value.trim();
    if (!name) { flash("Nama tamu wajib diisi."); return; }
    startRental(unitId, name, null, document.getElementById("start-note").value, plannedMinutes);
  }
}

function openFinishModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;
  clearInterval(window._alarmTick);
  const isFixed = !!session.endTime;
  // Untuk sewa berdurasi tetap, harga dikunci sesuai paket yang dipilih di awal —
  // tidak dihitung dari waktu aktual berjalan, biar tidak ada "argo jalan".
  const ms = isFixed ? (session.endTime - session.startTime) : (Date.now() - session.startTime);
  window._finishStop = { unitId, ms, isFixed };
  openModal(modalShell(`Selesaikan sewa — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Durasi</span><strong class="rp-mono" id="finish-duration">${fmtHMS(ms)}</strong></div>
      <div class="rp-receipt-row"><span>Tarif</span><strong class="rp-mono">${rupiah(unit.rate)}/jam</strong></div>
      <div class="rp-receipt-line"></div>
      <div class="rp-receipt-row rp-receipt-total"><span>Total</span><strong class="rp-mono" id="finish-total">${rupiah(ms/3600000*unit.rate)}</strong></div>
    </div>
    <p class="rp-dim">${isFixed ? "Sewa paket durasi tetap — total harga sudah dikunci sesuai paket, tidak berubah walau selesai lebih cepat atau lebih lama." : "Argo berhenti di sini — durasi dan total tidak akan bertambah lagi."}</p>
    ${finishPromoFieldHtml(unit, unitId)}
    <label class="rp-field"><span>Diskon (Rp, opsional)</span><input id="finish-discount" type="number" min="0" value="0" oninput="clearFinishPromoIfEdited('${unitId}')" /></label>
    <label class="rp-field"><span>Metode pembayaran</span>
      <select id="finish-payment" onchange="toggleFinishCashField()"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select>
    </label>
    <div id="finish-cash-wrap"></div>
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
      <button class="rp-btn rp-btn-stop" onclick="confirmFinish('${unitId}')">${icon("stop",14)} Selesaikan &amp; catat</button>

// Field "Uang tunai" cuma muncul kalau metode bayar = Tunai — begitu dipilih,
// kasir tinggal isi nominal uang yang diterima dan kembaliannya kehitung
// otomatis, persis kayak di kasir beneran.
function toggleFinishCashField() {
  const sel = document.getElementById("finish-payment");
  const wrap = document.getElementById("finish-cash-wrap");
  if (!sel || !wrap) return;
  if (sel.value === "Tunai") {
    // Kembalian ditaruh di kotak besar & terpisah dari input "uang tunai" —
    // biar kasir tidak ketuker antara nominal uang bayar & kembaliannya.
    wrap.innerHTML = `
      <label class="rp-field"><span>Uang tunai diterima (Rp)</span><input id="finish-cash" type="number" min="0" step="1000" placeholder="0" oninput="updateFinishChange()" /></label>
      <div class="rp-kembalian-box" id="finish-change-box">
        <div class="rp-kembalian-label">Kembalian</div>
        <div class="rp-kembalian-value" id="finish-change">${rupiah(0)}</div>
      </div>
    `;
    updateFinishChange();
  } else if (sel.value === "QRIS") {
    const qris = state.settings.qrisImage;
    wrap.innerHTML = qris
      ? `<div class="rp-field"><span>Tunjukkan QRIS ini ke pelanggan</span>
          <img src="${esc(qris)}" alt="QRIS" style="width:100%;max-width:240px;display:block;margin:8px auto 0;border-radius:10px;border:1px solid var(--rp-border-strong);" />
        </div>`
      : `<p class="rp-dim">Belum ada gambar QRIS tersimpan. Tambahkan lewat nama usaha di pojok kiri atas (klik nama usaha).</p>`;
  } else if (sel.value === "Transfer") {
    const rek = state.settings.bankAccount;
    wrap.innerHTML = rek
      ? `<div class="rp-receipt" style="text-align:center;"><div class="rp-receipt-row" style="justify-content:center;"><strong class="rp-mono" style="font-size:15px;">${esc(rek)}</strong></div></div><p class="rp-dim" style="margin:6px 0 0;">Beritahukan nomor rekening ini ke pelanggan untuk transfer.</p>`
      : `<p class="rp-dim">Belum ada no. rekening tersimpan. Tambahkan lewat nama usaha di pojok kiri atas (klik nama usaha).</p>`;
  } else {
    wrap.innerHTML = "";
  }
}
// Hitung kembalian = uang tunai - total tagihan. Kalau uangnya kurang, kotak
// besar ini berubah warna merah biar kasir sadar belum cukup (bukan
// kembalian negatif yang membingungkan).
function updateFinishChange() {
  const cashInput = document.getElementById("finish-cash");
  const changeEl = document.getElementById("finish-change");
  const boxEl = document.getElementById("finish-change-box");
  if (!cashInput || !changeEl) return;
  const amount = computeFinishAmount();
  const cash = Number(cashInput.value) || 0;
  const change = cash - amount;
  changeEl.textContent = (change < 0 ? "Kurang " : "") + rupiah(Math.abs(change));
  if (boxEl) boxEl.classList.toggle("is-short", change < 0);
}
// Dropdown promo hanya dimunculkan kalau cabang unit ini punya promo
// terdaftar (dikelola admin di menu Cabang & Unit). Pilih tanpa promo tetap
// bisa isi diskon manual seperti biasa.
function finishPromoFieldHtml(unit, unitId){
  const promos = getPromosForBranch(unit.branchId || ensureSelectedBranch());
  if (!promos.length) return "";
  const options = `<option value="">Tanpa promo (diskon manual)</option>` +
    promos.map(p => `<option value="${esc(p.id)}">${esc(p.name)} — ${esc(formatPromoValue(p))}</option>`).join("");
  return `<label class="rp-field"><span>Promo/diskon cabang (opsional)</span>
    <select id="finish-promo" onchange="applyPromoToFinish('${unitId}')">${options}</select>
  </label>`;
}
function applyPromoToFinish(unitId){
  const unit = state.units.find(u => u.id === unitId);
  const promoSel = document.getElementById("finish-promo");
  const discInput = document.getElementById("finish-discount");
  if (!unit || !promoSel || !discInput || !window._finishStop || window._finishStop.unitId !== unitId) return;
  const promoId = promoSel.value;
  if (!promoId) { updateFinishTotal(unitId); return; }
  const promo = getPromo(promoId);
  if (!promo) return;
  const rawAmount = window._finishStop.ms / 3600000 * unit.rate;
  const discValue = promo.type === "percent" ? Math.round(rawAmount * promo.value / 100) : Math.round(promo.value);
  discInput.value = Math.max(0, Math.min(discValue, Math.round(rawAmount)));
  updateFinishTotal(unitId);
}
// Kalau kasir mengetik manual di kolom diskon setelah sempat memilih promo,
// anggap promo itu dilepas (biar nama promo yang tercatat di struk tidak
// menyesatkan — nilainya sudah bukan nilai promo yang dipilih lagi).
function clearFinishPromoIfEdited(unitId){
  const promoSel = document.getElementById("finish-promo");
  if (promoSel) promoSel.value = "";
  updateFinishTotal(unitId);
}
// Dipakai bareng oleh updateFinishTotal (nampilin total) dan updateFinishChange
// (hitung kembalian) supaya keduanya selalu ngambil dari sumber angka yang sama.
function computeFinishAmount() {
  if (!window._finishStop) return 0;
  const unit = state.units.find(u => u.id === window._finishStop.unitId);
  if (!unit) return 0;
  const discount = Number(document.getElementById("finish-discount")?.value) || 0;
  return Math.max(0, Math.round(window._finishStop.ms / 3600000 * unit.rate - discount));
}
function updateFinishTotal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  if (!unit || !window._finishStop || window._finishStop.unitId !== unitId) return;
  const amount = computeFinishAmount();
  const el = document.getElementById("finish-total");
  if (el) el.textContent = rupiah(amount);
  // Diskon berubah -> total berubah -> kembalian ikut harus di-refresh.
  updateFinishChange();
}
function confirmFinish(unitId) {
  const payment = document.getElementById("finish-payment").value;
  const discount = Number(document.getElementById("finish-discount").value) || 0;
  const promoSel = document.getElementById("finish-promo");
  const promo = promoSel && promoSel.value ? getPromo(promoSel.value) : null;
  const frozenMs = window._finishStop && window._finishStop.unitId === unitId ? window._finishStop.ms : null;
  const isFixed = !!(window._finishStop && window._finishStop.unitId === unitId && window._finishStop.isFixed);
  const totalText = document.getElementById("finish-total")?.textContent || "";

  // Khusus Tunai: wajib isi uang yang diterima, dan gak boleh kurang dari
  // total tagihan — sama kayak kasir beneran nolak kalau uangnya kurang.
  let cashReceived = null, change = null;
  if (payment === "Tunai") {
    const amount = computeFinishAmount();
    cashReceived = Number(document.getElementById("finish-cash")?.value) || 0;
    if (cashReceived < amount) { flash("Uang tunai yang diterima masih kurang dari total tagihan."); return; }
    change = cashReceived - amount;
  }

  openConfirmModal({
    title: "Tutup transaksi ini?",
    message: payment === "Tunai"
      ? `Sewa akan ditutup dengan total ${totalText} (Tunai). Uang diterima ${rupiah(cashReceived)}. Setelah dicatat, transaksi ini tidak bisa diubah lagi.`
      : `Sewa akan ditutup dengan total ${totalText} (${payment}). Setelah dicatat, transaksi ini tidak bisa diubah lagi.`,
    // Kembalian ditaruh di kotak besar & mencolok (sama kayak di form isi
    // uang tunai & di struk) — biar kasir gampang lihat angka kembaliannya
    // pas terakhir kali konfirmasi, bukan kesamar di tengah kalimat.
    extraHtml: payment === "Tunai"
      ? `<div class="rp-kembalian-box" style="margin-top:12px;"><div class="rp-kembalian-label">Kembalian</div><div class="rp-kembalian-value">${rupiah(change)}</div></div>`
      : "",
    confirmLabel: "Ya, selesaikan",
    icon: "check",
    onConfirm: () => {
      finishRental(unitId, payment, discount, frozenMs, promo ? promo.name : "", isFixed, cashReceived, change);
      window._finishStop = null;
    },
  });
}

/* --------------------- Alarm & perpanjang waktu --------------------- */
window._alertedUnits = window._alertedUnits || new Set();
// Unit yang waktu sewanya SUDAH BENERAN HABIS (bukan cuma peringatan 10
// menit sebelumnya) dan belum diselesaikan (bayar) atau diperpanjang.
// Selama masih ada isinya, kasir "dipaksa" lewat popup wajib supaya
// transaksi itu diberesin dulu sebelum bisa kerjain hal lain.
window._expiredUnits = window._expiredUnits || new Set();
// Unit yang lagi aktif ditangani kasir (modal Perpanjang/Selesai & Bayar
// terbuka dari popup wajib) — dipakai supaya popup wajib tidak "menyela"
// balik selagi kasir masih ngisi form itu.
window._expiredResolvingUnit = window._expiredResolvingUnit || null;
// Unit yang popup wajibnya SEDANG tampil di layar saat ini (dipakai buat
// menghindari re-render tiap detik selagi popup yang sama masih terbuka).
window._expiredModalShownFor = window._expiredModalShownFor || null;

function checkRentalAlarms() {
  const now = Date.now();
  // Bersihkan unit yang sudah tidak aktif lagi (sudah dibayar/diselesaikan)
  // dari daftar "habis waktu" — kalau tidak, popup wajib bisa nyangkut.
  Array.from(window._expiredUnits).forEach(id => { if (!state.activeRentals[id]) window._expiredUnits.delete(id); });

  Object.entries(state.activeRentals).forEach(([unitId, session]) => {
    if (!session.endTime) return;
    const remaining = session.endTime - now;
    if (remaining <= 0) {
      window._expiredUnits.add(unitId);
      return;
    }
    window._expiredUnits.delete(unitId);
    if (remaining <= 10 * 60000 && !window._alertedUnits.has(unitId)) {
      window._alertedUnits.add(unitId);
      triggerRentalAlarm(unitId);
    }
  });
  enforceExpiredBlock();
}
setInterval(checkRentalAlarms, 1000);

// Paksa munculkan popup "waktu habis" (tidak bisa ditutup selain lewat
// Perpanjang / Selesai & Bayar) untuk unit expired paling awal yang belum
// ditangani. Dipanggil tiap detik — kalau kasir membatalkan modal
// Perpanjang/Selesai tanpa menyelesaikannya, popup ini otomatis muncul
// lagi 1 detik kemudian, jadi kasir tidak bisa kabur ke menu lain sebelum
// transaksi itu beres.
function enforceExpiredBlock() {
  if (window._expiredUnits.size === 0) { window._expiredModalShownFor = null; return; }
  if (window._expiredResolvingUnit && window._expiredUnits.has(window._expiredResolvingUnit)) return;
  const nextUnitId = window._expiredUnits.values().next().value;
  if (window._expiredModalShownFor === nextUnitId) return;
  openExpiredBlockModal(nextUnitId);
}
// Dipanggil dari tombol "Perpanjang" / "Selesai & Bayar" di popup wajib —
// menandai unit ini sedang ditangani supaya popup tidak menyela balik
// selagi kasir mengisi form perpanjangan/pembayaran.
function resolveExpiredExtend(unitId) {
  window._expiredResolvingUnit = unitId;
  openExtendModal(unitId);
}
function resolveExpiredFinish(unitId) {
  window._expiredResolvingUnit = unitId;
  openFinishModal(unitId);
}
function openExpiredBlockModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session || !session.endTime) { window._expiredUnits.delete(unitId); return; }
  clearInterval(window._alarmTick);
  clearInterval(window._expiredBlockTick);
  playAlarmBeep();
  openModal(modalShellBlocking(`⏰ Waktu sewa habis — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Terlambat</span><strong class="rp-mono rp-timer is-over" id="expired-elapsed">${fmtHMS(Math.abs(session.endTime - Date.now()))}</strong></div>
    </div>
    <p class="rp-sub"><strong>Waktu sewa unit ini sudah habis.</strong> Selesaikan dulu transaksi ini (atur waktu atau bayar) sebelum lanjut kerjain yang lain.</p>
    <div class="rp-modal-foot" style="justify-content:space-between;">
      <button class="rp-btn rp-btn-ghost" onclick="resolveExpiredExtend('${unitId}')">${icon("history",14)} Atur waktu</button>
      <button class="rp-btn rp-btn-stop" onclick="resolveExpiredFinish('${unitId}')">${icon("stop",14)} Selesai &amp; Bayar</button>
    </div>
  `));
  window._expiredModalShownFor = unitId;
  window._expiredBlockTick = setInterval(() => {
    const el = document.getElementById("expired-elapsed");
    if (!el) { clearInterval(window._expiredBlockTick); return; }
    el.textContent = fmtHMS(Math.abs(session.endTime - Date.now()));
  }, 1000);
}

function playAlarmBeep() {
  try {
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    [0, 0.32, 0.64].forEach(delay => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = 880; g.gain.value = 0.16;
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.22);
    });
  } catch (e) { console.error(e); }
}

function triggerRentalAlarm(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;
  playAlarmBeep();
  try {
    if ("Notification" in window) {
      if (Notification.permission === "granted") {
        new Notification("⏰ Waktu sewa hampir habis", { body: `${unit.name} — sisa waktu tinggal sedikit.` });
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }
  } catch (e) { /* abaikan jika notifikasi tidak didukung */ }
  openAlarmModal(unitId);
}

function openAlarmModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session || !session.endTime) return;
  clearInterval(window._alarmTick);
  openModal(modalShell(`⏰ Waktu hampir habis — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Sisa waktu</span><strong class="rp-mono" id="alarm-remaining">${fmtHMS(Math.abs(session.endTime - Date.now()))}</strong></div>
    </div>
    <p class="rp-sub">Sewa akan segera berakhir. Atur waktu (tambah/kurangi), atau sudah selesai dan mau dibayar?</p>
    <div class="rp-modal-foot" style="justify-content:space-between;">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Nanti dulu</button>
      <button class="rp-btn rp-btn-ghost" onclick="openExtendModal('${unitId}')">${icon("history",14)} Atur waktu</button>
      <button class="rp-btn rp-btn-stop" onclick="openFinishModal('${unitId}')">${icon("stop",14)} Sudah Selesai</button>
    </div>
  `));
  window._alarmTick = setInterval(() => {
    const el = document.getElementById("alarm-remaining");
    if (!el) { clearInterval(window._alarmTick); return; }
    const rem = session.endTime - Date.now();
    el.textContent = (rem <= 0 ? "Lewat " : "") + fmtHMS(Math.abs(rem));
  }, 1000);
}

function openExtendModal(unitId) {
  clearInterval(window._alarmTick);
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;

  openModal(modalShell(`Atur ulang waktu sewa — ${esc(unit.name)}`, `
    <div class="rp-field-row">
      <button type="button" class="rp-pill is-on" id="extend-mode-add" onclick="setExtendMode('add')">${icon("plus",13)} Tambah waktu</button>
      <button type="button" class="rp-pill" id="extend-mode-sub" onclick="setExtendMode('sub')">${icon("minus",13)} Kurangi waktu</button>
    </div>
    <div class="rp-field-row">
      <label class="rp-field"><span>Jam</span><input id="extend-hours" type="number" min="0" value="1" /></label>
      <label class="rp-field"><span>Menit</span><input id="extend-minutes" type="number" min="0" max="59" value="0" /></label>
    </div>
    <div class="rp-field-row">
      ${[15,30,60,120].map(m => `<button type="button" class="rp-pill" onclick="setExtendPreset(${m})">${m<60?m+" mnt":(m/60)+" jam"}</button>`).join("")}
    </div>

      <button class="rp-btn rp-btn-start" id="extend-confirm-btn" onclick="confirmExtend('${unitId}')">${icon("play",14)} Tambah waktu</button>
    </div>
  `));
}
// Toggle mode tambah/kurangi — cuma ganti tampilan tombol, jam & menit yang
// sudah diisi/preset yang dipilih tetap kepakai, tinggal arah tandanya beda.
function setExtendMode(mode) {
  window._extendMode = mode;
  const addBtn = document.getElementById("extend-mode-add");
  const subBtn = document.getElementById("extend-mode-sub");
  const confirmBtn = document.getElementById("extend-confirm-btn");
  if (addBtn) addBtn.classList.toggle("is-on", mode === "add");
  if (subBtn) subBtn.classList.toggle("is-on", mode === "sub");
  if (confirmBtn) confirmBtn.innerHTML = `${icon(mode === "add" ? "play" : "stop", 14)} ${mode === "add" ? "Tambah waktu" : "Kurangi waktu"}`;
}
function setExtendPreset(mins) {
  document.getElementById("extend-hours").value = Math.floor(mins/60);
  document.getElementById("extend-minutes").value = mins % 60;
}
function confirmExtend(unitId) {
  const h = Number(document.getElementById("extend-hours").value) || 0;
  const m = Number(document.getElementById("extend-minutes").value) || 0;
  const totalMinutes = h * 60 + m;
  if (totalMinutes <= 0) { flash("Masukkan durasi jam/menitnya dulu."); return; }
  const signedMinutes = window._extendMode === "sub" ? -totalMinutes : totalMinutes;
  extendRental(unitId, signedMinutes);
}

// Preview lokal dulu (belum diupload) pakai FileReader, biar kasir langsung
// lihat hasil foto sebelum klik Simpan. Upload beneran ke Cloudinary baru
// terjadi pas submitInventory() dipanggil.
function previewInventoryPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { flash("Ukuran foto maksimal 5MB."); e.target.value = ""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const box = document.getElementById("inv-photo-preview");
    if (box) box.innerHTML = `<img src="${reader.result}" alt="" style="width:100%;max-width:160px;border-radius:8px;display:block;" />`;
  };
  reader.onerror = () => flash("Gagal membaca file foto.");
  reader.readAsDataURL(file);
}
async function submitInventory(id) {
  const name = document.getElementById("inv-name").value.trim();
  if (!name) { flash("Nama item wajib diisi."); return; }
  const fileInput = document.getElementById("inv-photo-file");
  const file = fileInput && fileInput.files[0];
  let photoUrl = document.getElementById("inv-photo-url").value || "";
  const btn = document.getElementById("inv-save-btn");
  let photoFailed = false;
  if (file) {
    if (btn) { btn.disabled = true; btn.textContent = "Mengunggah foto…"; }
    try {
      photoUrl = await uploadToCloudinary(file);
    } catch (err) {
      console.error(err);
      photoFailed = true;
      flash("Item disimpan, tapi upload foto gagal: " + (err && err.message ? err.message : "cek koneksi internet."));
    }
    if (btn) { btn.disabled = false; btn.textContent = "Simpan"; }
  }
  upsertInventory({
    id, name,
    category: document.getElementById("inv-category").value,
    unitId: document.getElementById("inv-unit").value,
    condition: document.getElementById("inv-condition").value,
    note: document.getElementById("inv-note").value,
    photoUrl,
    lastCheck: Date.now(),
  });
}

/* --------------------- Dashboard --------------------- */
function renderDashboard() {
  const todayStr = nowJakarta().toDateString();
  // PENTING: harus difilter ke cabang aktif (getVisibleTransactions), bukan
  // state.transactions mentah — kalau nggak, pendapatan/transaksi hari ini
  // di dashboard kasir ikut kecampur sama transaksi cabang lain.
  const todayTx = getVisibleTransactions().filter(t => toJakarta(t.end).toDateString() === todayStr);
  const todayRevenue = todayTx.reduce((a,t) => a + t.amount, 0);
  const activeCount = getVisibleUnits().filter(u => !!state.activeRentals[u.id]).length;

  const cards = getVisibleUnits().map(unit => {
    const session = state.activeRentals[unit.id];
    const isActive = unit.status === "active" && session;
    const isMaint = unit.status === "maintenance";
    const hasDuration = isActive && !!session.endTime;
    const elapsed = isActive ? Date.now() - session.startTime : 0;
    const remaining = hasDuration ? session.endTime - Date.now() : 0;
    const isOver = hasDuration && remaining <= 0;
    const isWarning = hasDuration && !isOver && remaining <= 10*60000;
    const runningCost = isActive
      ? (hasDuration ? (session.endTime - session.startTime) : elapsed) / 3600000 * unit.rate
      : 0;
    const queuedForUnit = state.queue.filter(q => q.unitId === unit.id).length;
    const cardClick = isActive ? `openUnitDetailModal('${unit.id}')` : isMaint ? `openMaintModal('${unit.id}')` : `openStartModal('${unit.id}')`;
    return `
      <div class="rp-card rp-unit-card rp-clickable${isActive?" is-active":""}${isMaint?" is-maint":""}" onclick="${cardClick}">
        <div class="rp-stamp rp-stamp-${unit.status}">${unit.status==="available"?"Kosong":unit.status==="active"?"Disewa":"Servis"}</div>
        <div class="rp-unit-name">${esc(unit.name)}</div>
        <div class="rp-unit-rate rp-mono">${rupiah(unit.rate)}/jam</div>
        ${isActive ? `
          ${hasDuration ? `<div class="rp-unit-customer">${isOver?"Waktu habis":"Sisa waktu"}</div>` : ""}
          <div class="rp-timer rp-mono js-timer${isWarning?" is-warning":""}${isOver?" is-over":""}" data-unit="${unit.id}" data-mode="${hasDuration?"countdown":"elapsed"}" data-start="${session.startTime}" data-end="${session.endTime||""}">${hasDuration ? (isOver?"-":"")+fmtHMS(Math.abs(remaining)) : fmtHMS(elapsed)}</div>
          <div class="rp-unit-customer">untuk ${esc(session.customerName)}</div>
          <div class="rp-running-cost rp-mono js-cost" data-unit="${unit.id}" data-rate="${unit.rate}" data-start="${session.startTime}" data-fixed="${hasDuration?"1":"0"}">${hasDuration?rupiah(runningCost):"≈ "+rupiah(runningCost)}</div>
          ${queuedForUnit ? `<div class="rp-unit-note">${queuedForUnit} orang mengantre untuk unit ini</div>` : ""}
          <div class="rp-card-actions">
            ${hasDuration ? `<button class="rp-btn rp-btn-ghost" onclick="event.stopPropagation(); openExtendModal('${unit.id}')">${icon("history",13)} Atur waktu</button>` : ""}
            <button class="rp-btn rp-btn-stop" onclick="event.stopPropagation(); openFinishModal('${unit.id}')">${icon("stop",14)} Selesai &amp; Bayar</button>
          </div>
          <div class="rp-card-actions">
            <button class="rp-btn rp-btn-ghost" onclick="event.stopPropagation(); openQueueModal('${unit.id}')">${icon("users",13)} Antrian${queuedForUnit?` (${queuedForUnit})`:""}</button>
          </div>
        ` : isMaint ? `
          <div class="rp-unit-note">Unit sedang diservis, tidak bisa disewa.</div>
          ${queuedForUnit ? `<div class="rp-unit-note">${queuedForUnit} orang mengantre untuk unit ini</div>` : ""}
          <div class="rp-card-actions">
            <button class="rp-btn rp-btn-ghost" onclick="event.stopPropagation(); openQueueModal('${unit.id}')">${icon("users",13)} Antrian${queuedForUnit?` (${queuedForUnit})`:""}</button>
          </div>
        ` : `
          <button class="rp-btn rp-btn-start" onclick="event.stopPropagation(); openStartModal('${unit.id}')">${icon("play",14)} Mulai Sewa</button>
        `}
      </div>`;
  }).join("");

  const activeBranch = getBranches().find(b => b.id === ensureSelectedBranch()) || {};
  const hasPhoto = !!activeBranch.photoUrl;
  const bannerStyle = hasPhoto
    ? ` style="background-image:linear-gradient(100deg, rgba(8,10,18,.74) 0%, rgba(8,10,18,.52) 45%, rgba(8,10,18,0) 88%), url('${esc(activeBranch.photoUrl)}')"`
    : "";
  return `
    <div class="rp-page">
      <header class="rp-page-head rp-dash-banner${hasPhoto ? " has-photo" : ""}"${bannerStyle}${hasPhoto ? ` onclick="this.classList.toggle('rp-banner-edit-visible')"` : ""}>
        <div class="rp-dash-banner-text">
          <h1>Dashboard Kasir</h1>
          <p class="rp-sub">Ringkasan hari ini, ${fmtDateID(new Date())}</p>
        </div>
        ${isAdmin() ? `<button class="rp-btn rp-btn-ghost rp-dash-banner-edit" onclick="event.stopPropagation();openBranchModal('${esc(activeBranch.id || "")}')">${icon("image", 13)} ${hasPhoto ? "Ganti foto" : "Tambah foto header"}</button>` : ""}
      </header>
      ${branchSwitcherHtml()}
      <div class="rp-stat-row">
        <div class="rp-stat-card rp-clickable" onclick="openDashTxModal()"><span class="rp-stat-label">Pendapatan hari ini</span><strong class="rp-mono rp-stat-value">${rupiah(todayRevenue)}</strong></div>
        <div class="rp-stat-card rp-clickable" onclick="openDashTxModal()"><span class="rp-stat-label">Transaksi hari ini</span><strong class="rp-mono rp-stat-value">${todayTx.length}</strong></div>

      </div>

      ${state.units.length === 0 ? emptyState(`Belum ada unit PS. Tambahkan dulu di menu ${isAdmin() ? "Cabang & Unit" : "Unit PS"}.`) : `<div class="rp-unit-grid">${cards}</div>`}
    </div>`;
}

function tickDashboardTimers() {
  if (currentTab !== "dashboard") return;
  document.querySelectorAll(".js-timer").forEach(el => {
    if (el.dataset.mode === "countdown") {
      const end = Number(el.dataset.end);
      const remaining = end - Date.now();
      const over = remaining <= 0;
      el.textContent = (over ? "-" : "") + fmtHMS(Math.abs(remaining));
      el.classList.toggle("is-warning", !over && remaining <= 10*60000);
      el.classList.toggle("is-over", over);
    } else {
      const start = Number(el.dataset.start);
      el.textContent = fmtHMS(Date.now() - start);
    }
  });
  document.querySelectorAll(".js-cost").forEach(el => {
    if (el.dataset.fixed === "1") return;
    const start = Number(el.dataset.start);
    const rate = Number(el.dataset.rate);
    const cost = (Date.now() - start) / 3600000 * rate;
    el.textContent = "≈ " + rupiah(cost);
  });
}
setInterval(tickDashboardTimers, 1000);

/* --------------------- Cabang & Unit --------------------- */
function upsertBranch(branch){
  const bs=getBranches(); const idx=bs.findIndex(b=>b.id===branch.id);
  if(idx>=0)bs[idx]=branch;else bs.push(branch);
  state.settings.branches=bs; selectedBranchId=branch.id;
  state.units.forEach(u=>{if(u.branchId===branch.id)u.branchName=branch.name;});
  closeModal(); renderAll(); persistSettings(); persistUnits();
}
function removeBranch(id){
  if(state.units.some(u=>u.branchId===id)){flash("Cabang tidak bisa dihapus karena masih memiliki unit.");return;}
  const bs=getBranches();
  if(bs.length<=1){flash("Minimal harus ada 1 cabang.");return;}
  const b = bs.find(x=>x.id===id);
  openConfirmModal({
    title: "Hapus cabang?",
    message: `Cabang "${b?b.name:"ini"}" akan dihapus permanen. Data pengeluaran/laporan lama yang tertaut ke cabang ini tetap tersimpan.`,
    confirmLabel: "Ya, hapus cabang",
    onConfirm: () => removeBranchDirect(id),
  });
}
function removeBranchDirect(id){
  if(state.units.some(u=>u.branchId===id)){flash("Cabang tidak bisa dihapus karena masih memiliki unit.");return;}
  const bs=getBranches().filter(b=>b.id!==id);
  if(!bs.length){flash("Minimal harus ada 1 cabang.");return;}
  state.settings.branches=bs; ensureSelectedBranch(); renderAll(); persistSettings();
}
function openBranchModal(branchId){
  const existing=getBranches().find(b=>b.id===branchId); const b=existing||{id:uid(),name:"",photoUrl:""};
  openModal(modalShell(existing?"Ubah cabang":"Tambah cabang",`
    <label class="rp-field"><span>Nama cabang</span><input id="branch-name" value="${esc(b.name)}" placeholder="Cth: Cirebon 1"></label>
    <label class="rp-field">
      <span>Foto header dashboard (opsional)</span>
      <input type="file" id="branch-photo-file" accept="image/*" onchange="previewBranchPhoto(event)" />
    </label>
    <div id="branch-photo-preview" style="margin:-4px 0 10px;">${b.photoUrl?`<img src="${esc(b.photoUrl)}" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;" />`:""}</div>
    <input type="hidden" id="branch-photo-url" value="${esc(b.photoUrl||"")}" />
    ${b.photoUrl?`<button type="button" class="rp-btn rp-btn-ghost" style="width:auto;margin:-4px 0 12px;" onclick="clearBranchPhoto()">${icon("x",13)} Hapus foto</button>`:""}
    <div class="rp-modal-foot"><button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
    <button class="rp-btn rp-btn-start" id="branch-save-btn" onclick="submitBranch('${b.id}')">Simpan</button></div>`));

// Sama kayak previewInventoryPhoto: preview lokal dulu pakai FileReader,
// upload ke Cloudinary beneran baru pas Simpan diklik.
function previewBranchPhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){flash("Ukuran foto maksimal 5MB.");e.target.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const box=document.getElementById("branch-photo-preview");
    if(box)box.innerHTML=`<img src="${reader.result}" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;" />`;
  };
  reader.onerror=()=>flash("Gagal membaca file foto.");
  reader.readAsDataURL(file);
}
function clearBranchPhoto(){
  const urlInput=document.getElementById("branch-photo-url"); if(urlInput)urlInput.value="";
  const fileInput=document.getElementById("branch-photo-file"); if(fileInput)fileInput.value="";
  const box=document.getElementById("branch-photo-preview"); if(box)box.innerHTML="";
}
async function submitBranch(id){
  const name=document.getElementById("branch-name").value.trim();
  if(!name){flash("Nama cabang wajib diisi.");return;}
  const fileInput=document.getElementById("branch-photo-file");
  const file=fileInput&&fileInput.files[0];
  let photoUrl=document.getElementById("branch-photo-url").value||"";
  const btn=document.getElementById("branch-save-btn");
  if(file){
    if(btn){btn.disabled=true;btn.textContent="Mengunggah foto…";}
    try{
      photoUrl=await uploadToCloudinary(file);
    }catch(err){
      console.error(err);
      flash("Cabang disimpan, tapi upload foto gagal: "+(err&&err.message?err.message:"cek koneksi internet."));
    }
    if(btn){btn.disabled=false;btn.textContent="Simpan";}
  }
  upsertBranch({id,name,photoUrl});
}
