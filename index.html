function laporanBranchOptionsHtml() {
  const cur = getLaporanBranchId();
  const opts = `<option value="ALL"${cur === "ALL" ? " selected" : ""}>Semua Cabang</option>` +
    getBranches().map(b => `<option value="${esc(b.id)}"${b.id === cur ? " selected" : ""}>${esc(b.name)}</option>`).join("");
  return `<label class="rp-field" style="min-width:220px;"><span>Cabang</span><select onchange="setLaporanBranch(this.value)">${opts}</select></label>`;
}
function laporanBranchLabel() {
  const bid = getLaporanBranchId();
  return bid === "ALL" ? "Semua Cabang" : getBranchName(bid);
}
function getTransactionsForLaporanBranch() {
  const bid = getLaporanBranchId();
  if (bid === "ALL") return state.transactions.slice();
  return state.transactions.filter(t => {
    if (t.branchId) return t.branchId === bid;
    const u = state.units.find(x => x.id === t.unitId);
    return u ? (u.branchId || getBranches()[0].id) === bid : false;
  });
}

function getLaporanMonthValue() {
  const now = nowJakarta();
  return window._laporanMonth || `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
}

function getLaporanMonthOptions() {
  const now = nowJakarta();
  const months = new Set();
  const addMonth = (v) => {
    if (!v) return;
    const d = toJakarta(v);
    if (!isNaN(d.getTime())) months.add(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`);
  };
  const laporanBid = getLaporanBranchId();
  getTransactionsForLaporanBranch().forEach(t => addMonth(t.end));
  state.expenses.filter(e => laporanBid === "ALL" || (e.branchId || getBranches()[0].id) === laporanBid).forEach(e => addMonth(e.date));

  const currentValue = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  months.add(currentValue);

  const sorted = Array.from(months).sort();
  if (!sorted.length) sorted.push(currentValue);

  return sorted.reverse().map(value => {
    const [year, month] = value.split('-').map(Number);
    const label = new Date(year, month - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
    const selected = value === getLaporanMonthValue() ? ' selected' : '';
    return `<option value="${value}"${selected}>${label}</option>`;
  }).join('');
}

function getSelectedLaporanRange() {
  const value = getLaporanMonthValue();
  const [year, month] = value.split('-').map(Number);
  const start = new Date(year, month - 1, 1);
  const end = new Date(year, month, 0, 23, 59, 59, 999);
  const label = start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  return { start, end, label, value };
}

function getPeriodRange(period, selectedMonthValue) {
  if (period === 'bulan' && selectedMonthValue) {
    const [year, month] = selectedMonthValue.split('-').map(Number);
    const start = new Date(year, month - 1, 1);
    const end = new Date(year, month, 0, 23, 59, 59, 999);
    const label = `Bulan terpilih (${start.toLocaleDateString('id-ID',{month:'long',year:'numeric'})})`;
    return { start, end, label };
  }
  const now = nowJakarta();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  return { start, end, label: `Bulan terpilih (${now.toLocaleDateString('id-ID',{month:'long',year:'numeric'})})` };
}

function sumByDay(d) {
  const key = d.toDateString();
  return state.transactions.filter(t => toJakarta(t.end).toDateString() === key).reduce((a,t) => a+t.amount, 0);
}
function sumByMonth(year, month) {
  return state.transactions.filter(t => { const d = toJakarta(t.end); return d.getFullYear() === year && d.getMonth() === month; }).reduce((a,t) => a+t.amount, 0);
}
function sumByDate(year, month, day) {
  return getVisibleTransactions().filter(t => { const d = toJakarta(t.end); return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day; }).reduce((a,t) => a+t.amount, 0);
}

// Sama seperti sumByDate, tapi mengikuti filter cabang milik halaman Laporan
// (getLaporanBranchId), bukan cabang aktif global (selectedBranchId) yang
// dipakai di menu Kasir/Unit. Dipakai khusus untuk grafik tren di Laporan.
function sumByDateForLaporan(year, month, day, branchId) {
  const bid = branchId || getLaporanBranchId();
  return state.transactions.filter(t => {
    const d = toJakarta(t.end);
    if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return false;
    if (bid === "ALL") return true;
    if (t.branchId) return t.branchId === bid;
    const u = state.units.find(x => x.id === t.unitId);
    return u ? (u.branchId || getBranches()[0].id) === bid : false;
  }).reduce((a,t) => a + t.amount, 0);
}

function buildLaporanTrend(period, currentStart, branchId) {
  const bid = branchId || getLaporanBranchId();
  const year = currentStart.getFullYear(), month = currentStart.getMonth();
  const today = nowJakarta();
  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const days = isCurrentMonth ? today.getDate() : lastDay;
  let prevMonth = month - 1, prevYear = year;
  if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
  const prevLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();
  const labels = [], current = [], previous = [];
  for (let i = 1; i <= days; i++) {
    labels.push(String(i));
    current.push(sumByDateForLaporan(year, month, i, bid));
    previous.push(i <= prevLastDay ? sumByDateForLaporan(prevYear, prevMonth, i, bid) : 0);
  }
  return { labels, current, previous, prevYear, prevMonth };
}

  const data = window._labaRugiExport;
  if (!data || (!data.periodTx.length && !data.periodExpenses.length)) { flash("Tidak ada data untuk diekspor."); return; }
  const rows = [
    ...data.periodTx.map(t => ({ Tanggal: fmtDateID(t.end), Jenis: "Pendapatan", Cabang: t.branchName || getBranchName(t.branchId), Kategori: "Sewa " + t.unitName, Deskripsi: t.customerName, "Jumlah (Rp)": t.amount })),
    ...data.periodExpenses.map(e => ({ Tanggal: fmtDateID(e.date), Jenis: "Pengeluaran", Cabang: e.branchName || getBranchName(e.branchId), Kategori: e.category, Deskripsi: e.description || "-", "Jumlah (Rp)": -e.amount })),
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "TOTAL PENDAPATAN", "Jumlah (Rp)": data.totalRevenue },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "TOTAL PENGELUARAN", "Jumlah (Rp)": -data.totalExpense },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: "LABA/RUGI BERSIH", "Jumlah (Rp)": data.netProfit },
    { Tanggal: "", Jenis: "", Kategori: "", Deskripsi: `% LABA/RUGI: ${data.netProfit>=0?'+':'-'}${Math.abs(data.profitMarginPct||0).toFixed(1)}%`, "Jumlah (Rp)": "" },

}

// Tooltip chart dibuat sekali dan ditempel langsung ke <body>, BUKAN di
// dalam .rp-chart-box. Ini penting: .rp-chart-box pakai backdrop-filter,
// dan backdrop-filter/filter/transform pada elemen leluhur membuat
// position:fixed pada anak jadi "terkurung" di dalam kotak itu (bug CSS
// klasik), jadi tooltip salah posisi/ketutupan dan yang kelihatan cuma
// tooltip bawaan browser (angka tanggal doang dari atribut title SVG).
// Dengan ditempel ke body, posisinya selalu akurat mengikuti kursor.
function getTrendTooltipEl(){
  let tip = document.getElementById("rp-trend-tooltip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "rp-trend-tooltip";
    tip.style.cssText = "display:none;position:fixed;z-index:9999;pointer-events:none;max-width:260px;padding:9px 11px;border:1px solid var(--rp-border-strong);border-radius:8px;background:var(--rp-surface-solid);color:var(--rp-ink);box-shadow:0 14px 30px -14px var(--rp-elevation-shadow);font-size:11.5px;line-height:1.5;";
    document.body.appendChild(tip);
  }
  return tip;
}

function trendPointData(period, startMs, index) {
  const start = new Date(startMs);
  const year = start.getFullYear(), month = start.getMonth();
  const day = new Date(year, month, index + 1);
  const rangeStart = new Date(year, month, index + 1).getTime();
  const rangeEnd = new Date(year, month, index + 1, 23, 59, 59, 999).getTime();
  const visibleTx = getVisibleTransactions();
  const tx = visibleTx.filter(t => {
    const jt = toJakarta(t.end).getTime();
    return jt >= rangeStart && jt <= rangeEnd;
  });
  const total = tx.reduce((a,t) => a + t.amount, 0);

  let prevMonth = month - 1, prevYear = year;
  if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
  const prevLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();
  const dayNum = index + 1;
  const hasPrevDay = dayNum <= prevLastDay;
  let prevTotal = 0, prevTx = [];
  if (hasPrevDay) {
    const prStart = new Date(prevYear, prevMonth, dayNum).getTime();
    const prEnd = new Date(prevYear, prevMonth, dayNum, 23, 59, 59, 999).getTime();
    prevTx = visibleTx.filter(t => { const jt = toJakarta(t.end).getTime(); return jt >= prStart && jt <= prEnd; });
    prevTotal = prevTx.reduce((a,t) => a+t.amount, 0);
  }
  const diff = total - prevTotal;
  const diffPct = prevTotal > 0 ? (diff / prevTotal * 100) : (total > 0 ? 100 : 0);
  const prevLabel = hasPrevDay ? new Date(prevYear, prevMonth, dayNum).toLocaleDateString("id-ID", { day:"2-digit", month:"long", year:"numeric" }) : null;

  return {
    day, tx, total, hasPrevDay, prevTotal, prevTx, diff, diffPct, prevLabel,
    label: day.toLocaleDateString("id-ID", { weekday:"long", day:"2-digit", month:"long", year:"numeric" })
  };
}

function showTrendHover(period, startMs, index, clientX, clientY) {
  const tip = getTrendTooltipEl();
  const d = trendPointData(period, startMs, index);
  const cmpLine = d.hasPrevDay
    ? `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--rp-border);color:var(--rp-ink-dim);">
        vs ${esc(d.prevLabel)}: <span class="rp-mono">${rupiah(d.prevTotal)}</span>
        <span style="color:${d.diff>=0?'var(--rp-navy)':'var(--rp-red)'};font-weight:600;">${d.diff>=0?'▲':'▼'} ${Math.abs(d.diffPct).toFixed(1)}%</span>
      </div>`
    : `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--rp-border);color:var(--rp-ink-dim);">Belum ada data bulan lalu di tanggal ini</div>`;
  tip.innerHTML = `<strong>${esc(d.label)}</strong><br>${d.tx.length} transaksi · <span class="rp-mono">${rupiah(d.total)}</span>${cmpLine}`;
  tip.style.display = "block";
  const pad = 12;
  let x = Number(clientX) + 14, y = Number(clientY) + 14;
  const rect = tip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - pad) x = Math.max(pad, Number(clientX) - rect.width - 14);
  if (y + rect.height > window.innerHeight - pad) y = Math.max(pad, Number(clientY) - rect.height - 14);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
  window._trendHoverIndex = index;
}

function hideTrendHover() {
  const tip = document.getElementById("rp-trend-tooltip");
  if (tip) tip.style.display = "none";
  window._trendHoverIndex = null;
}

function handleTrendPointClick(period, startMs, index, clientX, clientY) {
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  if (isMobile) {
    if (window._trendMobileIndex === index) {
      window._trendMobileIndex = null;
      hideTrendHover();
      openTrendPointModal(period, startMs, index);
      return;
    }
    window._trendMobileIndex = index;
    showTrendHover(period, startMs, index, clientX, clientY);
    return;
  }
  openTrendPointModal(period, startMs, index);
}

function svgTrendChart(labels, series, period, startMs) {
  const w = 760, h = 240, padL = 72, padB = 34, padT = 16, padR = 16;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(1, ...allVals);
  const stepX = labels.length > 1 ? chartW / (labels.length - 1) : 0;
  const xFor = i => padL + stepX * i;
  const yFor = v => padT + chartH - (v / max) * chartH;

  let gridLines = "";
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const y = padT + chartH - (chartH * s / steps);
    const val = max * s / steps;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--rp-line)" stroke-width="1" />`;
    gridLines += `<text x="${padL-8}" y="${y+4}" font-family="var(--rp-mono)" font-size="10" fill="var(--rp-ink-dim)" text-anchor="end">${rupiah(val)}</text>`;
  }

  let defs = "", paths = "", dots = "";
  series.forEach((s, si) => {
    const points = s.values.map((v, i) => [xFor(i), yFor(v)]);
    const linePath = points.map((p, i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    if (s.filled) {
      const gradId = `rpTrendGrad${si}`;
      defs += `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="0.4" />
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0" />
      </linearGradient>`;
      const areaPath = `${linePath} L${points[points.length-1][0].toFixed(1)},${(padT+chartH).toFixed(1)} L${points[0][0].toFixed(1)},${(padT+chartH).toFixed(1)} Z`;
      paths += `<path d="${areaPath}" fill="url(#${gradId})" stroke="none" />`;
    }
    paths += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-dasharray="${s.dashed?"5,4":"0"}" stroke-linejoin="round" stroke-linecap="round" />`;
    points.forEach(p => { dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${s.color}" />`; });
  });

  let labelsSvg = "";
  labels.forEach((lab, i) => {
    labelsSvg += `<text x="${xFor(i).toFixed(1)}" y="${h-9}" font-family="var(--rp-mono)" font-size="${labels.length > 24 ? 9 : 10}" fill="var(--rp-ink)" text-anchor="middle">${esc(lab)}</text>`;
  });

  let hitAreas = "";
  if (period && startMs) {
    labels.forEach((lab, i) => {
      const cx = xFor(i);
      const bandLeft = i === 0 ? padL : (xFor(i-1) + cx) / 2;
      const bandRight = i === labels.length - 1 ? w - padR : (cx + xFor(i+1)) / 2;
      hitAreas += `<rect x="${bandLeft.toFixed(1)}" y="0" width="${(bandRight-bandLeft).toFixed(1)}" height="${h}" fill="transparent"
        style="cursor:pointer"
        onmouseenter="showTrendHover('${period}', ${startMs}, ${i}, event.clientX, event.clientY)"
        onmousemove="showTrendHover('${period}', ${startMs}, ${i}, event.clientX, event.clientY)"
        onmouseleave="hideTrendHover()"
        onclick="handleTrendPointClick('${period}', ${startMs}, ${i}, event.clientX, event.clientY)">
      </rect>`;
    });
  }

  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:680px;height:240px;display:block;">
      <defs>${defs}</defs>${gridLines}${paths}${dots}${labelsSvg}${hitAreas}
    </svg>
  </div>`;
}

/* --------------------- Shared bits --------------------- */
function emptyState(text) { return `<div class="rp-empty">${icon("info",15)} ${esc(text)}</div>`; }

function wireTabExtras() {
  const riwayatSearch = document.getElementById("riwayat-search");
  if (riwayatSearch) {
    riwayatSearch.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#riwayat-table tbody tr[data-name]").forEach(tr => {
        tr.style.display = tr.dataset.name.includes(q) ? "" : "none";
      });
    });
  }
  const memberSearch = document.getElementById("member-search");
  if (memberSearch) {
    memberSearch.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#member-table tbody tr[data-name]").forEach(tr => {
        tr.style.display = tr.dataset.name.includes(q) ? "" : "none";
      });
    });
  }
}

   Init
========================================================= */
currentUser=getCurrentUser();
preloadLoginDirectory().finally(()=>{
  const dirAdmin = (window._loginDirectory||{}).admin || DEFAULT_ADMIN;
  const isValidAdminSession = currentUser && currentUser.role==="admin" && currentUser.username===dirAdmin.username;
  const isValidKasirSession = currentUser && currentUser.role==="kasir" && currentUser.branchId
    && cashiersWithFallback((window._loginDirectory||{}).branches, (window._loginDirectory||{}).cashiers).some(c=>c.username===currentUser.username && c.branchId===currentUser.branchId);
  if (isValidAdminSession || isValidKasirSession) { touchLastActive(); startApp(); } else showLogin();
});
