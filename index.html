// Tooltip chart dibuat sekali dan ditempel langsung ke <body>, BUKAN di
// dalam .rp-chart-box. Ini penting: .rp-chart-box pakai backdrop-filter,
// dan backdrop-filter/filter/transform pada elemen leluhur membuat
// position:fixed pada anak jadi "terkurung" di dalam kotak itu (bug CSS
// klasik), jadi tooltip salah posisi/ketutupan dan yang kelihatan cuma
// tooltip bawaan browser (angka tanggal doang dari atribut title SVG).
// Dengan ditempel ke body, posisinya selalu akurat mengikuti kursor.
function getTrendTooltipEl(){
  let tip = document.getElementById("rp-trend-tooltip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "rp-trend-tooltip";
    tip.style.cssText = "display:none;position:fixed;z-index:9999;pointer-events:none;max-width:260px;padding:9px 11px;border:1px solid var(--rp-border-strong);border-radius:8px;background:var(--rp-surface-solid);color:var(--rp-ink);box-shadow:0 14px 30px -14px var(--rp-elevation-shadow);font-size:11.5px;line-height:1.5;";
    document.body.appendChild(tip);
  }
  return tip;
}

function trendPointData(period, startMs, index) {
  const start = new Date(startMs);
  const year = start.getFullYear(), month = start.getMonth();
  const day = new Date(year, month, index + 1);
  const rangeStart = new Date(year, month, index + 1).getTime();
  const rangeEnd = new Date(year, month, index + 1, 23, 59, 59, 999).getTime();
  const visibleTx = getVisibleTransactions();
  const tx = visibleTx.filter(t => {
    const jt = toJakarta(t.end).getTime();
    return jt >= rangeStart && jt <= rangeEnd;
  });
  const total = tx.reduce((a,t) => a + t.amount, 0);

  let prevMonth = month - 1, prevYear = year;
  if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
  const prevLastDay = new Date(prevYear, prevMonth + 1, 0).getDate();
  const dayNum = index + 1;
  const hasPrevDay = dayNum <= prevLastDay;
  let prevTotal = 0, prevTx = [];
  if (hasPrevDay) {
    const prStart = new Date(prevYear, prevMonth, dayNum).getTime();
    const prEnd = new Date(prevYear, prevMonth, dayNum, 23, 59, 59, 999).getTime();
    prevTx = visibleTx.filter(t => { const jt = toJakarta(t.end).getTime(); return jt >= prStart && jt <= prEnd; });
    prevTotal = prevTx.reduce((a,t) => a+t.amount, 0);
  }
  const diff = total - prevTotal;
  const diffPct = prevTotal > 0 ? (diff / prevTotal * 100) : (total > 0 ? 100 : 0);
  const prevLabel = hasPrevDay ? new Date(prevYear, prevMonth, dayNum).toLocaleDateString("id-ID", { day:"2-digit", month:"long", year:"numeric" }) : null;

  return {
    day, tx, total, hasPrevDay, prevTotal, prevTx, diff, diffPct, prevLabel,
    label: day.toLocaleDateString("id-ID", { weekday:"long", day:"2-digit", month:"long", year:"numeric" })
  };
}

function showTrendHover(period, startMs, index, clientX, clientY) {
  const tip = getTrendTooltipEl();
  const d = trendPointData(period, startMs, index);
  const cmpLine = d.hasPrevDay
    ? `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--rp-border);color:var(--rp-ink-dim);">
        vs ${esc(d.prevLabel)}: <span class="rp-mono">${rupiah(d.prevTotal)}</span>
        <span style="color:${d.diff>=0?'var(--rp-navy)':'var(--rp-red)'};font-weight:600;">${d.diff>=0?'▲':'▼'} ${Math.abs(d.diffPct).toFixed(1)}%</span>
      </div>`
    : `<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--rp-border);color:var(--rp-ink-dim);">Belum ada data bulan lalu di tanggal ini</div>`;
  tip.innerHTML = `<strong>${esc(d.label)}</strong><br>${d.tx.length} transaksi · <span class="rp-mono">${rupiah(d.total)}</span>${cmpLine}`;
  tip.style.display = "block";
  const pad = 12;
  let x = Number(clientX) + 14, y = Number(clientY) + 14;
  const rect = tip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - pad) x = Math.max(pad, Number(clientX) - rect.width - 14);
  if (y + rect.height > window.innerHeight - pad) y = Math.max(pad, Number(clientY) - rect.height - 14);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
  window._trendHoverIndex = index;
}

function hideTrendHover() {
  const tip = document.getElementById("rp-trend-tooltip");
  if (tip) tip.style.display = "none";
  window._trendHoverIndex = null;
}

function handleTrendPointClick(period, startMs, index, clientX, clientY) {
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  if (isMobile) {
    if (window._trendMobileIndex === index) {
      window._trendMobileIndex = null;
      hideTrendHover();
      openTrendPointModal(period, startMs, index);
      return;
    }
    window._trendMobileIndex = index;
    showTrendHover(period, startMs, index, clientX, clientY);
    return;
  }
  openTrendPointModal(period, startMs, index);
}

function svgTrendChart(labels, series, period, startMs) {
  const w = 760, h = 240, padL = 72, padB = 34, padT = 16, padR = 16;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = series.flatMap(s => s.values);
  const max = Math.max(1, ...allVals);
  const stepX = labels.length > 1 ? chartW / (labels.length - 1) : 0;
  const xFor = i => padL + stepX * i;
  const yFor = v => padT + chartH - (v / max) * chartH;

  let gridLines = "";
  const steps = 4;
  for (let s = 0; s <= steps; s++) {
    const y = padT + chartH - (chartH * s / steps);
    const val = max * s / steps;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--rp-line)" stroke-width="1" />`;
    gridLines += `<text x="${padL-8}" y="${y+4}" font-family="var(--rp-mono)" font-size="10" fill="var(--rp-ink-dim)" text-anchor="end">${rupiah(val)}</text>`;
  }

  let defs = "", paths = "", dots = "";
  series.forEach((s, si) => {
    const points = s.values.map((v, i) => [xFor(i), yFor(v)]);
    const linePath = points.map((p, i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    if (s.filled) {
      const gradId = `rpTrendGrad${si}`;
      defs += `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity="0.4" />
        <stop offset="100%" stop-color="${s.color}" stop-opacity="0" />
      </linearGradient>`;
      const areaPath = `${linePath} L${points[points.length-1][0].toFixed(1)},${(padT+chartH).toFixed(1)} L${points[0][0].toFixed(1)},${(padT+chartH).toFixed(1)} Z`;
      paths += `<path d="${areaPath}" fill="url(#${gradId})" stroke="none" />`;
    }
    paths += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-dasharray="${s.dashed?"5,4":"0"}" stroke-linejoin="round" stroke-linecap="round" />`;
    points.forEach(p => { dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${s.color}" />`; });
  });

  let labelsSvg = "";
  labels.forEach((lab, i) => {
    labelsSvg += `<text x="${xFor(i).toFixed(1)}" y="${h-9}" font-family="var(--rp-mono)" font-size="${labels.length > 24 ? 9 : 10}" fill="var(--rp-ink)" text-anchor="middle">${esc(lab)}</text>`;
  });

  let hitAreas = "";
  if (period && startMs) {
    labels.forEach((lab, i) => {
      const cx = xFor(i);
      const bandLeft = i === 0 ? padL : (xFor(i-1) + cx) / 2;
      const bandRight = i === labels.length - 1 ? w - padR : (cx + xFor(i+1)) / 2;
      hitAreas += `<rect x="${bandLeft.toFixed(1)}" y="0" width="${(bandRight-bandLeft).toFixed(1)}" height="${h}" fill="transparent"
        style="cursor:pointer"
        onmouseenter="showTrendHover('${period}', ${startMs}, ${i}, event.clientX, event.clientY)"
        onmousemove="showTrendHover('${period}', ${startMs}, ${i}, event.clientX, event.clientY)"
        onmouseleave="hideTrendHover()"
        onclick="handleTrendPointClick('${period}', ${startMs}, ${i}, event.clientX, event.clientY)">
      </rect>`;
    });
  }

  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:680px;height:240px;display:block;">
      <defs>${defs}</defs>${gridLines}${paths}${dots}${labelsSvg}${hitAreas}
    </svg>
  </div>`;
}

/* --------------------- Chart-chart Laba-Rugi (investor-grade) ---------------------
   4 chart tambahan khusus halaman Laba-Rugi supaya lebih "investor-grade":
   1) Tren harian pendapatan vs pengeluaran vs laba bersih (area/line)
   2) Waterfall: Pendapatan -> tiap kategori pengeluaran -> Laba Bersih
   3) Donut breakdown pengeluaran per kategori
   4) Bar MoM: pendapatan/pengeluaran/laba bulan ini vs bulan lalu
   Bonus: bar kontribusi laba per cabang (muncul otomatis kalau lihat "Semua Cabang"
   dan cabangnya lebih dari satu). */

const RP_CHART_PALETTE = ['var(--rp-red)','var(--rp-amber)','var(--rp-navy)','var(--rp-navy-soft)','var(--rp-teal)','#B98BD9','#5CA8D6','#D98BB0'];

// ---- Hover tooltip untuk chart Laba-Rugi — konsepnya sama persis kayak chart
// tren di halaman Laporan (svgTrendChart): satu tooltip "melayang" yang
// ditempel ke <body> (dipakai bareng lewat getTrendTooltipEl/hideTrendHover
// yang sudah ada), ngikutin posisi kursor, dan di mobile jadi tap-untuk-buka
// / tap-lagi-untuk-tutup (bukan modal, karena chart ini ringkasan saja).
// Escape aman untuk string yang disisipkan ke dalam literal JS ber-kutip
// tunggal di atribut inline (onclick="...('...')"), dipakai untuk nama
// kategori/cabang yang mungkin mengandung tanda kutip.
function escJsAttr(s) { return esc(String(s ?? "")).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function showRpTip(html, clientX, clientY) {
  const tip = getTrendTooltipEl();
  tip.innerHTML = html;
  tip.style.display = "block";
  const pad = 12;
  let x = Number(clientX) + 14, y = Number(clientY) + 14;
  const rect = tip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - pad) x = Math.max(pad, Number(clientX) - rect.width - 14);
  if (y + rect.height > window.innerHeight - pad) y = Math.max(pad, Number(clientY) - rect.height - 14);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}
function hideRpTip() { hideTrendHover(); }
function handleRpTipTap(key, html, clientX, clientY) {
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  if (!isMobile) return;
  if (window._rpTipKey === key) { window._rpTipKey = null; hideRpTip(); return; }
  window._rpTipKey = key;
  showRpTip(html, clientX, clientY);
}

function labaRugiTrendTipHtml(label, revenue, expense, profit) {
  const pColor = profit >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)';
  return `<strong>Tanggal ${esc(label)}</strong><br>
    <span style="color:var(--rp-navy)">●</span> Pendapatan: <span class="rp-mono">${rupiah(revenue)}</span><br>
    <span style="color:var(--rp-red)">●</span> Pengeluaran: <span class="rp-mono">${rupiah(expense)}</span><br>
    <span style="color:${pColor}">●</span> Laba bersih: <span class="rp-mono" style="color:${pColor};font-weight:600;">${rupiah(profit)}</span>`;
}
function showLabaRugiTrendHover(label, revenue, expense, profit, clientX, clientY) { showRpTip(labaRugiTrendTipHtml(label,revenue,expense,profit), clientX, clientY); }
function tapLabaRugiTrendHover(label, revenue, expense, profit, clientX, clientY) { handleRpTipTap(`lrtrend-${label}`, labaRugiTrendTipHtml(label,revenue,expense,profit), clientX, clientY); }

function waterfallTipHtml(label, value, isDecrease) {
  const color = isDecrease ? 'var(--rp-red)' : (value >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)');
  const sign = isDecrease ? '-' : '';
  return `<strong>${esc(label)}</strong><br><span class="rp-mono" style="color:${color};font-weight:600;">${sign}${rupiah(Math.abs(value))}</span>`;
}
function showWaterfallHover(label, value, isDecrease, clientX, clientY) { showRpTip(waterfallTipHtml(label,value,isDecrease), clientX, clientY); }
function tapWaterfallHover(label, value, isDecrease, clientX, clientY) { handleRpTipTap(`wf-${label}`, waterfallTipHtml(label,value,isDecrease), clientX, clientY); }

function donutTipHtml(category, amount, pct) {
  return `<strong>${esc(category)}</strong><br><span class="rp-mono">${rupiah(amount)}</span> · ${pct.toFixed(1)}% dari total pengeluaran`;
}
function showDonutHover(category, amount, pct, clientX, clientY) { showRpTip(donutTipHtml(category,amount,pct), clientX, clientY); }
function tapDonutHover(category, amount, pct, clientX, clientY) { handleRpTipTap(`donut-${category}`, donutTipHtml(category,amount,pct), clientX, clientY); }

function momTipHtml(groupLabel, periodLabel, value) {
  return `<strong>${esc(groupLabel)}</strong><br>${esc(periodLabel)}: <span class="rp-mono" style="font-weight:600;">${rupiah(value)}</span>`;
}
function showMoMHover(groupLabel, periodLabel, value, clientX, clientY) { showRpTip(momTipHtml(groupLabel,periodLabel,value), clientX, clientY); }
function tapMoMHover(groupLabel, periodLabel, value, clientX, clientY) { handleRpTipTap(`mom-${groupLabel}-${periodLabel}`, momTipHtml(groupLabel,periodLabel,value), clientX, clientY); }

function branchProfitTipHtml(name, profit) {
  const color = profit >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)';
  return `<strong>${esc(name)}</strong><br>Laba bersih: <span class="rp-mono" style="color:${color};font-weight:600;">${rupiah(profit)}</span>`;
}
function showBranchProfitHover(name, profit, clientX, clientY) { showRpTip(branchProfitTipHtml(name,profit), clientX, clientY); }
function tapBranchProfitHover(name, profit, clientX, clientY) { handleRpTipTap(`branch-${name}`, branchProfitTipHtml(name,profit), clientX, clientY); }

function buildLabaRugiDailyTrend(start, periodTx, periodExpenses) {
  const days = new Date(start.getFullYear(), start.getMonth() + 1, 0).getDate();
  const revenuePerDay = new Array(days).fill(0);
  const expensePerDay = new Array(days).fill(0);
  periodTx.forEach(t => { const d = toJakarta(t.end).getDate(); if (d >= 1 && d <= days) revenuePerDay[d-1] += Number(t.amount||0); });
  periodExpenses.forEach(e => { const d = toJakarta(e.date).getDate(); if (d >= 1 && d <= days) expensePerDay[d-1] += Number(e.amount||0); });
  const profitPerDay = revenuePerDay.map((v,i) => v - expensePerDay[i]);
  const labels = Array.from({length: days}, (_,i) => String(i+1));
  return { labels, revenuePerDay, expensePerDay, profitPerDay };
}

function buildExpenseCategoryBreakdown(periodExpenses, maxCategories = 5) {
  const map = {};
  periodExpenses.forEach(e => {
    const key = e.category || 'Lainnya';
    map[key] = (map[key]||0) + Number(e.amount||0);
  });
  let arr = Object.entries(map).map(([category,amount]) => ({category,amount})).sort((a,b)=>b.amount-a.amount);
  if (arr.length > maxCategories) {
    const top = arr.slice(0, maxCategories);
    const restTotal = arr.slice(maxCategories).reduce((a,c)=>a+c.amount,0);
    top.push({ category: 'Lainnya', amount: restTotal });
    arr = top;
  }
  return arr.map((c,i) => ({ ...c, color: RP_CHART_PALETTE[i % RP_CHART_PALETTE.length] }));
}

function filterTxByBranchId(txs, bid) {
  if (bid === "ALL") return txs;
  return txs.filter(t => {
    if (t.branchId) return t.branchId === bid;
    const u = state.units.find(x => x.id === t.unitId);
    return u ? (u.branchId || getBranches()[0].id) === bid : false;
  });
}

function computeLabaRugiTotalsForRange(start, end, bid) {
  const tx = filterTxByBranchId(state.transactions, bid).filter(t => {
    const jt = toJakarta(t.end).getTime();
    return jt >= start.getTime() && jt <= end.getTime();
  });
  const expenses = state.expenses.filter(e => {
    const d = toJakarta(e.date).getTime();
    const eb = e.branchId || getBranches()[0].id;
    return d >= start.getTime() && d <= end.getTime() && (bid === "ALL" || eb === bid);
  });
  const totalRevenue = tx.reduce((a,t)=>a+Number(t.amount||0),0);
  const totalExpense = expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  return { tx, expenses, totalRevenue, totalExpense, netProfit: totalRevenue - totalExpense };
}

function getPrevMonthRange(start) {
  let prevMonth = start.getMonth() - 1, prevYear = start.getFullYear();
  if (prevMonth < 0) { prevMonth = 11; prevYear -= 1; }
  const pStart = new Date(prevYear, prevMonth, 1);
  const pEnd = new Date(prevYear, prevMonth + 1, 0, 23, 59, 59, 999);
  const label = pStart.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  return { start: pStart, end: pEnd, label };
}

function buildBranchProfitBreakdown(periodTx, periodExpenses) {
  const map = {};
  const ensure = (id, name) => { if (!map[id]) map[id] = { name, revenue: 0, expense: 0 }; return map[id]; };
  periodTx.forEach(t => {
    let bId = t.branchId;
    if (!bId) { const u = state.units.find(x => x.id === t.unitId); bId = u ? (u.branchId || getBranches()[0].id) : getBranches()[0].id; }
    ensure(bId, t.branchName || getBranchName(bId)).revenue += Number(t.amount||0);
  });
  periodExpenses.forEach(e => {
    const bId = e.branchId || getBranches()[0].id;
    ensure(bId, e.branchName || getBranchName(bId)).expense += Number(e.amount||0);
  });
  return Object.values(map).map(b => ({ ...b, profit: b.revenue - b.expense })).sort((a,b) => b.profit - a.profit);
}

// Chart 1: line/area — pendapatan vs pengeluaran vs laba bersih per hari.
function svgLabaRugiTrendChart(labels, revenuePerDay, expensePerDay, profitPerDay) {
  const series = [
    { label: 'Pendapatan', values: revenuePerDay, color: 'var(--rp-navy)', filled: true },
    { label: 'Pengeluaran', values: expensePerDay, color: 'var(--rp-red)' },
    { label: 'Laba bersih', values: profitPerDay, color: 'var(--rp-teal)', dashed: true },
  ];
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  const w = isMobile ? 330 : 760, h = isMobile ? 220 : 260;
  const padL = isMobile ? 46 : 80, padB = isMobile ? 26 : 34, padT = isMobile ? 14 : 16, padR = isMobile ? 8 : 16;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = series.flatMap(s => s.values);
  let max = Math.max(0, ...allVals), min = Math.min(0, ...allVals);
  if (max === min) max += 1;
  const range = max - min;
  const stepX = labels.length > 1 ? chartW / (labels.length - 1) : 0;
  const xFor = i => padL + stepX * i;
  const yFor = v => padT + chartH - ((v - min) / range) * chartH;
  const zeroY = yFor(0);
  const fmtY = isMobile ? rupiahCompact : rupiah;
  const gridFont = isMobile ? 8 : 10;
  const labFont = isMobile ? 8 : 10;

  let gridLines = "";
  const gsteps = 4;
  for (let s = 0; s <= gsteps; s++) {
    const val = min + (range * s / gsteps);
    const y = yFor(val);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--rp-line)" stroke-width="1" />`;
    gridLines += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-family="var(--rp-mono)" font-size="${gridFont}" fill="var(--rp-ink-dim)" text-anchor="end">${fmtY(val)}</text>`;
  }
  if (min < 0) gridLines += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--rp-ink-dim)" stroke-width="1" stroke-dasharray="3,3" />`;

  // Dihitung duluan (sebelum loop titik) karena dipakai juga buat nentuin
  // titik mana yang dikasih label angka kecil — biar konsisten sama tanggal
  // yang ditampilkan di sumbu-X dan nggak dempet-dempetan.
  const targetLabels = isMobile ? 5 : 15;
  const skip = labels.length > targetLabels ? Math.ceil(labels.length/targetLabels) : 1;
  const showPoint = i => i % skip === 0 || i === labels.length-1;
  const valFont = isMobile ? 5.5 : 6.5;

  let defs = "", paths = "", dots = "", hitDots = "", pointLabels = "";
  series.forEach((s, si) => {
    const points = s.values.map((v,i) => [xFor(i), yFor(v)]);
    const linePath = points.map((p,i) => `${i===0?"M":"L"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    if (s.filled) {
      const gradId = `rpLrGrad${si}`;
      defs += `<linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.color}" stop-opacity="0.35" /><stop offset="100%" stop-color="${s.color}" stop-opacity="0" /></linearGradient>`;
      const areaPath = `${linePath} L${points[points.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${points[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`;
      paths += `<path d="${areaPath}" fill="url(#${gradId})" stroke="none" />`;
    }
    paths += `<path d="${linePath}" fill="none" stroke="${s.color}" stroke-width="${isMobile?2:2.5}" stroke-dasharray="${s.dashed?"5,4":"0"}" stroke-linejoin="round" stroke-linecap="round" />`;
    points.forEach((p,i) => {
      dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isMobile?1.8:2.2}" fill="${s.color}" pointer-events="none" />`;
      if (showPoint(i)) {
        // Label naik/turun bergantian per seri (si) biar 3 garis yang
        // berdekatan nilainya nggak numpuk teksnya satu sama lain.
        const ly = p[1] - 5 - si*7;
        pointLabels += `<text x="${p[0].toFixed(1)}" y="${ly.toFixed(1)}" font-family="var(--rp-mono)" font-size="${valFont}" fill="${s.color}" text-anchor="middle" pointer-events="none">${fmtY(s.values[i])}</text>`;
      }
      hitDots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isMobile?7:8}" fill="transparent" style="cursor:pointer"
        onmouseenter="showLabaRugiTrendHover('${escJsAttr(labels[i])}', ${revenuePerDay[i]}, ${expensePerDay[i]}, ${profitPerDay[i]}, event.clientX, event.clientY)"
        onmousemove="showLabaRugiTrendHover('${escJsAttr(labels[i])}', ${revenuePerDay[i]}, ${expensePerDay[i]}, ${profitPerDay[i]}, event.clientX, event.clientY)"
        onmouseleave="hideRpTip()"
        onclick="tapLabaRugiTrendHover('${escJsAttr(labels[i])}', ${revenuePerDay[i]}, ${expensePerDay[i]}, ${profitPerDay[i]}, event.clientX, event.clientY)" />`;
    });
  });

  // Di HP label tanggal di sumbu-X dipangkas jauh lebih ketat (target ~5 label
  // yang kebaca) dibanding versi desktop (bisa sampai ~15 label), supaya tidak
  // dempet-dempetan di layar sempit.
  let labelsSvg = "";
  labels.forEach((lab,i) => {
    if (!showPoint(i)) return;
    labelsSvg += `<text x="${xFor(i).toFixed(1)}" y="${h-9}" font-family="var(--rp-mono)" font-size="${labFont}" fill="var(--rp-ink)" text-anchor="middle">${esc(lab)}</text>`;
  });

  if (isMobile) {
    return `<div style="width:100%;">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
        <defs>${defs}</defs>${gridLines}${paths}${dots}${pointLabels}${labelsSvg}${hitDots}
      </svg>
    </div>`;
  }
  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:680px;height:260px;display:block;">
      <defs>${defs}</defs>${gridLines}${paths}${dots}${pointLabels}${labelsSvg}${hitDots}
    </svg>
  </div>`;
}

// Chart 2: waterfall — Pendapatan -> tiap kategori pengeluaran -> Laba Bersih.
function svgWaterfallChart(totalRevenue, categories, netProfit) {
  const steps = [{ label: 'Pendapatan', from: 0, to: totalRevenue, color: 'var(--rp-navy)' }];
  let running = totalRevenue;
  categories.forEach(c => {
    const to = running - c.amount;
    steps.push({ label: c.category, from: to, to: running, color: c.color, amount: c.amount });
    running = to;
  });
  steps.push({ label: 'Laba Bersih', from: 0, to: netProfit, color: netProfit >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)' });

  // Di HP viewBox-nya dibikin lebih "ramping" (bukan cuma di-scale-down dari
  // versi desktop) — bar, jarak antar-bar, dan font ikut mengecil proporsional
  // supaya semuanya pas dalam lebar layar tanpa perlu digeser.
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  const w = isMobile ? 330 : 760, h = isMobile ? 260 : 300;
  const padL = isMobile ? 50 : 80, padB = isMobile ? 52 : 58, padT = isMobile ? 22 : 26, padR = isMobile ? 8 : 16;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = steps.flatMap(s => [s.from, s.to]);
  let max = Math.max(0, ...allVals), min = Math.min(0, ...allVals);
  if (max === min) max += 1;
  const range = max - min;
  const yFor = v => padT + chartH - ((v-min)/range) * chartH;
  const n = steps.length;
  const bandW = chartW / n;
  const barW = isMobile ? Math.max(14, Math.min(26, bandW * 0.5)) : Math.min(56, bandW * 0.55);
  const fmtY = isMobile ? rupiahCompact : rupiah;
  const gridFont = isMobile ? 8 : 10;
  const valFont = isMobile ? 8.5 : 10.5;
  const labFont = isMobile ? 8 : 10;

  let gridLines = "";
  const gsteps = 4;
  for (let s = 0; s <= gsteps; s++) {
    const val = min + range * s / gsteps;
    const y = yFor(val);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--rp-line)" stroke-width="1" />`;
    gridLines += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-family="var(--rp-mono)" font-size="${gridFont}" fill="var(--rp-ink-dim)" text-anchor="end">${fmtY(val)}</text>`;
  }
  const zeroY = yFor(0);
  gridLines += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--rp-border-strong)" stroke-width="1" />`;

  let bars = "", connectors = "", labelsSvg = "";
  steps.forEach((s,i) => {
    const cx = padL + bandW*i + bandW/2;
    const top = yFor(Math.max(s.from, s.to));
    const bottom = yFor(Math.min(s.from, s.to));
    const hgt = Math.max(1, bottom - top);
    const isDecrease = i > 0 && i < steps.length - 1;
    bars += `<rect x="${(cx-barW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${s.color}" style="cursor:pointer"
      onmouseenter="showWaterfallHover('${escJsAttr(s.label)}', ${s.to-s.from}, ${isDecrease}, event.clientX, event.clientY)"
      onmousemove="showWaterfallHover('${escJsAttr(s.label)}', ${s.to-s.from}, ${isDecrease}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapWaterfallHover('${escJsAttr(s.label)}', ${s.to-s.from}, ${isDecrease}, event.clientX, event.clientY)" />`;
    const valLabel = (i===0 || i===steps.length-1) ? fmtY(s.to) : `-${fmtY(s.amount)}`;
    labelsSvg += `<text x="${cx.toFixed(1)}" y="${Math.max(14,top-8).toFixed(1)}" font-family="var(--rp-mono)" font-size="${valFont}" fill="var(--rp-ink)" text-anchor="middle" font-weight="600">${esc(valLabel)}</text>`;
    // Label dimiringkan (bukan dipotong pakai "…") biar nama kategori yang
    // panjang tetap kebaca utuh walau ruang di bawah tiap bar sempit.
    const labX = cx, labY = h - padB + 14;
    labelsSvg += `<text x="${labX.toFixed(1)}" y="${labY.toFixed(1)}" font-family="var(--rp-sans)" font-size="${labFont}" fill="var(--rp-ink-dim)" text-anchor="end" transform="rotate(-38 ${labX.toFixed(1)} ${labY.toFixed(1)})">${esc(s.label)}</text>`;
    if (i > 0) {
      const prevCx = padL + bandW*(i-1) + bandW/2;
      const prevY = yFor(steps[i-1].to);
      connectors += `<line x1="${(prevCx+barW/2).toFixed(1)}" y1="${prevY.toFixed(1)}" x2="${(cx-barW/2).toFixed(1)}" y2="${prevY.toFixed(1)}" stroke="var(--rp-border-strong)" stroke-width="1" stroke-dasharray="3,3" />`;
    }
  });

  if (isMobile) {
    return `<div style="width:100%;">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
        ${gridLines}${connectors}${bars}${labelsSvg}
      </svg>
    </div>`;
  }
  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:680px;height:300px;display:block;">
      ${gridLines}${connectors}${bars}${labelsSvg}
    </svg>
  </div>`;
}

// Chart 3: donut — komposisi pengeluaran per kategori.
function svgExpenseDonutChart(categories, totalExpense) {
  const cx = 100, cy = 100, r = 78, strokeW = 30;
  const circumference = 2 * Math.PI * r;
  let cum = 0, arcs = "";
  categories.forEach(c => {
    const frac = totalExpense > 0 ? c.amount / totalExpense : 0;
    const dash = frac * circumference;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="${strokeW}"
      stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}"
      stroke-dashoffset="${(-cum).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" style="cursor:pointer"
      onmouseenter="showDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${(frac*100).toFixed(2)}, event.clientX, event.clientY)"
      onmousemove="showDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${(frac*100).toFixed(2)}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${(frac*100).toFixed(2)}, event.clientX, event.clientY)" />`;
    cum += dash;
  });
  const centerLabel = `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="var(--rp-mono)" font-size="10.5" fill="var(--rp-ink-dim)">Total biaya</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="var(--rp-mono)" font-size="12.5" font-weight="700" fill="var(--rp-ink)">${rupiah(totalExpense)}</text>`;
  const legend = categories.map(c => {
    const pct = totalExpense > 0 ? (c.amount/totalExpense*100) : 0;
    return `<div class="rp-legend-item" style="cursor:pointer"
      onmouseenter="showDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${pct.toFixed(2)}, event.clientX, event.clientY)"
      onmousemove="showDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${pct.toFixed(2)}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapDonutHover('${escJsAttr(c.category)}', ${c.amount}, ${pct.toFixed(2)}, event.clientX, event.clientY)"
      ><span class="rp-legend-swatch" style="background:${c.color};height:10px;width:10px;border-radius:50%;"></span>${esc(c.category)} — <span class="rp-mono">${rupiah(c.amount)}</span> (${pct.toFixed(1)}%)</div>`;
  }).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:flex-start;">
    <svg viewBox="0 0 200 200" style="width:190px;height:190px;flex-shrink:0;">${arcs}${centerLabel}</svg>
    <div class="rp-donut-legend">${legend}</div>
  </div>`;
}

// Chart 4: bar berdampingan — pendapatan/pengeluaran/laba bulan ini vs bulan lalu.
function svgMoMBarChart(current, previous, currentLabel, previousLabel) {
  const groups = [
    { label: 'Pendapatan', cur: current.totalRevenue, prev: previous.totalRevenue, curColor: 'var(--rp-navy)' },
    { label: 'Pengeluaran', cur: current.totalExpense, prev: previous.totalExpense, curColor: 'var(--rp-red)' },
    { label: 'Laba Bersih', cur: current.netProfit, prev: previous.netProfit, curColor: current.netProfit >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)' },
  ];
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  const w = isMobile ? 330 : 760, h = isMobile ? 240 : 280;
  const padL = isMobile ? 48 : 80, padB = isMobile ? 34 : 48, padT = isMobile ? 16 : 20, padR = isMobile ? 8 : 16;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const allVals = groups.flatMap(g => [g.cur, g.prev]);
  let max = Math.max(0, ...allVals), min = Math.min(0, ...allVals);
  if (max === min) max += 1;
  const range = max - min;
  const yFor = v => padT + chartH - ((v-min)/range) * chartH;
  const zeroY = yFor(0);
  const n = groups.length;
  const bandW = chartW / n;
  const barW = isMobile ? Math.max(12, Math.min(28, bandW * 0.3)) : Math.min(64, bandW * 0.28);
  const gap = isMobile ? 5 : 10;
  const fmtY = isMobile ? rupiahCompact : rupiah;
  const gridFont = isMobile ? 8 : 10;
  const labFont = isMobile ? 9 : 11;

  let gridLines = "";
  const gsteps = 4;
  for (let s = 0; s <= gsteps; s++) {
    const val = min + range * s / gsteps;
    const y = yFor(val);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--rp-line)" stroke-width="1" />`;
    gridLines += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-family="var(--rp-mono)" font-size="${gridFont}" fill="var(--rp-ink-dim)" text-anchor="end">${fmtY(val)}</text>`;
  }
  gridLines += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--rp-border-strong)" stroke-width="1" />`;

  let bars = "", labelsSvg = "";
  groups.forEach((g,i) => {
    const bandCx = padL + bandW*i + bandW/2;
    const prevX = bandCx - gap/2 - barW;
    const curX = bandCx + gap/2;
    const prevTop = yFor(Math.max(g.prev,0)), prevBottom = yFor(Math.min(g.prev,0));
    const curTop = yFor(Math.max(g.cur,0)), curBottom = yFor(Math.min(g.cur,0));
    bars += `<rect x="${prevX.toFixed(1)}" y="${prevTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,prevBottom-prevTop).toFixed(1)}" rx="3" fill="var(--rp-ink-dim)" opacity="0.55" style="cursor:pointer"
      onmouseenter="showMoMHover('${escJsAttr(g.label)}', '${escJsAttr(previousLabel)}', ${g.prev}, event.clientX, event.clientY)"
      onmousemove="showMoMHover('${escJsAttr(g.label)}', '${escJsAttr(previousLabel)}', ${g.prev}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapMoMHover('${escJsAttr(g.label)}', '${escJsAttr(previousLabel)}', ${g.prev}, event.clientX, event.clientY)" />`;
    bars += `<rect x="${curX.toFixed(1)}" y="${curTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,curBottom-curTop).toFixed(1)}" rx="3" fill="${g.curColor}" style="cursor:pointer"
      onmouseenter="showMoMHover('${escJsAttr(g.label)}', '${escJsAttr(currentLabel)}', ${g.cur}, event.clientX, event.clientY)"
      onmousemove="showMoMHover('${escJsAttr(g.label)}', '${escJsAttr(currentLabel)}', ${g.cur}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapMoMHover('${escJsAttr(g.label)}', '${escJsAttr(currentLabel)}', ${g.cur}, event.clientX, event.clientY)" />`;
    labelsSvg += `<text x="${bandCx.toFixed(1)}" y="${h-padB+20}" font-family="var(--rp-sans)" font-size="${labFont}" fill="var(--rp-ink)" text-anchor="middle" font-weight="600">${esc(g.label)}</text>`;
  });

  if (isMobile) {
    return `<div style="width:100%;">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
        ${gridLines}${bars}${labelsSvg}
      </svg>
    </div>`;
  }
  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:600px;height:280px;display:block;">
      ${gridLines}${bars}${labelsSvg}
    </svg>
  </div>`;
}

// Bonus: bar kontribusi laba per cabang (khusus tampilan "Semua Cabang", multi-cabang).
function svgBranchProfitBarChart(branchData) {
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 720px)").matches;
  const w = isMobile ? 330 : 760, rowH = isMobile ? 32 : 40;
  const padL = isMobile ? 92 : 170, padR = isMobile ? 66 : 100, padT = isMobile ? 10 : 14, padB = isMobile ? 10 : 14;
  const h = padT + padB + rowH * branchData.length;
  const chartW = w - padL - padR;
  const allVals = branchData.flatMap(b => [b.profit, 0]);
  let max = Math.max(0, ...allVals), min = Math.min(0, ...allVals);
  if (max === min) max += 1;
  const range = max - min;
  const xFor = v => padL + ((v-min)/range) * chartW;
  const zeroX = xFor(0);
  const fmtLabel = isMobile ? rupiahCompact : rupiah;
  const nameFont = isMobile ? 9.5 : 11;
  const valFont = isMobile ? 9.5 : 11;
  const barH = isMobile ? 16 : 20;
  const nameMaxChars = isMobile ? 11 : 999;

  let bars = "", labelsSvg = "";
  const gridLines = `<line x1="${zeroX.toFixed(1)}" y1="${padT}" x2="${zeroX.toFixed(1)}" y2="${h-padB}" stroke="var(--rp-border-strong)" stroke-width="1" />`;
  branchData.forEach((b,i) => {
    const y = padT + rowH*i + rowH*0.5;
    const barTop = y - barH/2;
    const x1 = Math.min(zeroX, xFor(b.profit)), x2 = Math.max(zeroX, xFor(b.profit));
    const color = b.profit >= 0 ? 'var(--rp-teal)' : 'var(--rp-red)';
    bars += `<rect x="${x1.toFixed(1)}" y="${barTop.toFixed(1)}" width="${Math.max(1,x2-x1).toFixed(1)}" height="${barH}" rx="3" fill="${color}" style="cursor:pointer"
      onmouseenter="showBranchProfitHover('${escJsAttr(b.name)}', ${b.profit}, event.clientX, event.clientY)"
      onmousemove="showBranchProfitHover('${escJsAttr(b.name)}', ${b.profit}, event.clientX, event.clientY)"
      onmouseleave="hideRpTip()"
      onclick="tapBranchProfitHover('${escJsAttr(b.name)}', ${b.profit}, event.clientX, event.clientY)" />`;
    const nameLab = b.name.length > nameMaxChars ? b.name.slice(0,nameMaxChars-1)+'…' : b.name;
    labelsSvg += `<text x="${padL-10}" y="${(y+4).toFixed(1)}" font-family="var(--rp-sans)" font-size="${nameFont}" fill="var(--rp-ink)" text-anchor="end">${esc(nameLab)}</text>`;
    // Label nominal selalu ditaruh di kolom kanan tetap (di luar area bar),
    // bukan nempel ke ujung bar — supaya untuk bar negatif yang pendek
    // (dekat garis nol) labelnya tidak tabrakan dengan nama cabang di kiri.
    labelsSvg += `<text x="${(w-padR+12).toFixed(1)}" y="${(y+4).toFixed(1)}" font-family="var(--rp-mono)" font-size="${valFont}" font-weight="600" fill="${color}" text-anchor="start">${fmtLabel(b.profit)}</text>`;
  });

  if (isMobile) {
    return `<div style="width:100%;">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
        ${gridLines}${bars}${labelsSvg}
      </svg>
    </div>`;
  }
  return `<div style="overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;">
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:520px;height:${h}px;display:block;">
      ${gridLines}${bars}${labelsSvg}
    </svg>
  </div>`;
}

/* --------------------- Shared bits --------------------- */
function emptyState(text) { return `<div class="rp-empty">${icon("info",15)} ${esc(text)}</div>`; }

function wireTabExtras() {
  const riwayatSearch = document.getElementById("riwayat-search");
  if (riwayatSearch) {
    riwayatSearch.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#riwayat-table tbody tr[data-name]").forEach(tr => {
        tr.style.display = tr.dataset.name.includes(q) ? "" : "none";
      });
    });
  }
  const memberSearch = document.getElementById("member-search");
  if (memberSearch) {
    memberSearch.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll("#member-table tbody tr[data-name]").forEach(tr => {
        tr.style.display = tr.dataset.name.includes(q) ? "" : "none";
      });
    });
  }
}

currentUser=getCurrentUser();
preloadLoginDirectory().finally(()=>{
  const dirAdmin = (window._loginDirectory||{}).admin || DEFAULT_ADMIN;
  const isValidAdminSession = currentUser && currentUser.role==="admin" && currentUser.username===dirAdmin.username;
  const isValidKasirSession = currentUser && currentUser.role==="kasir" && currentUser.branchId
    && cashiersWithFallback((window._loginDirectory||{}).branches, (window._loginDirectory||{}).cashiers).some(c=>c.username===currentUser.username && c.branchId===currentUser.branchId);
  if (isValidAdminSession || isValidKasirSession) { touchLastActive(); startApp(); } else showLogin();
});
