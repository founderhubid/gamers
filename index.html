<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rental PS — Kasir Digital</title>
<script>
  // Set tema sedini mungkin biar tidak "kedip" warna salah saat halaman dibuka.
  (function () {
    try {
      var t = localStorage.getItem("rp_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
      if (localStorage.getItem("rp_sidebar") === "collapsed") {
        document.documentElement.setAttribute("data-sidebar", "collapsed");
      }
    } catch (e) {}
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    /* ===== Token yang SELALU sama di kedua tema (identitas brand) ===== */
    --rp-serif: 'Fraunces', Georgia, serif;
    --rp-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --rp-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --rp-btn-text: #F4F1E4;

    /* ===== Token yang beda per tema — default GELAP ("navy ledger") di sini,
       ditimpa oleh [data-theme="light"] di bawah ===== */
    --rp-page-bg: #0A0D16;
    --rp-grid-line: rgba(140,163,191,0.055);
    --rp-grid-dot: rgba(140,163,191,0.075);
    --rp-sidebar-bg: rgba(10,13,21,0.92);
    --rp-surface: rgba(18,22,35,0.86);
    --rp-surface-2: rgba(23,28,43,0.86);
    --rp-surface-solid: #131829;
    --rp-border: rgba(140,163,191,0.17);
    --rp-border-strong: rgba(140,163,191,0.34);
    --rp-ink: #EDE7D8;
    --rp-ink-dim: #8E9CB6;
    --rp-line: rgba(140,163,191,0.17);
    --rp-hover-tint: rgba(140,163,191,0.1);
    --rp-input-bg: rgba(150,175,210,0.045);
    --rp-th-bg: rgba(150,175,210,0.03);
    --rp-neutral-tint: rgba(140,163,191,0.13);
    --rp-overlay: rgba(3,5,11,0.68);
    --rp-elevation-shadow: rgba(1,3,10,0.6);
    --rp-panel-shadow: 0 14px 34px -18px rgba(1,4,16,0.7);
    --rp-panel-highlight: rgba(185,205,235,0.065);
    --rp-scrollbar: rgba(140,163,191,0.3);
    --rp-scrollbar-hover: rgba(140,163,191,0.48);
    --rp-focus-ring: rgba(157,187,221,0.3);
    --rp-accent-rgb: 157,187,221;

    --rp-chip-bg: #EDE7D8;
    --rp-chip-text: #14213B;

    --rp-red: #E2695A;
    --rp-red-tint: rgba(226,105,90,0.14);
    --rp-red-ring: rgba(226,105,90,0.45);
    --rp-red-glow: rgba(226,105,90,0.4);
    --rp-teal: #4FAE9C;
    --rp-teal-tint: rgba(79,174,156,0.14);
    --rp-amber: #DDA753;
    --rp-amber-tint: rgba(221,167,83,0.16);
    --rp-navy: #9DBBDD;
    --rp-navy-soft: #64809F;
  }
  [data-theme="light"] {
    --rp-page-bg: #EFE8D8;
    --rp-grid-line: rgba(35,43,61,0.045);
    --rp-grid-dot: rgba(35,43,61,0.05);
    --rp-sidebar-bg: rgba(231,222,200,0.92);
    --rp-surface: rgba(231,222,200,0.9);
    --rp-surface-2: rgba(231,222,200,0.96);
    --rp-surface-solid: #EFE8D8;
    --rp-border: #C9BFA4;
    --rp-border-strong: #B8AC8C;
    --rp-ink: #232B3D;
    --rp-ink-dim: #6B6656;
    --rp-line: #C9BFA4;
    --rp-hover-tint: rgba(35,43,61,0.06);
    --rp-input-bg: #FFFFFF;
    --rp-th-bg: #E7DEC8;
    --rp-neutral-tint: rgba(107,102,86,0.12);
    --rp-overlay: rgba(35,43,61,0.35);
    --rp-elevation-shadow: rgba(35,43,61,0.18);
    --rp-panel-shadow: 0 10px 24px -18px rgba(35,43,61,0.3);
    --rp-panel-highlight: rgba(255,255,255,0.5);
    --rp-scrollbar: rgba(35,43,61,0.18);
    --rp-scrollbar-hover: rgba(35,43,61,0.3);
    --rp-focus-ring: rgba(27,58,99,0.18);
    --rp-accent-rgb: 27,58,99;

    --rp-chip-bg: #232B3D;
    --rp-chip-text: #F4F1E4;

    --rp-red: #B23A2E;
    --rp-red-tint: rgba(178,58,46,0.12);
    --rp-red-ring: rgba(178,58,46,0.4);
    --rp-red-glow: rgba(178,58,46,0.22);
    --rp-teal: #2F6F62;
    --rp-teal-tint: rgba(47,111,98,0.12);
    --rp-amber: #C6852E;
    --rp-amber-tint: rgba(198,133,46,0.14);
    --rp-navy: #1B3A63;
    --rp-navy-soft: #8CA3BF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background-color: var(--rp-page-bg);
    background-image:
      linear-gradient(var(--rp-grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--rp-grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-attachment: fixed;
    color: var(--rp-ink);
    font-family: var(--rp-sans);
    transition: background-color .2s ease, color .2s ease;
  }
  #root { display: flex; min-height: 100vh; }
  .rp-mono { font-family: var(--rp-mono); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rp-scrollbar); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--rp-scrollbar-hover); }

  /* Sidebar
     PENTING: sengaja TANPA backdrop-filter blur. Elemen ini position:fixed
     di HP (jadi bottom-nav) dan selalu nempel di layar selama scroll — kalau
     pakai blur, browser harus ngitung ulang blur-nya di SETIAP frame scroll
     karena konten di belakangnya terus berubah. Ini biang utama scroll jadi
     berat di HP. Background rgba(...,0.92) di atas udah cukup opaque jadi
     nggak butuh blur buat tetap kebaca. */
  .rp-sidebar {
    width: 236px; flex-shrink: 0; background: var(--rp-sidebar-bg);
    border-right: 1px solid var(--rp-border);
    display: flex; flex-direction: column; padding: 18px 14px;
  }
  .rp-brand { display: flex; gap: 10px; align-items: center; padding-bottom: 16px; margin-bottom: 14px; border-bottom: 1px solid var(--rp-border); }
  .rp-brand-mark {
    width: 36px; height: 36px; border-radius: 9px; background: var(--rp-chip-bg);
    color: var(--rp-chip-text); font-family: var(--rp-serif); font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--rp-panel-highlight) inset, 0 6px 16px -8px var(--rp-elevation-shadow);
  }
  .rp-brand-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .rp-brand-input { font-family: var(--rp-serif); font-weight: 600; font-size: 14.5px; color: var(--rp-ink); background: transparent; border: none; padding: 0; width: 100%; }
  .rp-brand-input:focus { outline: none; border-bottom: 1px dashed var(--rp-ink-dim); }
  .rp-brand-sub { font-size: 11px; color: var(--rp-ink-dim); }
  .rp-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .rp-nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: none; background: transparent; color: var(--rp-ink-dim); font-size: 13.5px; text-align: left; cursor: pointer; font-family: var(--rp-sans); width: 100%; transition: background .15s ease, color .15s ease; }
  .rp-nav-item:hover { background: var(--rp-hover-tint); color: var(--rp-ink); }
  .rp-nav-item.is-active { background: var(--rp-chip-bg); color: var(--rp-chip-text); box-shadow: 0 6px 14px -8px var(--rp-elevation-shadow); }
  .rp-sidebar-foot { border-top: 1px solid var(--rp-border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }

  /* Rel aksi cepat sisi kiri — cuma tampil di laptop/desktop (>=1025px),
     lihat definisi lengkapnya di media query min-width:1025px. Default-nya
     disembunyikan biar nggak numpuk sama bottom-bar di HP/tablet. */
  .rp-quickrail { display: none; }
  .rp-sync-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--rp-ink-dim); margin-top: 4px; }
  .rp-sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rp-teal); flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .rp-sync-dot.is-busy { background: var(--rp-amber); }
  .rp-sync-dot.is-error { background: var(--rp-red); }
  .rp-refresh-btn { background: transparent; border: 1px solid var(--rp-border); border-radius: 6px; color: var(--rp-ink-dim); font-size: 11px; padding: 5px 8px; cursor: pointer; margin-top: 4px; }
  .rp-refresh-btn:hover { color: var(--rp-ink); border-color: var(--rp-border-strong); }

  /* Main */
  .rp-main { flex: 1; overflow-y: auto; padding: 28px 32px; min-width: 0; height: 100vh; }
  .rp-page { max-width: 940px; }
  .rp-page-head { margin-bottom: 20px; }
  .rp-page-head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .rp-page-head h1 { font-family: var(--rp-serif); font-weight: 600; font-size: 23px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .rp-sub { color: var(--rp-ink-dim); font-size: 13px; margin: 0; }
  .rp-ruled-head { font-family: var(--rp-serif); font-size: 13.5px; font-weight: 600; padding-bottom: 6px; margin: 22px 0 12px; border-bottom: 1px solid var(--rp-border); color: var(--rp-ink); }

  .rp-stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .rp-stat-card { flex: 1; min-width: 160px; background: var(--rp-surface); border: 1px solid var(--rp-border); border-radius: 10px; padding: 14px 16px; min-width: 0; box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight); }
  .rp-stat-label { display: block; font-size: 11.5px; color: var(--rp-ink-dim); margin-bottom: 6px; overflow-wrap: break-word; }
  .rp-stat-value { font-size: 20px; color: var(--rp-ink); overflow-wrap: break-word; font-family: var(--rp-mono); }

  .rp-unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .rp-card {
    position: relative; overflow: hidden; background-color: var(--rp-surface);
    background-image: radial-gradient(var(--rp-grid-dot) 1px, transparent 1px);
    background-size: 14px 14px;
    border: 1px solid var(--rp-border); border-top: none; border-radius: 10px; padding: 18px 16px 16px;
    box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight);
  }
  .rp-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--rp-teal); border-radius: 10px 10px 0 0;
  }
  .rp-clickable { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .rp-clickable:hover { transform: translateY(-2px); box-shadow: 0 16px 34px -16px var(--rp-elevation-shadow), inset 0 1px 0 var(--rp-panel-highlight); }
  .rp-unit-card.is-active { border-color: var(--rp-red-ring); box-shadow: 0 0 0 1px var(--rp-red-tint), 0 10px 30px -12px var(--rp-red-glow), var(--rp-panel-shadow); }
  .rp-unit-card.is-active.rp-clickable:hover { box-shadow: 0 0 0 1px var(--rp-red-tint), 0 16px 34px -16px var(--rp-red-glow), var(--rp-panel-shadow); }
  .rp-unit-card.is-active::before { background: var(--rp-red); box-shadow: 0 0 10px var(--rp-red-glow); }
  .rp-unit-card.is-maint { opacity: 0.6; }
  .rp-unit-card.is-maint::before { background: var(--rp-ink-dim); }
  .rp-unit-name { font-family: var(--rp-serif); font-weight: 600; font-size: 15px; margin-bottom: 2px; padding-right: 64px; color: var(--rp-ink); }
  .rp-unit-rate { font-size: 12px; color: var(--rp-ink-dim); margin-bottom: 12px; font-family: var(--rp-mono); }
  .rp-timer { font-size: 22px; font-weight: 600; color: var(--rp-red); margin-bottom: 2px; font-family: var(--rp-mono); }
  .rp-timer.is-warning { color: var(--rp-amber); animation: rp-blink 1s step-start infinite; }
  .rp-timer.is-over { color: var(--rp-red); animation: rp-blink 0.6s step-start infinite; }
  @keyframes rp-blink { 50% { opacity: 0.35; } }
  .rp-unit-customer { font-size: 12px; color: var(--rp-ink-dim); margin-bottom: 6px; }
  .rp-running-cost { font-size: 13px; color: var(--rp-amber); margin-bottom: 12px; font-family: var(--rp-mono); }
  .rp-unit-note { font-size: 12px; color: var(--rp-ink-dim); font-style: italic; }
  .rp-card-actions { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .rp-card-actions .rp-btn { width: auto; flex: 1; min-width: 0; white-space: nowrap; }

  .rp-stamp {
    position: absolute; top: 12px; right: 12px; display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--rp-mono); font-size: 10px; letter-spacing: 0.02em; padding: 3px 9px 3px 7px;
    border-radius: 20px; border: 1px solid currentColor; background: var(--rp-neutral-tint);
  }
  .rp-stamp::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .rp-stamp-inline { position: static; display: inline-flex; }
  .rp-stamp-available { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-stamp-active { color: var(--rp-red); background: var(--rp-red-tint); box-shadow: 0 0 12px -2px var(--rp-red-glow); }
  .rp-stamp-active::before { box-shadow: 0 0 6px currentColor; }
  .rp-stamp-maintenance { color: var(--rp-ink-dim); background: var(--rp-neutral-tint); }

  .rp-btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; font-family: var(--rp-sans); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; width: 100%; transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
  .rp-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .rp-btn-start { background: var(--rp-teal); color: var(--rp-btn-text); box-shadow: 0 6px 16px -9px var(--rp-elevation-shadow); }
  .rp-btn-start:hover:not(:disabled) { filter: brightness(1.08); }
  .rp-btn-stop { background: var(--rp-red); color: var(--rp-btn-text); box-shadow: 0 6px 16px -9px var(--rp-elevation-shadow); }
  .rp-btn-stop:hover:not(:disabled) { filter: brightness(1.08); }
  .rp-btn-ghost { background: transparent; border-color: var(--rp-border-strong); color: var(--rp-ink); width: auto; }
  .rp-btn-ghost:hover:not(:disabled) { background: var(--rp-hover-tint); }
  .rp-head-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rp-page-head-row .rp-btn { width: auto; }

  .rp-table-wrap { overflow-x: auto; border: 1px solid var(--rp-border); border-radius: 10px; background: var(--rp-surface); box-shadow: var(--rp-panel-shadow); }
  .rp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rp-table th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--rp-ink-dim); padding: 10px 14px; border-bottom: 1px solid var(--rp-border); background: var(--rp-th-bg); white-space: nowrap; }
  .rp-table td { padding: 10px 14px; border-bottom: 1px solid var(--rp-border); color: var(--rp-ink); }
  .rp-table tr:last-child td { border-bottom: none; }
  .rp-dim { color: var(--rp-ink-dim); font-size: 11px; }
  .rp-row-actions { display: flex; gap: 4px; }

  .rp-icon-btn { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px; cursor: pointer; color: var(--rp-ink-dim); display: inline-flex; }
  .rp-icon-btn:hover { background: var(--rp-hover-tint); color: var(--rp-ink); }
  .rp-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .rp-icon-danger:hover { color: var(--rp-red); }

  .rp-cond { font-size: 12px; padding: 2px 8px; border-radius: 20px; }
  .rp-cond-Baik { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-cond-Rusak { color: var(--rp-red); background: var(--rp-red-tint); }
  .rp-cond-Perlu-cek { color: var(--rp-amber); background: var(--rp-amber-tint); }

  .rp-search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rp-border); border-radius: 8px; padding: 6px 10px; background: var(--rp-surface); color: var(--rp-ink-dim); }
  .rp-search input { border: none; background: transparent; font-size: 13px; color: var(--rp-ink); outline: none; width: 180px; font-family: var(--rp-sans); }
  .rp-search-wide { margin-bottom: 14px; width: fit-content; }

  .rp-empty { display: flex; align-items: center; gap: 8px; color: var(--rp-ink-dim); font-size: 13px; padding: 18px; justify-content: center; }

  .rp-modal-backdrop { position: fixed; inset: 0; background: var(--rp-overlay); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .rp-modal { background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong); border-radius: 14px; width: 360px; max-width: 92vw; max-height: 86vh; overflow-y: auto; box-shadow: 0 24px 60px -20px var(--rp-elevation-shadow); }
  .rp-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rp-border); }
  .rp-modal-head h3 { font-family: var(--rp-serif); font-size: 15px; font-weight: 600; margin: 0; color: var(--rp-ink); }
  .rp-modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .rp-modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .rp-modal-foot .rp-btn { width: auto; white-space: nowrap; }

  .rp-field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--rp-ink-dim); }
  .rp-field input, .rp-field select { font-family: var(--rp-sans); font-size: 13.5px; color: var(--rp-ink); border: 1px solid var(--rp-border); border-radius: 8px; padding: 8px 10px; background: var(--rp-input-bg); }
  .rp-field input:focus, .rp-field select:focus { outline: none; border-color: var(--rp-navy); box-shadow: 0 0 0 3px var(--rp-focus-ring); }
  /* Daftar pilihan (popup) punya <select> dirender native oleh OS/browser,
     jadi warnanya tidak ikut var(--rp-input-bg) yang transparan — harus
     dikasih warna solid sendiri, kalau tidak teksnya jadi putih-di-atas-
     putih (tidak kebaca) waktu mode gelap. */
  select option { background: var(--rp-surface-solid); color: var(--rp-ink); }
  .rp-field-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rp-pill { flex: 1; min-width: 62px; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--rp-border); background: transparent; color: var(--rp-ink-dim); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .rp-pill.is-on { background: var(--rp-chip-bg); color: var(--rp-chip-text); border-color: transparent; }

  .rp-receipt { border: 1px dashed var(--rp-border-strong); border-radius: 10px; padding: 12px 14px; }
  .rp-receipt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .rp-receipt-line { border-top: 1px dashed var(--rp-border-strong); margin: 4px 0; }
  .rp-receipt-total { font-size: 15px; font-family: var(--rp-mono); }

  .rp-chart-box { border: 1px solid var(--rp-border); border-radius: 10px; padding: 14px; background: var(--rp-surface); box-shadow: var(--rp-panel-shadow), inset 0 1px 0 var(--rp-panel-highlight); }
  .rp-chart-legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--rp-ink-dim); flex-wrap: wrap; }
  .rp-legend-item { display: flex; align-items: center; gap: 6px; }
  .rp-legend-swatch { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .rp-delta-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 4px; }
  .rp-delta-up { color: var(--rp-teal); background: var(--rp-teal-tint); }
  .rp-delta-down { color: var(--rp-red); background: var(--rp-red-tint); }
  .rp-delta-flat { color: var(--rp-ink-dim); background: var(--rp-neutral-tint); }

  .rp-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong); color: var(--rp-ink); padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: 0 12px 30px -10px var(--rp-elevation-shadow); }

  .rp-user-menu {
    position: fixed; top: 16px; right: 16px; z-index: 60;
    font-family: var(--rp-sans);
  }
  .rp-user-trigger {
    display: flex; align-items: center; gap: 9px;
    background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong);
    border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer;
    box-shadow: 0 8px 20px -8px var(--rp-elevation-shadow);
    color: var(--rp-ink); transition: background .15s ease, transform .15s ease;
    font-family: var(--rp-sans);
  }
  .rp-user-trigger:hover { background: var(--rp-surface-2); }
  .rp-user-avatar {
    width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: var(--rp-chip-bg); color: var(--rp-chip-text);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--rp-serif); font-weight: 700; font-size: 12.5px;
    box-shadow: inset 0 0 0 1px var(--rp-panel-highlight);
  }
  .rp-user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rp-user-id { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .rp-user-name { font-size: 12.5px; font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-user-role { font-size: 9px; color: var(--rp-ink-dim); }

  .rp-user-popover {
    position: absolute; top: calc(100% + 10px); right: 0; min-width: 224px;
    background: var(--rp-surface-solid); border: 1px solid var(--rp-border-strong);
    border-radius: 14px; padding: 10px; box-shadow: 0 24px 60px -24px var(--rp-elevation-shadow);
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity .15s ease, transform .15s ease, visibility .15s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .rp-user-menu:hover .rp-user-popover,
  .rp-user-menu.is-open .rp-user-popover {
    opacity: 1; visibility: visible; transform: translateY(0);
  }
  .rp-theme-switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border-radius: 9px; background: var(--rp-hover-tint);
    margin-bottom: 2px;
  }
  .rp-theme-switch-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--rp-ink); }
  .rp-theme-switch {
    position: relative; width: 40px; height: 22px; border-radius: 999px; border: 1px solid var(--rp-border-strong);
    background: var(--rp-input-bg); cursor: pointer; flex-shrink: 0; padding: 0;
    transition: background .18s ease;
  }
  .rp-theme-switch-thumb {
    position: absolute; top: 50%; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--rp-chip-bg); color: var(--rp-chip-text);
    display: flex; align-items: center; justify-content: center;
    transform: translateY(-50%); transition: left .18s ease;
  }
  .rp-theme-switch.is-on { background: var(--rp-navy-soft); }
  .rp-theme-switch.is-on .rp-theme-switch-thumb { left: calc(100% - 18px); }

  .rp-user-menu-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 9px; padding: 9px 10px;
    font-size: 12.5px; color: var(--rp-ink); cursor: pointer; font-family: var(--rp-sans);
    transition: background .15s ease;
  }
  .rp-user-menu-btn:hover { background: var(--rp-hover-tint); }
  .rp-user-menu-danger { color: var(--rp-red); }
  .rp-user-menu-danger:hover { background: var(--rp-red-tint); }

  .rp-loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; font-family: var(--rp-serif); font-size: 16px; color: var(--rp-ink-dim); }

  /* Menu bawah (bottom-bar) — sekarang dipakai di SEMUA ukuran layar
     (HP, tablet, DAN laptop/desktop), bukan cuma di layar sempit lagi. */
  @media (max-width: 99999px) {
    #root { flex-direction: column; }
    .rp-sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      width: 100%; flex-direction: row; align-items: stretch;
      overflow-x: auto; border-right: none; border-top: 1px solid var(--rp-border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .rp-brand { display: none; }
    .rp-nav { flex-direction: row; flex: 1; gap: 0; justify-content: space-around; }
    .rp-nav-item {
      flex-direction: column; gap: 3px; align-items: center; justify-content: center;
      width: auto; flex: 1; padding: 6px 2px; border-radius: 8px;
    }
    .rp-nav-label { font-size: 10px; line-height: 1.1; white-space: nowrap; }
    .rp-sidebar-foot { display: none; }
    .rp-main { height: auto; padding-top: calc(18px + env(safe-area-inset-top)); padding-bottom: calc(76px + env(safe-area-inset-bottom)); padding-left: 16px; padding-right: 16px; }
    .rp-user-menu { top: 10px; right: 10px; }
    .rp-user-trigger { padding: 4px 10px 4px 4px; gap: 7px; }
    .rp-user-avatar { width: 27px; height: 27px; font-size: 11px; }
    .rp-user-id { display: flex; }
    .rp-user-name { font-size: 11px; max-width: 96px; }
    .rp-user-role { font-size: 8.5px; }
  }

  @media (max-width: 720px) {
    /* 4 card jadi 2 kolom sebaris di mobile (dashboard & laporan) */
    .rp-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rp-stat-card { padding: 10px 12px; }
    .rp-stat-label { font-size: 10.5px; margin-bottom: 4px; }
    .rp-stat-value { font-size: 16px; }
    .rp-delta-badge { font-size: 10px; }

    /* Kecilkan tombol & pastikan tidak meluber keluar card/modal */
    .rp-btn { font-size: 12px; padding: 7px 10px; }
    .rp-pill { font-size: 11.5px; padding: 6px 4px; }
    .rp-unit-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .rp-card { padding: 14px 12px 12px; }
    .rp-unit-name { font-size: 13.5px; padding-right: 44px; }
    .rp-stamp { top: 8px; right: 8px; font-size: 8.5px; padding: 2px 7px 2px 6px; letter-spacing: 0; white-space: nowrap; }
    .rp-timer { font-size: 18px; }
    .rp-modal { width: 320px; }
  }


/* =========================================================
   PREMIUM UI OVERRIDE — Rental PS
   Fokus: premium / modern / clean / operator-friendly
   Tidak mengubah business logic atau API.
========================================================= */
/* Page atmosphere — warm paper/ink tint instead of the old blue-violet glow */
html,body{
  background-color:var(--rp-page-bg);
  background-image:
    radial-gradient(circle at 78% 8%,rgba(var(--rp-accent-rgb),.07),transparent 28%),
    radial-gradient(circle at 15% 80%,rgba(198,133,46,.05),transparent 26%);
  background-size:auto;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 0%,var(--rp-panel-highlight) 48%,transparent 100%);
  z-index:-1;
}

/* Sidebar */
.rp-sidebar{
  width:248px;
  padding:20px 14px;
  border-right:1px solid var(--rp-border);
  box-shadow:18px 0 60px -50px rgba(0,0,0,.8);
}
.rp-brand{
  padding:4px 8px 18px;
  margin-bottom:16px;
  border-bottom:1px solid var(--rp-border);
}
.rp-brand-mark{
  width:40px;height:40px;border-radius:12px;
  font-size:12px;
  box-shadow:0 10px 22px -10px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-brand-input{
  font-size:15px;
  letter-spacing:-.02em;
}
.rp-brand-sub{
  margin-top:2px;
  letter-spacing:.02em;
}
.rp-nav{gap:5px}
.rp-nav-item{
  position:relative;
  padding:11px 12px;
  border-radius:11px;
  font-size:13px;
}
.rp-nav-item:hover{
  transform:translateX(2px);
}
.rp-nav-item.is-active{
  box-shadow:0 8px 18px -10px var(--rp-elevation-shadow);
}
.rp-nav-item.is-active:after{
  content:"";
  position:absolute;
  right:7px;
  width:4px;height:18px;
  border-radius:99px;
  background:var(--rp-chip-text);
  opacity:.55;
}
.rp-sidebar-foot{
  padding:15px 8px 0;
}
.rp-refresh-btn{
  width:100%;
  padding:8px 10px;
  border-radius:9px;
  transition:.15s ease;
}
.rp-refresh-btn:hover{background:var(--rp-hover-tint);transform:translateY(-1px)}

@media (min-width: 1025px) {
  /* Di laptop/desktop, #root balik jadi row (quickrail | main) — sidebar
     lama udah jadi bottom-bar permanen (position:fixed, di luar alur flex
     ini), jadi nggak kepengaruh sama flex-direction di sini. */
  #root { flex-direction: row; }

  /* Lebar dipersempit lagi. */
  .rp-quickrail {
    display: flex; flex-direction: column; width: 58px; flex-shrink: 0;
    background: var(--rp-sidebar-bg); border-right: 1px solid var(--rp-border);
    align-items: center; padding: 14px 6px; gap: 5px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .rp-quickrail-brand {
    width: 32px; height: 32px; border-radius: 8px; background: var(--rp-chip-bg);
    color: var(--rp-chip-text); display: flex; align-items: center; justify-content: center;
    font-family: var(--rp-serif); font-weight: 700; font-size: 11px; flex-shrink: 0;
    cursor: default;
  }
  .rp-quickrail-name {
    font-size: 8.5px; font-weight: 600; color: var(--rp-ink-dim); text-align: center;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 10px; cursor: pointer;
  }
  .rp-quickrail-title {
    font-size: 8px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--rp-ink-dim); text-align: center; margin-top: 6px;
  }
  .rp-quickrail-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 100%; padding: 8px 2px; border: none; border-radius: 8px;
    background: transparent; color: var(--rp-ink); cursor: pointer;
    font-family: var(--rp-sans); font-size: 8.5px; font-weight: 600; text-align: center;
    line-height: 1.1; transition: background .12s ease;
  }
  .rp-quickrail-btn:hover { background: var(--rp-hover-tint); }

  /* Jarak judul ke atas dipepetin. */
  .rp-main { padding-top: 20px; padding-bottom: 64px; padding-left: 28px; padding-right: 28px; height: 100vh; overflow-y: auto; }
}

/* Main */
.rp-page{
  max-width:1180px;
  margin:0 auto;
}
.rp-page-head{
  margin-bottom:24px;
}
.rp-page-head h1{
  font-size:27px;
  font-weight:700;
  letter-spacing:-.035em;
}
.rp-sub{
  font-size:12.5px;
  line-height:1.55;
}

/* Banner foto header dashboard (opsional, diisi per cabang) */
.rp-dash-banner{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.rp-dash-banner.has-photo{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  min-height:84px;
  padding:12px 16px;
  background-size:cover;
  background-position:center;
  border:1px solid var(--rp-border);
}
.rp-dash-banner-text{ position:relative; z-index:1; }
/* Begitu banner ada fotonya, judul & subjudul dipaksa putih + dikasih
   text-shadow, TERLEPAS dari tema light/dark yang lagi aktif — soalnya
   warna teks tema (--rp-ink) belum tentu kebaca di atas foto sembarang.
   Scrim gelap di background-image (lihat bannerStyle di JS) + shadow ini
   sama-sama jaga kontras biar subjudul tetap kebaca. */
.rp-dash-banner.has-photo .rp-dash-banner-text h1,
.rp-dash-banner.has-photo .rp-dash-banner-text .rp-sub{
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.4);
}
.rp-dash-banner-edit{
  position:relative;
  z-index:1;
  width:auto;
  white-space:nowrap;
  backdrop-filter:blur(2px);
}
.rp-dash-banner:not(.has-photo) .rp-dash-banner-edit{
  background:transparent;
  border-style:dashed;
}
/* Kalau bannernya udah ada fotonya, tombol "Ganti foto" dibikin nyaris
   nggak kelihatan (superduper transparan) biar nggak nutupin foto —
   baru muncul lagi pas kursor di-hover di atas banner, atau (buat HP,
   yang nggak ada hover) pas bannernya di-tap sekali. */
.rp-dash-banner.has-photo{ cursor:pointer; }
.rp-dash-banner.has-photo .rp-dash-banner-edit{
  opacity:.04;
  transition:opacity .2s ease;
}
.rp-dash-banner.has-photo:hover .rp-dash-banner-edit,
.rp-dash-banner.has-photo:focus-within .rp-dash-banner-edit,
.rp-dash-banner.has-photo.rp-banner-edit-visible .rp-dash-banner-edit{
  opacity:1;
}
@media (max-width:640px){
  .rp-dash-banner.has-photo{ min-height:68px; padding:10px 12px; }
  /* Di HP, tombol foto header JANGAN sampai bikin baris baru (makan
     tempat) — dilepas dari alur flex (absolute, pojok kanan atas) biar
     nyewa/numpuk di atas judul/subjudul kalau perlu. Nggak masalah kalau
     ketiban teks: begitu ada foto, tombolnya dibikin nyaris transparan
     (lihat .has-photo .rp-dash-banner-edit di atas) jadi gak ganggu. */
  .rp-dash-banner-tools{
    position:absolute;
    top:0;
    right:0;
    flex-wrap:nowrap;
  }
  .rp-dash-banner-edit{
    font-size:11px;
    padding:5px 8px;
  }
}

/* Tombol fitur halaman (Tambah unit, Ekspor, dsb) — diletakkan di baris
   sendiri persis di bawah header, TERPISAH dari banner foto header, dan
   dibikin lebih kecil/ringkas biar nggak keliatan segede judul halaman. */
.rp-page-tools-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  margin:10px 0 20px;
}
.rp-page-tools-row .rp-btn{
  width:auto;
  font-size:12px;
  font-weight:600;
  padding:6px 10px;
  border-radius:7px;
  gap:5px;
}
.rp-page-tools-row .rp-btn svg{
  width:12px;
  height:12px;
}
.rp-page-tools-row .rp-search{
  width:auto;
  min-width:0;
}
.rp-page-tools-row .rp-search input{
  font-size:12px;
  padding:6px 8px;
}

/* KPI cards */
.rp-stat-row{
  gap:14px;
}
.rp-stat-card{
  position:relative;
  overflow:hidden;
  border-radius:15px;
  padding:17px 18px;
  min-height:86px;
  box-shadow:var(--rp-panel-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-stat-card:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,rgba(var(--rp-accent-rgb),.75),rgba(198,133,46,.4));
  opacity:.85;
}
.rp-stat-card:after{
  content:"";
  position:absolute;
  width:90px;height:90px;
  right:-35px;bottom:-55px;
  border-radius:50%;
  background:rgba(var(--rp-accent-rgb),.08);
  filter:blur(12px);
}
.rp-stat-label{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.075em;
  font-weight:600;
}
.rp-stat-value{
  font-size:21px;
  font-weight:600;
  letter-spacing:-.025em;
}

/* Section heading */
.rp-ruled-head{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--rp-ink-dim);
  border-bottom:0;
  margin:28px 0 13px;
}
.rp-ruled-head:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--rp-border);
}

/* Unit cards */
.rp-unit-grid{
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
}
.rp-card{
  border-radius:15px;
  padding:19px 17px 16px;
  border:1px solid var(--rp-border);
  border-top:1px solid var(--rp-border);
  background-image:
    radial-gradient(circle at 90% 0%,rgba(var(--rp-accent-rgb),.06),transparent 34%),
    linear-gradient(180deg,var(--rp-panel-highlight),transparent 65%);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.rp-card:before{height:2px}
.rp-card:hover{
  transform:translateY(-3px);
  border-color:var(--rp-border-strong);
  box-shadow:0 20px 40px -30px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-unit-name{
  font-size:15.5px;
  font-weight:650;
  letter-spacing:-.015em;
}
.rp-unit-rate{
  font-size:11px;
  opacity:.9;
}
.rp-timer{
  font-size:24px;
  letter-spacing:-.035em;
}
.rp-running-cost{
  font-size:12px;
}
.rp-stamp{
  font-size:9px;
  font-weight:600;
  letter-spacing:.045em;
  text-transform:uppercase;
  padding:4px 9px 4px 7px;
}
.rp-card-actions{gap:7px}
.rp-btn{
  border-radius:10px;
  min-height:36px;
  padding:8px 13px;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease,background .15s ease;
}
.rp-btn:hover:not(:disabled){
  transform:translateY(-1px);
}
.rp-btn-start{
  box-shadow:0 10px 22px -14px var(--rp-elevation-shadow);
}
.rp-btn-stop{
  box-shadow:0 10px 22px -14px var(--rp-elevation-shadow);
}
.rp-btn-ghost{
  background:rgba(255,255,255,.025);
}
[data-theme="light"] .rp-btn-ghost{background:rgba(31,43,77,.025)}

/* Tables */
.rp-table-wrap{
  border-radius:14px;
  box-shadow:var(--rp-panel-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-table{
  font-size:12.5px;
}
.rp-table th{
  padding:12px 15px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.065em;
}
.rp-table td{
  padding:12px 15px;
}
.rp-table tbody tr{
  transition:background .12s ease;
}
.rp-table tbody tr:hover{
  background:var(--rp-hover-tint);
}

/* Search */
.rp-search{
  border-radius:10px;
  padding:7px 11px;
  background:var(--rp-surface);
  box-shadow:inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-search:focus-within{
  border-color:rgba(var(--rp-accent-rgb),.5);
  box-shadow:0 0 0 3px var(--rp-focus-ring);
}
.rp-search input{font-size:12.5px}

/* Forms / modals */
.rp-modal-backdrop{
  background:var(--rp-overlay);
  backdrop-filter:blur(8px);
}
.rp-modal{
  width:410px;
  border-radius:18px;
  box-shadow:0 30px 70px -35px var(--rp-elevation-shadow),inset 0 1px 0 var(--rp-panel-highlight);
}
.rp-modal-head{
  padding:16px 18px;
}
.rp-modal-head h3{
  font-size:15.5px;
  letter-spacing:-.015em;
}
.rp-modal-body{
  padding:18px;
  gap:13px;
}
.rp-field{gap:6px;font-size:11.5px;font-weight:500}
.rp-field input,.rp-field select{
  min-height:40px;
  border-radius:10px;
  padding:9px 11px;
  transition:.15s ease;
}
.rp-field input:focus,.rp-field select:focus{
  border-color:rgba(var(--rp-accent-rgb),.6);
  box-shadow:0 0 0 3px var(--rp-focus-ring);
}
.rp-pill{
  border-radius:10px;
  min-height:36px;
  transition:.15s ease;
}
.rp-pill:hover{background:var(--rp-hover-tint);color:var(--rp-ink)}
.rp-pill.is-on{
  box-shadow:0 8px 16px -12px var(--rp-elevation-shadow);
}

/* Receipt */
.rp-receipt{
  border:1px solid var(--rp-border);
  border-radius:13px;
  padding:13px 15px;
  background:linear-gradient(145deg,rgba(var(--rp-accent-rgb),.05),rgba(198,133,46,.03));
}
.rp-receipt-total{
  font-size:17px;
  padding-top:7px;
}
.rp-receipt-line{
  border-color:var(--rp-border);
  margin:7px 0;
}

/* Report chart */
.rp-chart-box{
  border-radius:15px;
  padding:16px;
}
.rp-delta-badge{
  padding:3px 8px;
  font-size:10.5px;
}

/* Toast */
.rp-toast{
  bottom:24px;
  border-radius:12px;
  padding:11px 17px;
  box-shadow:0 18px 45px -18px rgba(0,0,0,.9);
  backdrop-filter:blur(14px);
}

/* User menu (avatar + identitas di pojok kanan atas) — dibikin lebih
   ringkas/kecil, termasuk di layar laptop/desktop. */
.rp-user-trigger{
  padding:4px 12px 4px 4px;
  gap:8px;
  box-shadow:0 12px 28px -16px rgba(0,0,0,.8);
  transition:.16s ease;
}
.rp-user-trigger:hover{
  transform:translateY(-1px);
}
.rp-user-avatar{
  width:26px;height:26px;
  font-size:10.5px;
}
.rp-user-name{
  font-size:11.5px;
  max-width:120px;
}
.rp-user-role{
  font-size:8px;
}
.rp-user-popover{
  border-radius:16px;
}

/* "Akses cepat" versi HP — sekarang jadi tombol-tombol BULAT mengambang
   (kayak AssistiveTouch di iPhone), turun satu jalur ke bawah avatar,
   gabung sama menu akun (mode gelap/ganti foto/keluar) biar nggak
   tabrakan kayak dulu. Wrapper .rp-user-dropdown sengaja "transparan"
   (display:contents) di desktop, jadi popover akun tetap jalan seperti
   semula (hover, kotak list biasa); baru di HP/tablet dia dijadikan
   rentetan bubble bulat lewat media query di bawah. */
.rp-user-dropdown{ display:contents; }
@media (min-width:1025px){
  /* Desktop udah ada quickrail sendiri di kiri, jadi akses cepat nggak
     perlu numpang di avatar lagi. */
  .rp-quick-fan{ display:none; }
}
@media (max-width:1024px){
  .rp-user-dropdown{

   Cloud name diambil dari dashboard Cloudinary kamu (ghebtxdc).
   PENTING: upload dilakukan langsung dari browser (tanpa server),
   jadi HARUS pakai "unsigned upload preset" — bukan API secret.
   Kalau preset dengan nama di bawah belum ada, buat dulu di:
   Cloudinary Console → Settings → Upload → Upload presets → Add
   upload preset → Signing mode: "Unsigned" → kasih nama persis
   "rental_ps_unsigned" → Save.
========================================================= */
const CLOUDINARY_CLOUD_NAME = "ghebtxdc";
const CLOUDINARY_UPLOAD_PRESET = "rental_ps_unsigned";
async function uploadToCloudinary(file) {
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: form });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { const errJson = await res.json(); msg = (errJson.error && errJson.error.message) || msg; } catch (e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  return data.secure_url;
}

  const t = Math.max(0, Math.floor(ms / 1000));
  return `${pad2(Math.floor(t/3600))}:${pad2(Math.floor((t%3600)/60))}:${pad2(t%60)}`;
}
// Semua jam/tanggal di app ini WAJIB mengacu ke waktu Cirebon/WIB
// (Asia/Jakarta), berapapun timezone yang diset di perangkat/browser.
const RP_TZ = "Asia/Jakarta";
// Ambil "jam dinding" WIB dari sebuah waktu (atau sekarang), lalu bungkus
// jadi objek Date dengan field lokal = nilai WIB tsb. Trik ini bikin semua
// perhitungan kalender (hari ini, awal minggu/bulan, dst) konsisten ke WIB
// walau perangkat disetel ke zona waktu lain.
function toJakarta(v) {
  const d = v === undefined ? new Date() : (v instanceof Date ? v : new Date(v));
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: RP_TZ, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  }).formatToParts(d);
  const get = (t) => Number(parts.find(p => p.type === t).value);
  let hour = get("hour"); if (hour === 24) hour = 0; // quirk hour12:false kadang "24"
  return new Date(get("year"), get("month") - 1, get("day"), hour, get("minute"), get("second"));
}
const nowJakarta = () => toJakarta();
function fmtDateID(v) { try { return new Date(v).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric",timeZone:RP_TZ}); } catch { return "-"; } }
function fmtTimeID(v) { try { return new Date(v).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",timeZone:RP_TZ}); } catch { return "-"; } }
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function downloadXLSX(filename, rows, sheetName) {
  if (!rows.length) { flash("Tidak ada data untuk diekspor."); return; }
  if (typeof XLSX === "undefined") { flash("Gagal memuat modul Excel — cek koneksi internet."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const colWidths = Object.keys(rows[0]).map(key => ({
    wch: Math.max(key.length, ...rows.map(r => String(r[key] ?? "").length)) + 2
  }));
  ws["!cols"] = colWidths;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Data");
  XLSX.writeFile(wb, filename);
}

let syncState = "idle"; // idle | error (busy ditandai lewat pendingWrites)

function docRef(sheet) { return dataCol.doc(sheet); }

async function apiSave(sheet, rows) {
  pendingWrites++;

    await docRef(sheet).set({ rows });
    setSync("idle");
  } catch (e) {
    console.error(e);

}

function normalize(raw) {
  const settingsRow = (raw.Settings && raw.Settings[0]) || {};
  let businessName = settingsRow.businessName;
  let defaultRate = Number(settingsRow.defaultRate);
  if (!businessName || businessName === "businessName") businessName = "Rental PS Saya";
  if (!defaultRate || isNaN(defaultRate)) defaultRate = 5000;

  let branches = Array.isArray(settingsRow.branches) ? settingsRow.branches : [];
  branches = branches.filter(b => b && b.id && b.name).map(b => ({ id: String(b.id), name: String(b.name), photoUrl: b.photoUrl ? String(b.photoUrl) : "" }));
  if (!branches.length) branches = [{ id: "branch-main", name: "Cabang Utama" }];

  let cashiers = Array.isArray(settingsRow.cashiers) ? settingsRow.cashiers : [];
  cashiers = cashiers.filter(c => c && c.id && c.username && c.branchId).map(c => ({
    id: String(c.id), username: String(c.username).trim().toLowerCase(),
    password: String(c.password || ""), branchId: String(c.branchId)
  }));

  // Kredensial admin sekarang disimpan di dokumen Settings (Firestore),
  // bukan ditulis langsung di source HTML. Fallback admin/admin123 dipakai
  // HANYA kalau Settings belum pernah di-set (instalasi baru), supaya tetap
  // bisa login pertama kali — setelah itu ganti passwordnya dari Firestore.
  const admin = {
    username: String(settingsRow.adminUsername || "admin").trim().toLowerCase(),
    password: String(settingsRow.adminPassword || "admin123")
  };

  const units = (raw.Units || []).map(u => ({
    ...u, rate: Number(u.rate) || 0,
    branchId: u.branchId || branches[0].id,
    branchName: u.branchName || (branches.find(b => b.id === u.branchId) || branches[0]).name
  }));

  const activeRentals = {};
  (raw.ActiveRentals || []).forEach(r => {
    if (r.unitId) activeRentals[r.unitId] = {
      startTime: Number(r.startTime), customerName: r.customerName || "Tamu",
      memberId: r.memberId || null, note: r.note || "",
      endTime: r.endTime ? Number(r.endTime) : null
    };
  });

  const transactions = (raw.Transactions || []).map(t => ({
    ...t, start: Number(t.start), end: Number(t.end),
    minutes: Number(t.minutes), amount: Number(t.amount)
  })).sort((a,b) => b.end - a.end);

  const members = (raw.Members || []).map(m => ({
    ...m, joined: Number(m.joined) || Date.now(),
    visits: Number(m.visits) || 0, totalSpent: Number(m.totalSpent) || 0
  }));

  const inventory = (raw.Inventory || []).map(i => ({ ...i, lastCheck: Number(i.lastCheck) || Date.now() }));

  const queue = (raw.Queue || []).map(q => ({
    id: q.id, customerName: q.customerName || "Tamu", phone: q.phone || "",
    unitId: q.unitId || null, note: q.note || "", requestedAt: Number(q.requestedAt) || Date.now(),
    branchId: q.branchId || null,
  }));

  const expenses = (raw.Expenses || []).map(e => ({
    id: e.id, date: Number(e.date) || Date.now(), category: e.category || "Lainnya",
    description: e.description || "", amount: Number(e.amount) || 0,
    branchId: e.branchId || branches[0].id, branchName: e.branchName || (branches.find(b=>b.id===(e.branchId||branches[0].id))||branches[0]).name
  }));

  let headerPhotos = (settingsRow.headerPhotos && typeof settingsRow.headerPhotos === "object") ? settingsRow.headerPhotos : {};
  headerPhotos = Object.fromEntries(Object.entries(headerPhotos).filter(([k, v]) => k && v).map(([k, v]) => [String(k), String(v)]));

  const settings = { businessName, defaultRate, branches, cashiers, admin, headerPhotos };
  return { settings, units, activeRentals, transactions, members, inventory, queue, expenses };
}

    // Makanya recompute langsung dari loadedSheets yang datanya valid.
    if (loadedSheets.size >= SHEETS.length) ready = true;
    if (ready) renderAll();
  }
}
function getBranches(){return Array.isArray(state.settings.branches)&&state.settings.branches.length?state.settings.branches:[{id:"branch-main",name:"Cabang Utama"}];}

}

function getVisibleTransactions(){const bid=ensureSelectedBranch();return state.transactions.filter(t=>{if(t.branchId)return t.branchId===bid;const u=state.units.find(x=>x.id===t.unitId);return u?(u.branchId||getBranches()[0].id)===bid:false;});}

// Simpan data mentah terakhir per "sheet" di sini. Tiap dokumen Firestore
// punya listener sendiri (onSnapshot) — begitu salah satu berubah (dari
// device manapun), kita rakit ulang jadi satu `raw` lengkap lalu normalize().
const rawCache = { Settings: [], Units: [], ActiveRentals: [], Transactions: [], Members: [], Inventory: [], Queue: [], Expenses: [] };
const loadedSheets = new Set();

function applyRawCache() {
  const incoming = normalize(rawCache);
  state.settings = incoming.settings;
  // PENTING: sheet-sheet lain (Units, Transactions, dst) bisa saja datang
  // dari Firestore SEBELUM sheet "Settings" (yang berisi daftar akun kasir)
  // selesai dimuat — urutan onSnapshot tidak dijamin sesuai array SHEETS.
  // Kalau validasi akun kasir dijalankan sebelum Settings benar-benar
  // termuat, daftar kasirnya masih kosong/default sehingga akun yang
  // sebenarnya valid bisa salah dianggap "sudah tidak berlaku" dan
  // ke-logout paksa di tengah proses loading (kelihatan seperti macet/
  // muter terus). Makanya cek ini ditunda sampai Settings sudah pasti masuk.
  if (currentUser && currentUser.role === "kasir" && loadedSheets.has("Settings")) {
    const stillValid = cashiersWithFallback(incoming.settings.branches, incoming.settings.cashiers)
      .some(c => String(c.username||"").trim().toLowerCase() === currentUser.username && c.branchId === currentUser.branchId);
    if (!stillValid) { logoutApp(); flash("Akun kasir ini sudah tidak berlaku, hubungi admin."); return; }
  }
  ensureSelectedBranch();
  state.units = incoming.units;
  state.activeRentals = incoming.activeRentals;
  state.transactions = incoming.transactions;
  state.members = incoming.members;
  state.inventory = incoming.inventory;
  state.queue = incoming.queue;
  state.expenses = incoming.expenses;
}

function updateLoadingProgress() {
  const fill = document.getElementById("loading-bar-fill");
  const count = document.getElementById("loading-count");
  if (!fill || !count) return; // loading screen sudah tergantikan oleh app
  const pct = Math.round((loadedSheets.size / SHEETS.length) * 100);
  fill.style.width = pct + "%";
  count.textContent = loadedSheets.size + "/" + SHEETS.length + " data dimuat";
}

function initFirestoreListeners() {
  SHEETS.forEach((sheet) => {
    docRef(sheet).onSnapshot(
      (snap) => {
        rawCache[sheet] = (snap.exists && snap.data().rows) || [];
        loadedSheets.add(sheet);
        applyRawCache();
        updateLoadingProgress();
        if (loadedSheets.size >= SHEETS.length) ready = true;
        if (ready) renderAll();
      },
      (e) => {
        console.error(e);
        loadedSheets.add(sheet);
        updateLoadingProgress();
        if (loadedSheets.size >= SHEETS.length) ready = true;
        setSync("error");
        flash("Gagal memuat data — cek koneksi internet.");
        if (ready) renderAll();
      }
    );
  });
}

// Dengan onSnapshot, data sudah selalu real-time. Tombol "Segarkan data"
// tetap ada untuk memaksa cek ulang ke server (berguna kalau kasir ragu).
async function refreshData() {
  if (isLoading) return; // hindari request numpuk kalau sinyal lambat
  isLoading = true;
  setSync("busy");
  try {
    await Promise.all(SHEETS.map((s) => docRef(s).get({ source: "server" })));
    setSync("idle");
    flash("Data sudah yang terbaru.");
  } catch (e) {
    setSync("error");
    flash("Sinyal lemah — gagal menyegarkan data, dicoba lagi otomatis.");
  } finally {
    isLoading = false;
  }
}

// PENTING: normalize() (dipakai pas load) baca kredensial admin dari field
// RATA `adminUsername` / `adminPassword` di dalam rows[0] — BUKAN dari
// object nested `admin: {username,password}`. Kalau di-save apa adanya dari
// state.settings (yang nyimpen admin sebagai object nested untuk kemudahan
// dipakai di kode lain), field itu nggak bakal kebaca lagi pas reload.

function startRental(unitId, customerName, memberId, note, plannedMinutes) {
  const startTime = Date.now();
  const endTime = plannedMinutes ? startTime + plannedMinutes * 60000 : null;
  state.activeRentals[unitId] = { startTime, customerName: customerName || "Tamu", memberId: memberId || null, note: note || "", endTime };
  window._alertedUnits.delete(unitId);
  const unit = state.units.find(u => u.id === unitId);
  if (unit) unit.status = "active";
  closeModal();
  renderAll();
  persistActive(); persistUnits();
  flash(`${unit ? unit.name : "Unit"} mulai disewa${endTime ? ` — durasi ${plannedMinutes} menit` : ""}`);
}

function extendRental(unitId, addMinutes) {
  const session = state.activeRentals[unitId];
  if (!session || !addMinutes) return;
  const base = session.endTime && session.endTime > Date.now() ? session.endTime : Date.now();
  session.endTime = base + addMinutes * 60000;
  window._alertedUnits.delete(unitId);
  closeModal();
  renderAll();
  persistActive();
  flash("Waktu sewa diperpanjang.");
}

function finishRental(unitId, payment, discount, frozenMs) {
  const session = state.activeRentals[unitId];
  const unit = state.units.find(u => u.id === unitId);
  if (!session || !unit) return;
  const ms = frozenMs != null ? frozenMs : Date.now() - session.startTime;
  const minutes = Math.max(1, Math.round(ms / 60000));
  const rawAmount = (minutes / 60) * unit.rate;
  const amount = Math.max(0, Math.round(rawAmount - (discount || 0)));

  const trx = {
    id: uid(), unitId: unit.id, unitName: unit.name,
    branchId: unit.branchId || ensureSelectedBranch(),
    branchName: unit.branchName || getBranchName(unit.branchId || ensureSelectedBranch()),
    customerName: session.customerName,
    // PENTING: `end` HARUS waktu beneran sekarang (Date.now()), bukan
    // session.startTime + ms. Untuk sewa paket durasi tetap (isFixed), `ms`
    // yang dikirim ke sini adalah DURASI PENUH PAKET (buat ngunci harganya,
    // itu sengaja) — bukan durasi aktual yang udah lewat. Kalau paket itu
    // diselesaikan lebih cepat dari jadwalnya, session.startTime + ms bakal
    // jatuh ke MASA DEPAN (tanggal paket seharusnya kelar), padahal
    // transaksinya beneran dicatat & dibayar hari ini. Ini yang bikin
    // transaksi "nyasar" ke tanggal yang salah di laporan/dashboard.
    memberId: session.memberId || "", start: session.startTime, end: Date.now(),
    minutes, amount, payment, note: session.note,
  };
  state.transactions.unshift(trx);
  delete state.activeRentals[unitId];
  window._alertedUnits.delete(unitId);
  unit.status = "available";

  if (session.memberId) {
    const m = state.members.find(x => x.id === session.memberId);
    if (m) { m.visits = (m.visits || 0) + 1; m.totalSpent = (m.totalSpent || 0) + amount; }
  }

  renderAll();
  persistTransactions(); persistActive(); persistUnits();
  if (session.memberId) persistMembers();
  flash(`Sewa ${unit.name} selesai — ${rupiah(amount)}`);
  maybeNotifyQueueForUnit(unitId, unit.name);
  openReceiptModal(trx);
}

// Cetak dibikin lewat window terpisah (bukan window.print() langsung di
// halaman utama) supaya hasil print cuma struknya doang — gak ikut kebawa
// sidebar/menu, dan lebarnya dibikin mirip kertas thermal printer (58/80mm).
function printReceipt(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;
  const w = window.open("", "_blank", "width=380,height=600");
  if (!w) { flash("Popup diblokir browser — izinkan popup buat cetak struk."); return; }
  const rows = [
    ["Tanggal", `${fmtDateID(trx.end)}, ${fmtTimeID(trx.end)}`],
    ["Penyewa", trx.customerName],
    ["Unit", trx.unitName],
    ["Durasi", fmtHMS(trx.minutes * 60000)],
    ["Metode bayar", trx.payment],
  ];
  if (trx.note) rows.push(["Catatan", trx.note]);
  w.document.write(`<!DOCTYPE html><html><head><title>Struk - ${esc(trx.unitName)}</title><style>
    @page{ margin: 8mm; }
    body{ font-family:'Courier New',monospace; font-size:12px; width:280px; margin:0 auto; padding:12px; color:#000; }
    h1{ font-size:14px; text-align:center; margin:0 0 2px; }
    .sub{ text-align:center; font-size:11px; margin-bottom:10px; }
    .row{ display:flex; justify-content:space-between; gap:10px; margin:3px 0; }
    .line{ border-top:1px dashed #000; margin:8px 0; }
    .total{ font-size:14px; font-weight:bold; }
    .foot{ text-align:center; margin-top:14px; font-size:11px; }
  </style></head><body>
    <h1>${esc(state.settings.businessName)}</h1>
    <div class="sub">${esc(trx.branchName || "")}</div>
    <div class="line"></div>
    ${rows.map(([l, v]) => `<div class="row"><span>${esc(l)}</span><span>${esc(v)}</span></div>`).join("")}
    <div class="line"></div>
    <div class="row total"><span>TOTAL</span><span>${rupiah(trx.amount)}</span></div>
    <div class="foot">Terima kasih!</div>
  </body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
}
function saveNewCustomerFromReceipt(trxId) {
  const trx = state.transactions.find(t => t.id === trxId);
  if (!trx) return;

  state.members.push({ id, name: trx.customerName, phone, visits: 1, totalSpent: trx.amount, joined: Date.now() });
  trx.memberId = id;
  persistMembers(); persistTransactions();
  renderAll();
  const box = document.getElementById("receipt-save-customer");
  if (box) box.innerHTML = `<p class="rp-dim" style="margin-top:12px;">${icon("info",13)} Tersimpan sebagai pelanggan baru.</p>`;
  flash("Pelanggan baru disimpan.");
}

function upsertUnit(unit) {
  const idx = state.units.findIndex(u => u.id === unit.id);

}
function removeUnit(id) {

}
function toggleMaint(id) {
  const u = state.units.find(x => x.id === id);

  u.status = u.status === "maintenance" ? "available" : "maintenance";

}

function upsertMember(m) {
  const idx = state.members.findIndex(x => x.id === m.id);
  if (idx >= 0) state.members[idx] = { ...state.members[idx], ...m };
  else state.members.push({ ...m, visits: 0, totalSpent: 0, joined: Date.now() });

}
function removeMember(id) { state.members = state.members.filter(m => m.id !== id); renderAll(); persistMembers(); }

function upsertInventory(item) {

function getVisibleQueue(){ const bid=ensureSelectedBranch(); return state.queue.filter(q=>(q.branchId||getBranches()[0].id)===bid); }
function addToQueue(customerName, phone, unitId, note) {

function removeFromQueue(id) {

function maybeNotifyQueueForUnit(unitId, unitName) {
  const unit = state.units.find(u => u.id === unitId);
  const branchId = unit ? (unit.branchId || getBranches()[0].id) : null;
  const waiting = state.queue.filter(q => (q.branchId||getBranches()[0].id) === branchId && (q.unitId === unitId || !q.unitId));
  if (!waiting.length) return;
  setTimeout(() => {
    flash(`${waiting[0].customerName} sedang mengantre — ${unitName} baru saja kosong.`);
  }, 700);

function openQueueModal(prefUnitId) {
  const visibleUnits = getVisibleUnits();

function openTrendPointModal(period, startMs, index) {
  window._trendMobileIndex = null;

  const start = new Date(startMs);
  let rangeStart, rangeEnd, label;
  if (period === "minggu") {
    const d = new Date(start); d.setDate(start.getDate() + index); d.setHours(0,0,0,0);
    rangeStart = d.getTime();
    const e = new Date(d); e.setHours(23,59,59,999);
    rangeEnd = e.getTime();
    label = d.toLocaleDateString("id-ID", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
  } else if (period === "tahun") {
    const year = start.getFullYear();
    rangeStart = new Date(year, index, 1).getTime();
    rangeEnd = new Date(year, index + 1, 0, 23, 59, 59, 999).getTime();
    label = new Date(year, index, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  } else {
    const year = start.getFullYear(), month = start.getMonth();
    rangeStart = new Date(year, month, index + 1).getTime();
    rangeEnd = new Date(year, month, index + 1, 23, 59, 59, 999).getTime();
    label = new Date(year, month, index + 1).toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" });
  }
  const tx = state.transactions.filter(t => { const jt = toJakarta(t.end).getTime(); return jt >= rangeStart && jt <= rangeEnd; });
  const total = tx.reduce((a,t) => a+t.amount, 0);
  const rows = tx.map(t => `<tr><td>${fmtTimeID(t.end)}</td><td>${esc(t.branchName || getBranchName(t.branchId))}</td><td>${esc(t.unitName)}</td><td>${esc(t.customerName)}</td><td class="rp-mono">${t.minutes} mnt</td><td class="rp-mono">${rupiah(t.amount)}</td></tr>`).join("");
  openModal(modalShell(`Rincian — ${label}`, `
    <p class="rp-sub">${tx.length} transaksi · total ${rupiah(total)}</p>
    <div class="rp-table-wrap"><table class="rp-table">
      <thead><tr><th>Jam</th><th>Cabang</th><th>Unit</th><th>Penyewa</th><th>Durasi</th><th>Total</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6">${emptyState("Tidak ada transaksi pada tanggal ini.")}</td></tr>`}</tbody>
    </table></div>
  `));
}

let _resetTitleClicks = 0;

const RESET_CATEGORIES = [

  { key: "Settings", label: "Cabang, tarif dasar, & akun kasir (kembali ke setelan awal)" },

function openResetDataModal() {
  const rows = RESET_CATEGORIES.map(c => `
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer;">

    <label class="rp-field" style="margin-top:14px;">

    </label>
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
      <button class="rp-btn" style="background:var(--rp-red);color:var(--rp-btn-text);" onclick="executeDataReset()">Reset sekarang</button>
    </div>
  `));
}
async function executeDataReset() {
  const selected = Array.from(document.querySelectorAll(".reset-cat-chk:checked")).map(c => c.value);
  if (!selected.length) { flash("Pilih minimal 1 jenis data dulu."); return; }
  const confirmText = (document.getElementById("reset-confirm-text")?.value || "").trim().toUpperCase();
  if (confirmText !== "HAPUS") { flash('Ketik "HAPUS" persis untuk konfirmasi.'); return; }
  closeModal();
  flash("Menghapus data…");
  try {
    for (const key of selected) {
      if (key === "Settings") {
        await docRef("Settings").set({ rows: [{
          businessName: "Rental PS Saya", defaultRate: 5000,
          branches: [{ id: "branch-main", name: "Cabang Utama" }], cashiers: []
        }] });
      } else {
        await docRef(key).set({ rows: [] });
      }
    }
    flash("Data terpilih berhasil direset.");
  } catch (e) {
    console.error(e);
    flash("Gagal mereset data — cek koneksi internet.");
  }
}

// Dipakai tombol "Mulai sewa" di rel aksi cepat (sisi kiri, laptop/desktop):
// buka form mulai sewa, TAPI dikasih dropdown pilih unit (bukan langsung
// otomatis ke unit kosong pertama) — jadi kasir/admin tetep bisa milih unit

function quickStartRental() {
  const unit = getVisibleUnits().find(u => u.status === "available");

}
function switchStartUnit(newUnitId) {
  if (!newUnitId) return;
  openStartModal(newUnitId, true);
}
function openStartModal(unitId, withUnitPicker) {
  const unit = state.units.find(u => u.id === unitId);
  if (!unit) return;
  const memberOptions = state.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const unitPickerHtml = withUnitPicker ? `
    <label class="rp-field"><span>Unit</span>
      <select id="start-unit" onchange="switchStartUnit(this.value)">
        ${getVisibleUnits().filter(u => u.status === "available").map(u => `<option value="${u.id}" ${u.id===unitId?"selected":""}>${esc(u.name)} — ${rupiah(u.rate)}/jam</option>`).join("")}
      </select>
    </label>` : "";
  openModal(modalShell(`Mulai sewa — ${esc(unit.name)}`, `
    ${unitPickerHtml}
    <div class="rp-field-row">
      <button id="mode-guest" class="rp-pill is-on" onclick="setStartMode('guest')">Tamu baru</button>
      <button id="mode-member" class="rp-pill" onclick="setStartMode('member')">Pelanggan terdaftar</button>
    </div>
    <div id="start-mode-body">
      <label class="rp-field"><span>Nama tamu</span><input id="start-name" placeholder="Cth: Rio" /></label>
    </div>
    <label class="rp-field"><span>Catatan (opsional)</span><input id="start-note" placeholder="Cth: bawa 2 stik" /></label>
    <div class="rp-field-row">
      <button id="dur-none" class="rp-pill is-on" onclick="setDurationMode('none')">Tanpa batas</button>
      <button id="dur-fixed" class="rp-pill" onclick="setDurationMode('fixed')">Atur durasi</button>
    </div>
    <div id="duration-body"></div>
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
      <button class="rp-btn rp-btn-start" onclick="confirmStart('${unitId}')">${icon("play",14)} Mulai sekarang</button>
    </div>
  `));
  window._startMode = "guest";
  window._durationMode = "none";
  window._memberOptionsHtml = memberOptions;
}
function setStartMode(mode) {
  window._startMode = mode;
  document.getElementById("mode-guest").className = "rp-pill" + (mode === "guest" ? " is-on" : "");
  document.getElementById("mode-member").className = "rp-pill" + (mode === "member" ? " is-on" : "");
  const body = document.getElementById("start-mode-body");
  if (mode === "guest") {
    body.innerHTML = `<label class="rp-field"><span>Nama tamu</span><input id="start-name" placeholder="Cth: Rio" /></label>`;
  } else {
    body.innerHTML = `<label class="rp-field"><span>Pilih pelanggan</span><select id="start-member">${window._memberOptionsHtml || '<option value="">Belum ada pelanggan</option>'}</select></label>`;
  }
}
function setDurationMode(mode) {
  window._durationMode = mode;
  document.getElementById("dur-none").className = "rp-pill" + (mode === "none" ? " is-on" : "");
  document.getElementById("dur-fixed").className = "rp-pill" + (mode === "fixed" ? " is-on" : "");
  const body = document.getElementById("duration-body");
  if (mode === "fixed") {
    body.innerHTML = `
      <div class="rp-field-row">
        <label class="rp-field"><span>Jam</span><input id="dur-hours" type="number" min="0" value="1" /></label>
        <label class="rp-field"><span>Menit</span><input id="dur-minutes" type="number" min="0" max="59" value="0" /></label>
      </div>
      <div class="rp-field-row">
        ${[30,60,90,120,180].map(m => `<button type="button" class="rp-pill" onclick="setDurationPreset(${m})">${m<60?m+" mnt":(m/60)+" jam"}</button>`).join("")}
      </div>`;
  } else {
    body.innerHTML = "";
  }
}
function setDurationPreset(mins) {
  document.getElementById("dur-hours").value = Math.floor(mins/60);
  document.getElementById("dur-minutes").value = mins % 60;
}
function confirmStart(unitId) {
  let plannedMinutes = null;
  if (window._durationMode === "fixed") {
    const h = Number(document.getElementById("dur-hours").value) || 0;
    const m = Number(document.getElementById("dur-minutes").value) || 0;
    plannedMinutes = h * 60 + m;
    if (plannedMinutes <= 0) { flash("Durasi harus lebih dari 0 menit."); return; }
  }
  if (window._startMode === "member") {
    const sel = document.getElementById("start-member");
    const memberId = sel ? sel.value : "";
    if (!memberId) { flash("Pilih pelanggan terlebih dahulu."); return; }
    const m = state.members.find(x => x.id === memberId);
    startRental(unitId, m ? m.name : "Tamu", memberId || null, document.getElementById("start-note").value, plannedMinutes);
  } else {
    const name = document.getElementById("start-name").value.trim();
    if (!name) { flash("Nama tamu wajib diisi."); return; }
    startRental(unitId, name, null, document.getElementById("start-note").value, plannedMinutes);
  }
}

function openFinishModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;
  clearInterval(window._alarmTick);
  const isFixed = !!session.endTime;
  // Untuk sewa berdurasi tetap, harga dikunci sesuai paket yang dipilih di awal —
  // tidak dihitung dari waktu aktual berjalan, biar tidak ada "argo jalan".
  const ms = isFixed ? (session.endTime - session.startTime) : (Date.now() - session.startTime);
  window._finishStop = { unitId, ms, isFixed };
  openModal(modalShell(`Selesaikan sewa — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Durasi</span><strong class="rp-mono" id="finish-duration">${fmtHMS(ms)}</strong></div>
      <div class="rp-receipt-row"><span>Tarif</span><strong class="rp-mono">${rupiah(unit.rate)}/jam</strong></div>
      <div class="rp-receipt-line"></div>
      <div class="rp-receipt-row rp-receipt-total"><span>Total</span><strong class="rp-mono" id="finish-total">${rupiah(ms/3600000*unit.rate)}</strong></div>
    </div>

function updateFinishTotal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  if (!unit || !window._finishStop || window._finishStop.unitId !== unitId) return;
  const discount = Number(document.getElementById("finish-discount").value) || 0;
  const amount = Math.max(0, Math.round(window._finishStop.ms / 3600000 * unit.rate - discount));
  const el = document.getElementById("finish-total");
  if (el) el.textContent = rupiah(amount);
}
function confirmFinish(unitId) {

/* --------------------- Alarm & perpanjang waktu --------------------- */
window._alertedUnits = window._alertedUnits || new Set();

function checkRentalAlarms() {
  const now = Date.now();
  Object.entries(state.activeRentals).forEach(([unitId, session]) => {
    if (!session.endTime) return;
    const remaining = session.endTime - now;
    if (remaining <= 10 * 60000 && !window._alertedUnits.has(unitId)) {
      window._alertedUnits.add(unitId);
      triggerRentalAlarm(unitId);
    }
  });
}
setInterval(checkRentalAlarms, 1000);

function playAlarmBeep() {
  try {
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    [0, 0.32, 0.64].forEach(delay => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = 880; g.gain.value = 0.16;
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.22);
    });
  } catch (e) { console.error(e); }
}

function triggerRentalAlarm(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;
  playAlarmBeep();
  try {
    if ("Notification" in window) {
      if (Notification.permission === "granted") {
        new Notification("⏰ Waktu sewa hampir habis", { body: `${unit.name} — sisa waktu tinggal sedikit.` });
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    }
  } catch (e) { /* abaikan jika notifikasi tidak didukung */ }
  openAlarmModal(unitId);
}

function openAlarmModal(unitId) {
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session || !session.endTime) return;
  clearInterval(window._alarmTick);
  openModal(modalShell(`⏰ Waktu hampir habis — ${esc(unit.name)}`, `
    <div class="rp-receipt">
      <div class="rp-receipt-row"><span>Penyewa</span><strong>${esc(session.customerName)}</strong></div>
      <div class="rp-receipt-row"><span>Sisa waktu</span><strong class="rp-mono" id="alarm-remaining">${fmtHMS(Math.abs(session.endTime - Date.now()))}</strong></div>
    </div>
    <p class="rp-sub">Sewa akan segera berakhir. Perpanjang waktu, atau sudah selesai dan mau dibayar?</p>
    <div class="rp-modal-foot" style="justify-content:space-between;">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Nanti dulu</button>
      <button class="rp-btn rp-btn-ghost" onclick="openExtendModal('${unitId}')">${icon("history",14)} Perpanjang</button>
      <button class="rp-btn rp-btn-stop" onclick="openFinishModal('${unitId}')">${icon("stop",14)} Sudah Selesai</button>
    </div>
  `));
  window._alarmTick = setInterval(() => {
    const el = document.getElementById("alarm-remaining");
    if (!el) { clearInterval(window._alarmTick); return; }
    const rem = session.endTime - Date.now();
    el.textContent = (rem <= 0 ? "Lewat " : "") + fmtHMS(Math.abs(rem));
  }, 1000);
}

function openExtendModal(unitId) {
  clearInterval(window._alarmTick);
  const unit = state.units.find(u => u.id === unitId);
  const session = state.activeRentals[unitId];
  if (!unit || !session) return;
  openModal(modalShell(`Perpanjang sewa — ${esc(unit.name)}`, `
    <div class="rp-field-row">
      <label class="rp-field"><span>Tambah jam</span><input id="extend-hours" type="number" min="0" value="1" /></label>
      <label class="rp-field"><span>Tambah menit</span><input id="extend-minutes" type="number" min="0" max="59" value="0" /></label>
    </div>
    <div class="rp-field-row">
      ${[15,30,60,120].map(m => `<button type="button" class="rp-pill" onclick="setExtendPreset(${m})">${m<60?m+" mnt":(m/60)+" jam"}</button>`).join("")}
    </div>
    <div class="rp-modal-foot">
      <button class="rp-btn rp-btn-ghost" onclick="closeModal()">Batal</button>
      <button class="rp-btn rp-btn-start" onclick="confirmExtend('${unitId}')">${icon("play",14)} Perpanjang</button>
    </div>
  `));
}
function setExtendPreset(mins) {
  document.getElementById("extend-hours").value = Math.floor(mins/60);

}
function confirmExtend(unitId) {

// Preview lokal dulu (belum diupload) pakai FileReader, biar kasir langsung
// lihat hasil foto sebelum klik Simpan. Upload beneran ke Cloudinary baru
// terjadi pas submitInventory() dipanggil.
function previewInventoryPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { flash("Ukuran foto maksimal 5MB."); e.target.value = ""; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const box = document.getElementById("inv-photo-preview");
    if (box) box.innerHTML = `<img src="${reader.result}" alt="" style="width:100%;max-width:160px;border-radius:8px;display:block;" />`;
  };
  reader.onerror = () => flash("Gagal membaca file foto.");
  reader.readAsDataURL(file);
}
async function submitInventory(id) {
  const name = document.getElementById("inv-name").value.trim();
  if (!name) { flash("Nama item wajib diisi."); return; }
  const fileInput = document.getElementById("inv-photo-file");
  const file = fileInput && fileInput.files[0];
  let photoUrl = document.getElementById("inv-photo-url").value || "";
  const btn = document.getElementById("inv-save-btn");
  let photoFailed = false;
  if (file) {
    if (btn) { btn.disabled = true; btn.textContent = "Mengunggah foto…"; }
    try {
      photoUrl = await uploadToCloudinary(file);
    } catch (err) {
      console.error(err);
      photoFailed = true;
      flash("Item disimpan, tapi upload foto gagal: " + (err && err.message ? err.message : "cek koneksi internet."));
    }
    if (btn) { btn.disabled = false; btn.textContent = "Simpan"; }
  }
  upsertInventory({
    id, name,
    category: document.getElementById("inv-category").value,
    unitId: document.getElementById("inv-unit").value,
    condition: document.getElementById("inv-condition").value,
    note: document.getElementById("inv-note").value,
    photoUrl,
    lastCheck: Date.now(),
  });
}

function tickDashboardTimers() {
  if (currentTab !== "dashboard") return;
  document.querySelectorAll(".js-timer").forEach(el => {
    if (el.dataset.mode === "countdown") {
      const end = Number(el.dataset.end);
      const remaining = end - Date.now();
      const over = remaining <= 0;
      el.textContent = (over ? "-" : "") + fmtHMS(Math.abs(remaining));
      el.classList.toggle("is-warning", !over && remaining <= 10*60000);
      el.classList.toggle("is-over", over);
    } else {
      const start = Number(el.dataset.start);
      el.textContent = fmtHMS(Date.now() - start);
    }
  });
  document.querySelectorAll(".js-cost").forEach(el => {
    if (el.dataset.fixed === "1") return;
    const start = Number(el.dataset.start);
    const rate = Number(el.dataset.rate);
    const cost = (Date.now() - start) / 3600000 * rate;
    el.textContent = "≈ " + rupiah(cost);
  });
}
setInterval(tickDashboardTimers, 1000);

function upsertBranch(branch){
  const bs=getBranches(); const idx=bs.findIndex(b=>b.id===branch.id);
  if(idx>=0)bs[idx]=branch;else bs.push(branch);
  state.settings.branches=bs; selectedBranchId=branch.id;
  state.units.forEach(u=>{if(u.branchId===branch.id)u.branchName=branch.name;});

// Sama kayak previewInventoryPhoto: preview lokal dulu pakai FileReader,
// upload ke Cloudinary beneran baru pas Simpan diklik.
function previewBranchPhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){flash("Ukuran foto maksimal 5MB.");e.target.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const box=document.getElementById("branch-photo-preview");
    if(box)box.innerHTML=`<img src="${reader.result}" alt="" style="width:100%;max-width:220px;border-radius:8px;display:block;" />`;
  };
  reader.onerror=()=>flash("Gagal membaca file foto.");
  reader.readAsDataURL(file);
}
function clearBranchPhoto(){
  const urlInput=document.getElementById("branch-photo-url"); if(urlInput)urlInput.value="";
  const fileInput=document.getElementById("branch-photo-file"); if(fileInput)fileInput.value="";
  const box=document.getElementById("branch-photo-preview"); if(box)box.innerHTML="";
}
async function submitBranch(id){
  const name=document.getElementById("branch-name").value.trim();
  if(!name){flash("Nama cabang wajib diisi.");return;}
  const fileInput=document.getElementById("branch-photo-file");
  const file=fileInput&&fileInput.files[0];
  let photoUrl=document.getElementById("branch-photo-url").value||"";
  const btn=document.getElementById("branch-save-btn");
  if(file){
    if(btn){btn.disabled=true;btn.textContent="Mengunggah foto…";}
    try{
      photoUrl=await uploadToCloudinary(file);
    }catch(err){
      console.error(err);
      flash("Cabang disimpan, tapi upload foto gagal: "+(err&&err.message?err.message:"cek koneksi internet."));
    }
    if(btn){btn.disabled=false;btn.textContent="Simpan";}
  }
  upsertBranch({id,name,photoUrl});
}

// aktif global) supaya admin bisa memilih "Semua Cabang" tanpa mengubah
// cabang yang dipakai di menu lain (kasir, unit, dsb).
function getLaporanBranchId() {
  if (!window._laporanBranchId) window._laporanBranchId = "ALL";
  if (window._laporanBranchId !== "ALL" && !getBranches().some(b => b.id === window._laporanBranchId)) {
    window._laporanBranchId = "ALL";
  }
  return window._laporanBranchId;

function setLaporanBranch(value) {

  renderAll();
